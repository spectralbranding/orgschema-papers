- claim_id: P3
  status: supported
  notes: ANALYTICAL (primary). Against a systematic comparison of six adjacent traditions on four properties
    (ex-ante vs ex-post; experience-layer vs process-layer; machine-checkable vs manual; backward-traceable
    vs not), OST is the only artifact for which all four hold jointly. Each named tradition lacks the
