acceptance:
- claim_id: P1
  criterion: 'Holds if an OST specification is a typed directed acyclic justification graph G = (V, E):
    vertices are contracts typed by level (L0 experience, L1 signal, L2 process, L3-L5 implementation);
    a directed "justifies" edge links a lower-level vertex to the higher-level contract it serves, carrying
    verifiability metadata (machine-checkable predicate, executor-type).'
  falsification: If experience-layer acceptance cannot be expressed as a machine-checkable predicate attached
    to a graph vertex, the graph model does not apply to that domain.
- claim_id: P2
  criterion: Holds if specification waste is exactly the set of vertices from which no directed path reaches
    an L0 acceptance contract; it is identified by a single reverse reachability pass from the L0 sinks.
  falsification: A parameter with no upward trace that is nonetheless demonstrably required for an L0
    outcome would refute the unjustified=wasteful identification.
- claim_id: P3
  criterion: Holds if cascade-compression is lossy under asymmetric verifiability.
  falsification: A lossless level-collapsing map preserving completeness and executor-invariance at alpha
    < 1 would refute the compression bound.
- claim_id: P4
  criterion: 'Holds if fix a reference class R(v, t) for candidate L0 vertex v at time t: the specifiers
    other than the focal organization who carry an equivalent vertex in their own justification graph,
    intersected with the stakeholders who condition acceptance on v.'
  falsification: A vertex that is UNCLAIMED, machine-checkable, and demonstrably stakeholder-relevant,
    yet produces no differentiation utility for the specifying organization even before any member of
    R imitates it, would refute the UNCLAIMED-regime differentiation claim.
- claim_id: H1
  criterion: 'Holds if hYPOTHESIS (future research, not tested here): operations specified with backward
    traceability identify the operational parameter responsible for an experience failure faster than
    operations without it, because the justification graph makes the causal chain traversable.'
  falsification: See lead test above; also, no measured reduction in time-to-root-cause under matched
    conditions.
- claim_id: H4
  criterion: 'Holds if hYPOTHESIS (future research, not tested here): the differentiation utility an organization
    captures from an UNCLAIMED L0 vertex (P4) decays as reference-class adoption moves the vertex toward
    CONTESTED and then FLOOR.'
  falsification: See lead test above; also, differentiation share attributable to v remaining flat or
    rising after >=2 reference-class members adopt an equivalent vertex, holding v's threshold constant,
    would refute the decay claim.
