results:
- claim_id: P1
  status: supported
  notes: ANALYTICAL (primary). Against a systematic comparison of six adjacent traditions on four properties
    (ex-ante vs ex-post; experience-layer vs process-layer; machine-checkable vs manual; backward-traceable
    vs not), OST is the only artifact for which all four hold jointly. Each named tradition lacks the
    joint property for a stated structural reason, not by oversight. This establishes the contribution
    as a graded increase in machine-checkable experience-linkage coverage and a reduction in validation
    latency from periodic to continuous — not a monolithic "none does X" claim.
- claim_id: P2
  status: supported
