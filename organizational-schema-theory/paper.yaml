- claim_id: P4
  status: supported
  notes: 'BOUNDARY OBJECTS. The artifact explains four phenomena that conformance checking, balanced scorecards,
    and cybernetic control leave anomalous: (i) persistent strategy-execution gaps despite mature EA/BPM
    tooling (missing L0 experience contracts + no continuous trace validation); (ii) the differential
    coordination success of "working-backwards" cultures versus matrix organizations (executor-invariance
    + forkability); (iii) the outcome-coherent forking of certain open-source organizational forms (shareable
    test suite without prescribed procedure); (iv) why publicly auditable process disclosures shift stakeholder
    preference where an unverifiable claim of the same content does not — OST reads the difference as
    whether the disclosed content is a genuine, DP2-compliant L0 vertex or an assertion outside the graph
    (DP6, P4).'
