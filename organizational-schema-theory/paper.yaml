meta:
  title: 'Machine-Checkable Acceptance Contracts for Organizational Design: A Design-Science Theory of
    Specification Cascades'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.18946043
  date: '2026-07-27'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - design science research
  - organizational design
  - acceptance testing
  - specification cascade
  - backward traceability
  - executor-invariance
  abstract: 'Organizations possess many mechanisms that touch on quality and control: quality-management
    systems, enterprise-architecture frameworks, balanced scorecards, business-process conformance checking,
    requirements engineering, and cybernetic control. Each verifies process conformance or lagging outcomes.
    None makes a machine-checkable, ex-ante acceptance contract at the experience layer with backward
    traceability a structural invariant of the specification. This paper develops Organizational Schema
    Theory (OST), a design-science artifact that supplies this property through a six-level specification
    cascade in which stakeholder-experience contracts function as acceptance tests, signal requirements
    as integration tests, and process contracts as unit tests, with executor-invariance and continuous
    validation. The artifact is stated as six design principles, four mechanisms, and six boundary conditions,
    and formalized as a typed directed acyclic justification graph on which traceability, waste, cascade-compression,
    and reference-class relativity are decidable or falsifiable properties; a smallest-sufficient model
    gives a compression-impossibility sketch. Following the design-science evaluation taxonomy, the artifact
    is evaluated analytically, through independent industry convergence, and through a public demonstration
    corpus, with no controlled-outcome claim. The contribution is nascent design theory: acceptance testing
    operationalized as a tool-checkable invariant of organizational specification.'
claims:
- id: P1
  type: proposition
  statement: 'An OST specification is a typed directed acyclic justification graph G = (V, E): vertices
    are contracts typed by level (L0 experience, L1 signal, L2 process, L3-L5 implementation); a directed
    "justifies" edge links a lower-level vertex to the higher-level contract it serves, carrying verifiability
    metadata (machine-checkable predicate, executor-type). The graph satisfies two invariants — completeness
    (every non-L0 vertex has a directed path terminating at an L0 vertex) and acyclicity — both decidable
    by graph traversal in time linear in |V| + |E|.'
  testable: true
  tested_in_paper: true
  status: not_tested
- id: P2
  type: proposition
  statement: Specification waste is exactly the set of vertices from which no directed path reaches an
    L0 acceptance contract; it is identified by a single reverse reachability pass from the L0 sinks.
    This gives Ohno's waste an ex-ante, structural definition at the specification layer (a parameter
    is wasteful if unjustified), distinct from lag-outcome waste measured after production.
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P1
- id: P3
  type: proposition
  statement: 'Cascade-compression is lossy under asymmetric verifiability. In the smallest sufficient
    model (levels L0, L2, L4; two negotiating modules; a binary human/AI executor; one information-asymmetry
    parameter alpha governing how much of a lower level is inspectable from above), no many-to-one mapping
    that collapses adjacent levels preserves both completeness (P1) and executor-invariance (DP3) whenever
    alpha is below unity: collapsing L2 into L0 discards the executor-invariant/executor-dependent boundary.
    The full compression bound is the geometric coverage-impossibility of the companion formal result;
    here it is a proof sketch reviewers can attack, with the full proof deferred to that companion paper.'
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P1
- id: P4
  type: proposition
  statement: 'Fix a reference class R(v, t) for candidate L0 vertex v at time t: the specifiers other
    than the focal organization who carry an equivalent vertex in their own justification graph, intersected
    with the stakeholders who condition acceptance on v. Every candidate v falls into exactly one of three
    regimes with respect to R(v, t): FLOOR (v is carried by approximately all of R at a converged threshold
    — no differentiation available, entry cost only); CONTESTED (v is carried by some of R at varying
    thresholds — differentiation is value-relative, the winning threshold set against R''s observed distribution
    rather than derived independently); UNCLAIMED (v is carried by none of R — differentiation is scope-relative,
    specifying v at all is the competitive move, conditional on v meeting DP2''s machine-checkability
    requirement). A vertex migrates UNCLAIMED -> CONTESTED -> FLOOR as members of R imitate a successful
    scope-expansion; absent a change in what stakeholders condition acceptance on, migration runs one
    way.'
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P1
  - P2
- id: H1
  type: proposition
  statement: 'HYPOTHESIS (future research, not tested here): operations specified with backward traceability
