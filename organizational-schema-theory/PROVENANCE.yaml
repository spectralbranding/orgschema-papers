  versions:
    - version: "1.0.0"
      date: "2026-03-05"
      description: >
        Initial draft. Six-level cascade, contract-procedure separation,
        reference service deployment, prior-art lineage table, Design Science
        Research framing, FEDS evaluation strategy.
    - version: "1.2.0"
      date: "2026-04-01"
      description: >
        Organization-theory framing restructuring. Added references (Simon,
        Galbraith, Thompson, Mintzberg, Crozier) and restructured for IS /
        org-theory dual readership with DSR as the primary methodological frame.
    - version: "1.3.0"
      date: "2026-04-11"
      description: >
        Added the Structural Property Matrix subsection: a twelve-property
        comparison across seven adjacent methodologies with explicit two-sided
        framing on structural properties versus practical adoption. No changes
        to abstract, propositions, methodology, evaluation, or claims.
    - version: "2.0.0"
      date: "2026-07-20"
      description: >
        Major reconceptualization. Reframed to a machine-checkable, ex-ante
        experience-layer acceptance contract with backward traceability, stated
        as a design-science artifact (five design principles, four mechanisms,
        five boundary conditions) and formalized as a typed directed acyclic
        justification graph on which traceability, waste, executor-invariance,
        and cascade-compression are decidable properties. Three-strand FEDS
        evaluation (analytical, two independent naturalistic cases, and a public
        demonstration), with no controlled-outcome claim. New title; references
        regenerated from the corpus substrate.

