limitations:
- description: 'The apparatus is static (scope condition iv): regime transitions in which T_6 enactment
    retroactively reshapes T_1 (Weick enactment) require a dynamic extension with a longer-horizon Pi_{6->1}-style
    operator that is outside the present paper and flagged as future work.'
  severity: moderate
  addressable: true
- description: Whether the strict-inequality (junction-interaction) regime is empirically modal across
    firms is a question the apparatus poses but does not answer; the §3.5 illustration realizes it on
    one constructed cascade only.
  severity: moderate
  addressable: true
- description: The cascade is silent on (a) which tier any specific firm should intervene at, (b) the
    absolute magnitude of any specific r_i, and (c) the constants kappa_i and L_i in any regime — all
    empirical primitives to be measured firm-by-firm. The cascade organizes data; it does not substitute
    for measurement, and contraction-constant estimators do not yet exist.
  severity: moderate
  addressable: true
- description: The empirical illustration (Path B) is deferred to a companion empirical paper (PROJECTION_PAPER_PHASE2_EMPIRICAL_FRAMEWORK.md);
