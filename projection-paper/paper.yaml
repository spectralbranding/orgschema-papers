meta:
  title: 'The Projection Cascade: Why Reorganizations Fail When the Specification Cascade Doesn''t'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.19145205
