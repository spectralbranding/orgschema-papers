propositions:
  - id: "P1"
    name: "Cascade-Distance Scaling of Reorganization-Failure Rate"
    statement: >
      Reorganizations that intervene at tier i produce changes at the observable
      surface T_6 at a magnitude that decays geometrically in cascade-distance
      (6 - i) through the contraction-constant product of Theorem 1.
  - id: "P2"
    name: "Strict Downward Propagation of Basis Rotation Under AI Deployment"
    statement: >
      AI deployment inducing a basis rotation at Π_{5→6} affects perceptual
      content P_p of the position triple while leaving authority allocation A_p
      and role expectation R_p invariant, provided the deployment does not
      penetrate the legal-personhood floor at T_3 or cultural floor at T_1.
  - id: "P3"
    name: "Variance Amplification with Cascade Distance"
    statement: >
      The variance of T_6 outcomes from an upstream perturbation scales
      geometrically with cascade-distance, bounded above by the squared
      cumulative Lipschitz product from the perturbation tier to T_6.
  - id: "P4"
    name: "Algebraic Decoupling Bound at Layer Junctions"
    statement: >
      Per-junction nullities are sub-additive (r_total ≤ Σ r_i); strict
      inequality identifies the partial-absorption (kernel-interaction) regime,
      empirically distinguishable from the decoupled-junction assumption
      implicit in existing design theories.

