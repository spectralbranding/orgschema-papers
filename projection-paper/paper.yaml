methodology:
  type: mixed
  design: 'Explicit six-tier numerical construction with dimensions (d_1..d_6) = (4,4,3,3,2,2): all operator
    matrices Pi_{i->i+1} and feedback operators A_{i+1->i} are deterministic draws from numpy.random.default_rng(2026);
    A rescaled so ||Pi o A||_op equals a target kappa_i in {.30,.40,.50,.35,.45}; Pi_{1->2} constructed
    rank-deficient by one to realize Corollary 1''s strict-inequality case. Closed-form Lipschitz analysis
    kappa_i = ||Pi o A||_op, L_i = ||(I - Pi o A) o Pi||_op; parametric Banach iteration with tolerance
    1e-10. Restriction-comparison run (--compare flag): each of the five design-theory restrictions is
    run on the same seed-2026 dimensions with its active-junction pattern, computing each restriction''s
    P3 amplification product and whether it can detect P4 strict inequality through its active junctions.'
  analysis:
    software: code/cascade_numerical_example.py
    method: Python 3.12 + numpy via uv
