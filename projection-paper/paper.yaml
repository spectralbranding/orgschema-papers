  keywords:
  - organizational design
  - projection cascade
  - cascade equilibrium
  - information loss
  - rank deficiency
  - position formalization
  - reorganization failure
  - AI deployment
  abstract: 'Most strategic reorganizations fail to deliver expected performance gains. We argue this
    reflects a deeper architectural fact: interventions at the org-chart surface ($T_6$) achieve effect-sizes
    geometrically smaller than interventions at deeper tiers, because each deeper tier carries content
    already compressed in transit to the surface. We formalize this as a six-tier *projection cascade*
    linking owner intent ($T_1$), business model ($T_2$), governance ($T_3$), architecture ($T_4$), routines
    ($T_5$), and positions ($T_6$). Each junction is a linear operator $\Pi_{i\to i+1}$ with rank deficiency
    $r_i \ge 0$. A unique cascade equilibrium exists under tier-by-tier Banach contractions (Theorem 1);
    total information loss is bounded by the sum of local nullities, with equality only when kernels stack
    independently (Corollary 1). Existing design theories — Galbraith''s star, Williamson''s governance
    choice, Mintzberg''s configurations, Puranam''s microstructure, Burton-Obel-Håkonsson''s computational
    optimization — are recovered as nested restrictions. A formal *position triple* $p = (P_p, A_p, R_p)$
    decomposes any $T_6$ position into perceptual content from $T_5$, authority from $T_3$, and role expectation
    from $T_1$. The apparatus yields four falsifiable propositions: P1 cascade-distance scaling of intervention
    efficacy, P2 strict downward propagation of basis rotation under AI deployment, P3 variance amplification
    with cumulative rank deficiency, and P4 algebraic decoupling at layer junctions.'
claims:
- id: P0
  type: proposition
  statement: The design literature has produced five powerful but incompatible primitive vocabularies
    (Galbraith information-processing, Williamson transaction-cost, Mintzberg configurational, Puranam
    microstructural, Burton-Obel-Hakonsson computational); the same question routed to different traditions
    yields non-comparable answers, and the field lacks a formal apparatus that makes them algebraically
    commensurable (Joseph & Sengul 2025 diagnose the fragmentation but do not supply the unifying object).
  testable: false
  tested_in_paper: true
  status: not_tested
- id: P1
  type: proposition
  statement: 'Organizations are six finite-dimensional real content-tiers T_1..T_6 (deepest owner intent
    to shallowest org-chart position) linked by linear projection operators Pi_{i->i+1}: T_i -> T_{i+1}
    in the rank-reducing (not idempotent) sense, with rank deficiency r_i := d_i - rank(Pi_{i->i+1}) >=
    0. The composite cascade Pi := Pi_{5->6} o ... o Pi_{1->2} is rank-non-increasing: rank(Pi) <= min_i
    rank(Pi_{i->i+1}).'
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P0
- id: P2
  type: proposition
  statement: 'Information loss across the cascade is junction-localizable: the cascade kernel decomposes
    by sub-additivity across junctions, so a manager who observes that two firms with identical T_1 produce
    systematically different T_6 positions can in principle identify the specific junction at which the
    difference originates rather than treating the cascade as a single black-box compression.'
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P1
- id: P3
  type: proposition
  statement: 'A rank-preserving change of basis at Pi_{i->i+1} is a rotation of the operator''s row space
    that leaves kernel and rank unchanged while altering which T_i directions are read into which T_{i+1}
    coordinates. A basis rotation at Pi_{5->6} is the formal mechanism of role-content drift under stable
    titles: job titles remain fixed while the underlying performative content of the position rotates
    beneath them — the headline AI-deployment phenomenon.'
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
