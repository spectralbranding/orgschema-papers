  - id: m1
    statement: >-
      Per-junction statistics (Table 2): r = (1,1,0,1,0); kappa =
      (.300,.400,.500,.350,.450); L = (2.509,6.099,3.932,1.285,2.966); all
      junctions converge (max residual 2.38e-11, within 1e-10 tolerance).
    source_observations: []
    generating_method: M1
    value: "r=(1,1,0,1,0); kappa=(.300,.400,.500,.350,.450); L=(2.509,6.099,3.932,1.285,2.966); max residual 2.38e-11"
    units: "rank deficiencies / contraction constants / Lipschitz constants / residual norm"
    body_sections: ["§3.5 Table 2"]
  - id: m2
    statement: >-
      Corollary 1 sub-additivity verified as a strict inequality on a non-trivial
      cascade: composite rank(Pi) = 2 so r_total = d_1 - rank(Pi) = 2, while
      Sum_i r_i = 1+1+0+1+0 = 3; r_total = 2 < 3 with a one-dimensional gap
      (kernel absorption at the rank-deficient Pi_{1->2}). Cascade Lipschitz
      product Prod L_j / (1 - kappa_j) = 3056.11 (finite but large).
    source_observations: []
    generating_method: M1
    value: "r_total=2 < Sum_i r_i=3 (gap=1); cascade Lipschitz product = 3056.11"
    units: "nullity counts / Lipschitz product"
    body_sections: ["§3.5 Numerical Illustration"]
  - id: m3
    statement: >-
      Restriction comparison: full cascade P3 amplification = 3056.11 and P4
      strict inequality (gap=1); single-junction restrictions cannot generate
      cascade-distance amplification (Williamson Pi_{2->3} P3 = 3.40; Mintzberg
      Pi_{5->6} P3 = 0.91) and detect no P4 strict inequality; multi-junction
      restrictions accumulate partial amplification two-to-three orders of
      magnitude below the full cascade (Puranam P3 = 5.68; Galbraith P3 = 19.53)
      and still cannot detect P4 strict inequality. No restriction reproduces
      both P3 product and P4 strict inequality.
    source_observations: []
    generating_method: M2
    value: "full P3=3056.11 (P4 gap=1); Williamson=3.40; Mintzberg=0.91; Puranam=5.68; Galbraith=19.53 (none detect P4)"
    units: "Lipschitz products / P4 detectability"
    body_sections: ["§4 computational comparison"]

# ============================================================================
# Findings — what the numerical work demonstrates
# ============================================================================
findings:
  - id: F1
    statement: >-
      The contraction conditions (C_i), the parameter-Lipschitz conditions
      (C_i'), and Corollary 1's sub-additivity bound are simultaneously
      satisfiable on a non-trivial six-tier cascade, and Corollary 1's
      strict-inequality (kernel-absorption) regime is realizable — making the
      partial-shielding regime that §5's P4 weakening rests on a constructed
      existence proof, not an assumption.
    type: "existence_demonstration"
    source_measurements: [m1, m2]
    generating_method: M1
    antecedents: [P5, P6]
    falsifier: "If no parameter choice satisfies (C_i), (C_i'), and the strict bound jointly, F1 fails."
    body_sections: ["§3.5 Numerical Illustration"]
  - id: F2
    statement: >-
      No single design-theory restriction simultaneously reproduces the full
      cascade's P3 cascade-distance amplification and P4 strict-inequality
      regime; each restriction is a strict subset of the cascade's empirical
      content, so the unification claim (P7) is demonstrated computationally
      rather than merely asserted.
    type: "comparative_demonstration"
    source_measurements: [m3]
    generating_method: M2
    antecedents: [P7, P11, P12]
    falsifier: "If any single restriction reproduces both the P3 product and P4 strict inequality, F2 (and the strong unification claim) weakens."
    body_sections: ["§4 computational comparison"]

# ============================================================================
# Limitations — honest scope of the apparatus
# ============================================================================
limitations:
  - id: L1
    statement: >-
      The apparatus is static (scope condition iv): regime transitions in which
      T_6 enactment retroactively reshapes T_1 (Weick enactment) require a
      dynamic extension with a longer-horizon Pi_{6->1}-style operator that is
      outside the present paper and flagged as future work.
    severity: "scope-bounding"
    affects: [P5, P9, P11]
    body_sections: ["§3.4 (iv)", "§7 Boundary conditions", "§7 Future research"]
  - id: L2
    statement: >-
      Whether the strict-inequality (junction-interaction) regime is empirically
      modal across firms is a question the apparatus poses but does not answer;
      the §3.5 illustration realizes it on one constructed cascade only.
    severity: "scope-bounding"
    affects: [P12]
    body_sections: ["§7 Boundary conditions"]
  - id: L3
    statement: >-
      The cascade is silent on (a) which tier any specific firm should intervene
      at, (b) the absolute magnitude of any specific r_i, and (c) the constants
      kappa_i and L_i in any regime — all empirical primitives to be measured
      firm-by-firm. The cascade organizes data; it does not substitute for
      measurement, and contraction-constant estimators do not yet exist.
    severity: "applicability"
    affects: [P9, P10, P11, P12]
    body_sections: ["§7 What the cascade does not predict", "§7 Future research"]
  - id: L4
    statement: >-
      The empirical illustration (Path B) is deferred to a companion empirical
      paper (PROJECTION_PAPER_PHASE2_EMPIRICAL_FRAMEWORK.md); this paper presents
      only the theoretical apparatus, so references to a §6 software-engineering
      illustration are forward pointers, and P1-P4 are framed for follow-on
      empirical work rather than tested here.
    severity: "scope-bounding"
    affects: [P9, P10, P11, P12]
    body_sections: ["§7 Future research (Path B)"]

# ============================================================================
# Alternative explanations — the rival the apparatus must clear
# ============================================================================
alternative_explanations:
  - id: A1
    statement: >-
      The cascade is merely a tautological re-description of the existing design
      theories it absorbs — relabeling without empirical content.
    rules_out_required: [P7]
    ruled_out_by: [P11, P12, F2]
    rules_out_status: "rejected"
    reasoning: >-
      P3 (variance scaling) and the strict-inequality regime of P4 carry
      empirical content that no single-junction framework reproduces, and the
      §4.6 computational comparison shows no restriction reproduces both — so the
      four propositions are joint consequences of the full cascade, not
      definitional artifacts of any tradition.
    body_sections: ["§1 Contribution roadmap", "§5 (joint distinctness)", "§4 computational comparison"]
  - id: A2
    statement: >-
      Reorganization failure is an execution-and-coordination problem (sound
      design degraded by post-decision implementation), not an architectural one
      (Hrebiniak 2006).
    rules_out_required: [P9]
    ruled_out_by: [P4]
    rules_out_status: "located_not_displaced"
    reasoning: >-
      The cascade does not displace the execution view; it locates it —
      execution-coordination failure populates r_5 at Pi_{5->6} and part of r_3,
      while the cascade adds the upstream r_1, r_2, r_4 contributions and the
      Lipschitz product the execution view treats as exogenous.
    body_sections: ["§2 Reorganization outcomes (Hrebiniak)"]

