  - term_key: position-triple
    label: "Position Triple"
    canonical_form: "position triple"
    definition: "The formal decomposition of any position as p = (P_p, A_p, R_p), where perceptual content inherits from routines, authority inherits from governance, and role expectation inherits from cultural commitments."
    first_section: "4 — Position Formalization"

