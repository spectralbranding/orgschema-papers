  - term_key: cascade-equilibrium
    label: "Cascade Equilibrium"
    canonical_form: "cascade equilibrium"
    definition: "The joint condition that each tier's projection is mutually consistent with the feedback of the tier below; it exists and is unique under tier-by-tier Banach contraction conditions."
