meta:
  title: 'A Blinded Multi-LLM Content-Coding Instrument: Protocol Specification and Inter-Coder Reliability
    Validation on an Organizational Corpus'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.21756063
  date: '2026-07-01'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - content analysis
  - intercoder reliability
  - large language models
  - LLM-assisted coding
  - blinded coding
  - pre-registration
  - reproducibility
  - research methods
  abstract: 'Content coding is a reliability bottleneck of qualitative and mixed-methods organizational
    research: it is labor-intensive, difficult to reproduce, and vulnerable to a coder who can see the
    study''s hypotheses. Large language models now annotate text at or above crowd-worker quality [@gilardi-2023-chatgpt-outperforms-crowd],
    but naive single-model use reintroduces the failure modes intercoder-reliability protocols were built
    to remove — unauditable calls, hypothesis leakage, fabricated codes, and single-rater dependence.
    This article specifies a blinded multi-LLM content-coding instrument that imports human intercoder-reliability
    discipline into machine-assisted coding. Three heterogeneous models code each case independently from
    a neutral, source-cited evidence dossier while blinded to the hypotheses and the case''s study role;
    cells combine by majority-vote-or-flag with author adjudication; a model that cannot determine a cell
    returns *uncertain* rather than guess; every call is logged with an exact model pin; and the harness
    and the empty coding schema are committed before any datum exists. On a corpus of thirty documented
    organizational integration cases the instrument reached almost-perfect inter-coder agreement (Fleiss''
    $\kappa = .838$), with a 2.7% flag rate concentrated entirely on auxiliary tokens. Reliability is
    distinguished from downstream inferential validity, which is left to future contrast studies. The
    harness, logs, and datasets are released as an auditable artifact.'
claims:
- id: SF1
  type: proposition
  statement: 'Content coding is a reliability bottleneck of qualitative and mixed-methods organizational
    research: it is labor-intensive, hard to reproduce, and vulnerable to hypothesis leakage when the
    coder can see the study''s predictions. Large language models now annotate text at or above crowd-worker
    quality, but using a single model with an unlogged, hypothesis-aware prompt reintroduces exactly the
    failure modes intercoder-reliability protocols were designed to remove — unauditable calls, leakage,
    fabricated codes, and single-rater dependence — and is categorically distinct from using a model to
    SIMULATE respondents (silicon sampling), which this instrument does not do.'
  testable: false
  tested_in_paper: false
  status: not_tested
- id: P1
  type: proposition
  statement: 'The instrument (architecture). For each case, an evidence dossier — a neutral, source-cited
    assembly of the case''s documentary record with no hypothesis content — is coded independently by
    three heterogeneous large language models (a Claude, a Gemini, and a Grok model, each pinned to an
    exact version). Each model sees ONLY the dossier and a fixed, hypothesis-free coder prompt that operationalizes
    the target variables in neutral factual language; it never sees the paper, the hypotheses, the predicted
    direction, or the case''s role in the study. Per coding cell the three model outputs combine by MAJORITY-VOTE-OR-FLAG:
    at least two agreeing values yield the cell; otherwise the cell is FLAGGED for author adjudication.
    The design is model-heterogeneous by construction so that a single model''s idiosyncrasy cannot silently
    carry a cell.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - SF1
- id: P2
  type: proposition
  statement: 'The discipline package (a single contribution). Four disciplines together make LLM-assisted
    coding trustworthy and auditable, and are specified as one protocol: (a) BLINDING — coders see only
    the evidence dossier, never the hypotheses, predicted direction, or the case''s anchor-vs-sample role,
    removing the hypothesis-leakage channel; (b) REGISTERED-BEFORE-DATA — the harness, the coder prompt,
    and the empty coding schema are committed before any coded datum exists, so the coding rule cannot
    be tuned to the result; (c) ANTI-FABRICATION — a model that cannot determine a cell from the dossier
    must return "uncertain" rather than guess, and uncertain-dominated cells resolve conservatively in
    the null-friendly direction under a pre-stated adjudication rule; (d) PROVENANCE — every model call
    is logged as JSONL with its exact model pin, timestamp, and prompt, and the dataset is assembled deterministically,
    so any coded value is traceable to the call that produced it and the run is reproducible.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
- id: P3
  type: proposition
  statement: 'Reliability validation on the worked demonstration. Applied to a corpus of 30 documented
    public M&A-integration cases (coded from source-cited dossiers), the instrument achieved almost-perfect
    inter-coder agreement: Fleiss'' kappa = .838 across the binary coding cells, above the conventional
    .81 "almost perfect" threshold. The flag rate was 2.7% (11 of 406 cells) — far below the 20% level
    that would escalate to dual-human coding — and every flagged cell fell on a descriptive token, not
    on a study-critical variable, which the three coders coded unanimously. Per-cell unanimous-agreement
    ran from .89 to 1.00. The demonstration is a WORKED EXAMPLE establishing feasibility and reliability
    on one real corpus, not a claim of universal performance.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
  - P2
- id: P4
  type: proposition
  statement: 'Applicability and the dossier precondition. The instrument is domain-general across organizational-research
    coding tasks whose evidence is documentary and whose target variables are discretely codable — for
    example, classifying inter-organizational structure from deal documents, coding escalation-of- commitment
    or attention signals from earnings-call transcripts, or classifying technological relatedness from
    patent records. Its trustworthiness has an explicit precondition: the source dossier must meet a minimum
    evidentiary- richness threshold for the target cell, below which the correct coder behavior is "uncertain"
    (per P2c) rather than a determination. Where a dossier cannot support a determination, the instrument
    surfaces that as a flag rather than fabricating a code — the anti-fabrication rule is what makes the
    evidentiary-richness boundary operational rather than aspirational.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
  - P2
- id: C1
  type: proposition
  statement: Boundary conditions. The instrument applies to discretely-codable variables over documentary
    evidence; it is not specified for open-ended or free-text extraction, for continuous ratings without
    a discretization rule, or for evidence that cannot be assembled into a self-contained source-cited
    dossier. Its coder pins are exact model versions; results are conditional on those versions and are
    expected to drift as models change (mitigated, not removed, by the multi-model majority and the pinned
    provenance).
  testable: false
  tested_in_paper: false
  status: not_tested
- id: L1
  type: proposition
  statement: 'Limitations and the honest scope of the claim. (1) The validation is a single worked corpus
    in one organizational-document domain; broad generalizability requires replication on substantively
    different corpora, declared here as future work. (2) High inter-coder reliability is NOT by itself
    downstream hypothesis-testing validity: this paper does not run a head-to-head contrast of blinded
    multi-LLM coding against single-LLM coding or human double-coding on hypothesis-leakage or downstream-inference
    metrics, and therefore does not claim superiority on those axes — that contrast is the natural next
    study. (3) One model''s free-tier rate-limiting truncated a response, requiring a bounded-output retry
    (documented; one case coded by two of three coders and excluded from the reliability denominator),
    a reproducibility hazard of hosted-model dependence. (4) Cost, latency, and model availability are
    practical constraints; the multi-model design multiplies per-cell cost.'
  testable: false
  tested_in_paper: false
  status: not_tested
