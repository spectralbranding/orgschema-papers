  - {citation_key: "barnard-1938-functions-executive", role: separate_economies, spine_nodes: [P28], note: "Barnard 1938 (1968 edition), pp. 254-255 — separate customer, labor, credit, supply and technological economies; exchanges cannot be measured completely in dollars; he keeps a common purpose (p. 89). Supports the exchange reading of the business model; it does not single out the customer, which is this paper's wording."}
  - {citation_key: "adner-2017-ecosystem-as-structure", role: alignment_and_level, spine_nodes: [P28], note: "Adner 2017, p. 42 — actors with different end goals and their alignment; p. 51 — a business model is the focal firm's plan, a different level from the ecosystem. Supports nothing about the customer position."}
  - {citation_key: "pistor-2019-code-of-capital", role: legal_coding, spine_nodes: [P29], note: "Pistor 2019, pp. 2, 14-15 — capital is an asset plus the legal code; legal coding makes claims hold against anybody; a two-party agreement cannot bind others. Stated by Pistor for capital assets; not generalized to every commitment of a business."}
  - {citation_key: "hansmann-2000-essential-role-organizational", role: bonding_assets, spine_nodes: [P29], note: "Hansmann & Kraakman 2000, pp. 392-393 — a firm must bond its contracts credibly with a pool of bonding assets over which its creditors have a prior claim. Supports the guarantee role of the legal entity for contracts with creditors."}
  - {citation_key: "emerson-1962-power-dependence-relations", role: power_as_dependence, spine_nodes: [P30], note: "Emerson 1962, pp. 32-33 — power resides in the other's dependency; the power of A over B equals the dependence of B upon A. Supports power as dependence; not a ranking of whose demands prevail."}
  - {citation_key: "mitchell-1997-toward-theory-stakeholder", role: stakeholder_salience, spine_nodes: [P30], note: "Mitchell, Agle & Wood 1997 — salience of a stakeholder from power, legitimacy and urgency. No page; supports the salience attributes only."}
  - {citation_key: "hirschman-1970-exit-voice-loyalty", role: exit_and_voice, spine_nodes: [P30], note: "Hirschman 1970, pp. 4, 30 — customers and members respond to decline by exit or voice; definition of voice. Supports exit and voice as the backing available to customers and members; not loyalty."}
  - {citation_key: "klein-2012-property-rights-stakeholder", role: residual_rights_per_party, spine_nodes: [P30], note: "Klein et al. 2012, pp. 306, 309 — residual decision rights held by each party affect what it can claim; control goes to the parties whose specific investments matter most. Supports rights as party-specific; not control assigned by layer or activity type."}
