  - {citation_key: "brand-1999-clock-long-now", role: pace_layering_origin, spine_nodes: [P26], note: "Brand 1999 — layers of a civilization change at different rates. Cited as the origin of pace layering; the tempo account is complementary and derives a tier's rate from the commitments others hold on it."}
