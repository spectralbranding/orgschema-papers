  - {citation_key: "", role: acquisition_entrepreneurship, spine_nodes: [C3], note: "Zettel & Nows 2026 — goals and motivations in entrepreneurship through acquisition; the buyer type in which an incoming principal must absorb the person-carried residual personally."}
