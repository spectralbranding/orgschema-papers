# SPINE.yaml — Six-Tier Ontology of Organizational Transferability (2026ag)
#
# DESCRIPTIVELY from the completed paper.md (SIX_TIER_ONTOLOGY_PAPER.md,
# Working Paper v1.1.0), not authored generatively before prose. Every node
# below traces to existing prose; no node aspirationally extends the paper.
#
# Schema v0.1 ([internal path removed] §"Schema v0.1"):
# this is a PURE-THEORY conceptual contribution (AMR tradition). It produces
# no author-collected data, no Monte Carlo / simulation, no computed table
# values, and no AI-tool experimental outputs. Tables 1-4 are definitional /
# diagnostic surfaces, and the companion stsd_scorer.py merely re-encodes
# Table 4 deterministically (no derived statistic). Hence v0.1, not v0.2.

spine_version: "0.1"
spine_doc_version: "0.1.0"
paper_key: "2026ag"
provenance: retrofit
title: >-
  Dual Hierarchies of Organizational Transferability: A Six-Tier Ontology and
  Theory of Acquisition Failure Propagation
status: "Not exported; see the paper's own version and DOI."

thesis: >-
  Mergers and acquisitions destroy value at high rates because the field lacks
  a shared ontology specifying which organizational layers transfer and how
  failures propagate across them. This paper develops a six-tier ontology of
  the acquisition target — Intent, Business Model, Business Entity,
  Product, Process, Organization — each with a distinct governor, specification
  surface, and transferability mode. Tier 1 is the intent of each position that
  deals with the business; the controlling position's intent is replaced at a
  change of control and the other positions' intents persist. The tiers form two oppositely directed
  hierarchies: a service hierarchy upward (Organization to Intent) and a
  constraint hierarchy downward (Intent to Organization). The constraint
  hierarchy fixes integration sequencing; shocks propagate bidirectionally,
  yielding seven falsifiable failure-propagation propositions. The tier structure
  is form-invariant across for-profit, NGO, cooperative, and state-owned
  entities: explicit substitution rules change what each tier holds, not the
  tiers or their order (Tiers 2, 4, 5 and the state-owned column provisional),
  and the framework derives a Six-Tier
  Separability Diagnostic (STSD) as a theoretical implication. The primary
  contribution is a generalizable theory of organizational separability under
  ownership change: separability is never costless because constraint
  architectures are sticky.

# ============================================================================
# Propositions — the argument backbone
#   P-prefix: core theoretical propositions (incl. the paper's seven numbered
#   failure-propagation propositions P1F..P7F, kept distinct from structural
#   propositions Pn). C-prefix: boundary conditions. L-prefix: limitations.
#   A-prefix: alternative frameworks ruled out. SF-prefix: the stylized fact
#   the theory explains.
# ============================================================================
propositions:
  - id: SF1
    statement: >-
      Across two decades of meta-analyses, post-acquisition failure remains the
      modal outcome and strategic/financial/organizational antecedents explain
      only a modest fraction of performance variance — a persistent residual the
      field attributes to "unidentified moderators."
    antecedents: []
    body_sections: ["Introduction", "The M&A Failure Literature and Its Missing Layer"]
    evidence:
      - type: citation
        anchor: "King et al. 2004 and 2021 document the residual variance; Paumen et al. 2024 confirm failure as modal."
        citation_keys: []

  - id: P1
    statement: >-
      The residual is an ontological deficit, not merely an empirical one: the
      M&A literature has accumulated sophisticated single-layer explanations
      (cultural distance, executive turnover, strategic misfit, business-model
      misalignment) but lacks a shared vocabulary for how those layers relate,
      constrain one another, or propagate failure across the entity.
    antecedents: [SF1]
    body_sections: ["Introduction", "The M&A Failure Literature and Its Missing Layer"]
    evidence:
      - type: citation
        anchor: "Cartwright & Schoenberg 2006, Haleblian et al. 2009, Graebner et al. 2017, Angwin et al. 2023 each document the missing integrative layer / call for cross-level models."
        citation_keys: []

  - id: P2
    statement: >-
      An acquisition target decomposes into exactly six tiers — Intent,
      Business Model, Business Entity, Product, Process, Organization — each
      individuated by a distinct GOVERNOR (force that sets the tier's
      configuration), a distinct SPECIFICATION SURFACE (observable artifacts),
      and a distinct TRANSFERABILITY MODE (mechanism by which the tier does or
      does not cross an ownership boundary).
    antecedents: [P1]
    body_sections: ["The Six-Tier Ontology (Table 1)", "Tier 1..Tier 6 subsections"]
    evidence:
      - type: analytic
        anchor: "Table 1 enumerates governor / specification surface / transferability mode per tier; per-tier subsections theoretically ground each."

  - id: P3
    statement: >-
      The six tiers are objects of heterogeneous ontological type (the intents of
      the positions that deal with the business, an abstract projection, a legal
      artifact, operational realities) unified under a single instrumental axis — transferability
      mode: the question is not "are they the same kind of thing?" but "what
      happens to each kind of thing when it crosses a new-owner boundary?" This
      answers the ontological-mixing objection and distinguishes the framework
      from prior layered firm ontologies (Zachman, Osterwalder, BIZBOK, DEMO),
      none of which combine a distinct Intent tier above the Business
      Model, a distinct Business-Entity legal tier, per-tier transferability
      modes, dual hierarchies, and an M&A application. The six tiers are the
      configuration the analyst's position chose for the transferability task;
      six is not derived from transferability, and other positions read the same
      business in their own ontologies, so translation into the six tiers loses
      content.
    antecedents: [P2]
    body_sections: ["Layered Ontologies of the Firm", "The Six-Tier Ontology"]
    evidence:
      - type: citation
        anchor: "Zachman 1987, Osterwalder 2004, Business Architecture Guild 2024, Dietz 2006 as partial precedents; Coase 1937 / Williamson 1985 ground Tier 3."
        citation_keys: []

  - id: P4
    statement: >-
      Tier 1 (Intent) is bound to positions, not to the asset. Each position that
      deals with the business has an intent regarding it; the controlling
      position's intent (Owner Intent) is the one the business's bodies adopt by
      decision, and it only IMPRINTS onto the asset's downstream tiers. At a
      change of control the controlling intent is REPLACED, not transferred: a new
      principal supplies a new Tier 1 imprint while Tiers 2-6 carry forward
      (subject to the integration cascade), and the other positions' intents
      persist with those positions. A single principal controlling multiple
      assets carries a per-asset controlling intent, drawn from one archetype
      distribution but expressing differently per asset. That the business has no
      intent of its own restates the nexus-of-contracts view of the firm.
    antecedents: [P2]
    body_sections: ["Tier 1 — Intent (Attribution refinement; Figure 1)"]
    evidence:
      - type: citation
        anchor: "Schumpeter 1934, Jensen & Meckling 1976, Selznick 1957, Marquis & Tilcsik 2013 imprinting ground the principal-carried Intent and its imprint; Jensen & Meckling 1976 (nexus of contracts) is the source of the no-intent-of-its-own restatement."
        citation_keys: ["jensen-1976-theory-firm-managerial"]

  - id: P5
    statement: >-
      Tier 3 (Business Entity) is the most jurisdictionally MUTABLE of the six
      tiers: the legal vehicle can swap (redomiciliation, opco/holdco
      interposition, SPV insertion, sole-prop-to-LLC conversion) while Tiers 2,
      4, 5, 6 continue without operational disruption. The persistent identity
      of a business therefore does not reside in Tier 3; the substantive Tier 3
      transferability claim is decoupling of obligations from the principal's
      balance sheet, not identification with a specific legal form.
    antecedents: [P2]
    body_sections: ["Tier 3 — Business Entity (Jurisdictional mutability)"]
    evidence:
      - type: analytic
        anchor: "Tier 3 swaps preserving Tiers 2-6 carry low cost; swaps forcing re-licensing propagate via the Tier 3 -> Tier 4/5 channel (P3F)."

  - id: P6
    statement: >-
      The six tiers form two overlapping, oppositely directed hierarchies that
      are the same relationships read from opposite ends. The SERVICE hierarchy
      runs upward (Organization serves Process; Process serves Product; Product
      funds Entity; Entity implements Model; Model realizes Intent). The
      CONSTRAINT hierarchy runs downward (each tier rules out inadmissible
      configurations for the tier below it).
    antecedents: [P2]
    body_sections: ["Service Hierarchy and Constraint Hierarchy (Figure 2)"]
    evidence:
      - type: citation
        anchor: "Penrose 1959 (services), Williamson 1985 (governance-as-constraint), Thompson 1967 (interdependence), Simon 1962 (near-decomposability)."
        citation_keys: []

  - id: P7
    statement: >-
      Because upper tiers constrain lower tiers, specification clarity at upper
      tiers is logically PRIOR to integration execution at lower tiers, and a
      shock at any tier propagates in BOTH directions (a Tier 6 fracture reduces
      the productive capacity Tier 5 requires, transmitting up the service chain
      to Tier 4 drift even when the Product spec was never altered). Integration
      is therefore a cross-tier problem, not a within-tier one.
    antecedents: [P6]
    body_sections: ["Service Hierarchy and Constraint Hierarchy", "The Integration Sequencing Principle"]
    evidence:
      - type: citation
        anchor: "Bauer et al. 2024 (integration capabilities span domains); cascade-projection apparatus formalized in Zharnikov 2026m."
        citation_keys: []

  # --- The seven numbered failure-propagation propositions (paper P1-P7) ---
  - id: P1F
    statement: >-
      P1 (Intent-Model Misalignment): when an acquirer's controlling intent differs
      structurally from the target's configuration and from the intents behind the
      commitments that carry over, the target's Business Model requires
      fundamental revision, generating downstream Tier 4/Tier 5 friction not
      visible in pre-close due diligence.
    antecedents: [P6, P7]
    falsifier: >-
      For-profit acquisitions of mission-primary targets show no greater rate of
      Model revision / downstream disruption than financially equivalent
      for-profit-to-for-profit deals.
    body_sections: ["Failure-Propagation Propositions (P1)"]
    evidence:
      - type: citation
        anchor: "Bauer & Friesl 2024 (attentional crowding-out); Christensen et al. 2011 (business-model fit)."
        citation_keys: []

  - id: P2F
    statement: >-
      P2 (Business Model-Product Friction): an imposed Model revision drifts the
      Product specification toward the new Model's optimization criteria, and
      customers anchored in the prior dimensional configuration churn above
      pre-acquisition baselines.
    antecedents: [P1F]
    falsifier: >-
      No systematic association between Model revision and product attribute
      drift across completed acquisitions with matched pre/post-close data.
    body_sections: ["Failure-Propagation Propositions (P2)"]

  - id: P3F
    statement: >-
      P3 (Entity-Operations Disruption): Entity restructuring following close
      disrupts operational continuity at Tiers 5 and 4 via contract
      renegotiation, regulatory re-certification, and counterparty uncertainty
      disproportionate to the restructuring's legal scope.
    antecedents: [P5, P6]
    falsifier: >-
      No significant association between Entity restructuring and
      operational-continuity disruption.
    body_sections: ["Failure-Propagation Propositions (P3)"]

  - id: P4F
    statement: >-
      P4 (Product-Process Disruption): revising the Product specification
      misaligns the Process architecture built for the prior Product, generating
      quality failures or cost overruns until Process is rebuilt around the new
      spec — compounded by the impossibility of fully specifying Product
      requirements and the tacit residuals documentation cannot eliminate.
    antecedents: [P6, P7]
    falsifier: >-
      No systematic association between Product revision and quality/cost
      variance, controlling for baseline Process maturity.
    body_sections: ["Failure-Propagation Propositions (P4)"]
    evidence:
      - type: citation
        anchor: "Specification impossibility result invoked from Zharnikov 2026h."
        citation_keys: []

  - id: P5F
    statement: >-
      P5 (Process-Organization Fracture): imposing Process integration on the
      acquired Organization before Tier 4 specification clarity is established
      produces employee resistance and attrition exceeding rates when Process
      integration follows Product confirmation.
    antecedents: [P6, P7]
    falsifier: >-
      No systematic difference in attrition between Product-first and
      Process-first sequencings in matched samples.
    body_sections: ["Failure-Propagation Propositions (P5)"]
    evidence:
      - type: citation
        anchor: "Klok et al. 2023 (emotional dynamics); Smeulders et al. 2023 (integration controls Tier 5->6)."
        citation_keys: []

  - id: P6F
    statement: >-
      P6 (Organization Fracture to All-Layer Degradation): when key Organization
      members exit post-acquisition, the tacit knowledge they carried degrades
      across all six tiers at rates retention bonuses or post-exit documentation
      cannot recover, because Tier 6 is the sole repository of tacit
      specification knowledge never externalized to Tier 4/5 surfaces. This is
      the best-supported pathway (though no single study traces the full chain).
    antecedents: [P6, P7]
    falsifier: >-
      Acquisitions with high pre-close codification show the same all-layer
      degradation rate following executive turnover as low-codification ones.
    body_sections: ["Failure-Propagation Propositions (P6)"]
    evidence:
      - type: citation
        anchor: "Stahl & Voigt 2008, Bilgili et al. 2017 jointly support; Du & Tsolmon 2026 (positional knowledge)."
        citation_keys: []

  - id: P7F
    statement: >-
      P7 (Bidirectional Feedback): sustained lower-tier failure crossing a
      duration-and-severity threshold (Tier 5/6 fracture >= 12 months depressing
      Tier 3 revenue >= 10% from deal thesis) forces upward revision — documented
      Tier 2 Model revision within 24 months, and conditionally documented Tier 1
      Intent revision (write-down/divestiture/strategic-review) within a further
      12 months. The feedback is asymmetric: below threshold, lower-tier failures
      are absorbed without upper-tier revision.
    antecedents: [P6, P7]
    falsifier: >-
      No systematic instances of threshold-crossing lower-tier failures
      precipitating Model/Intent revision under controlled exogenous shocks; or
      Model/Intent revisions as frequent below threshold as above.
    body_sections: ["Failure-Propagation Propositions (P7)"]

  # --- Form-invariance, collapse, and the diagnostic ---
  - id: P8
    statement: >-
      The six-tier structure is FORM-INVARIANT: the six tiers and their order
      are retained across for-profit, NGO/charity, mutual/cooperative, and
      state-owned types, and explicit substitution rules change what each tier
      holds (Table 2). The Tier 1 row gives each form's controlling intent; the
      other positions hold their own Tier 1 intents. Tier 1 and Tier 3
      substitutions are anchored in prior work; Tier 2, 4, and 5 substitutions
      are provisional theoretical deductions pending cross-form validation, and
      the state-owned column is provisional as a whole. The
      cooperative Tier 1 is a collective mandate, not a scalar individual intent.
    antecedents: [P2]
    body_sections: ["Substitution Rules Across Organizational Forms (Table 2)"]
    evidence:
      - type: citation
        anchor: "Hansmann 1996 (Tier 1/3 for-profit/NGO/coop); Battilana & Lee 2014 (hybrid Tier 1/6); Bruton et al. 2015 (state-owned)."
        citation_keys: []

  - id: P9
    statement: >-
      Tier-collapse is a structural pattern parameterized over TIER PAIRS,
      arising when the governor of one tier is identical to another's. Two
      canonical instances: Tier 1 ≡ Tier 4 (Domain Craftsman / Family Steward /
      Mission Founder — Intent is inseparable from Product) and Tier 1 ≡ Tier 3
      (sole-proprietor — the natural person IS the legal subject). In each, the
      fused-tier asset is untransferable as a going concern because the fused
      tier carries the principal's identity, which legal instruments cannot
      convey.
    antecedents: [P4, P5]
    body_sections: ["The Flip Case: Intent Equals Product (Figure 3)"]
    evidence:
      - type: citation
        anchor: "Selznick 1957, Marquis & Tilcsik 2013, Whetten 2006, Pecis et al. 2025, Berrone et al. 2012 (SEW reservation price above rational valuation)."
        citation_keys: []

  - id: P10
    statement: >-
      Capital allocation carries a flow-versus-stock character that varies
      systematically with the tier a spend item labels. Spend is stock when it
      writes a specification on Tiers 2-5 (model architecture, governance,
      product/process codification: high transferable value), partly stock on
      Tier 6 (abilities that leave with people), and flow when it only runs
      functioning (low transferable value). Marketing campaigns and public
      relations are flow on Tier 2 channels; a brand redesign that rewrites the
      brand specification is Tier 4 stock; the Tier 6 part of marketing is the
      department's people. Each spend item carries a tier label and its own
      half-life and substrate-accumulation coefficient; the transferability and
      accumulation classifications ALIGN.
    antecedents: [P2, P6]
    body_sections: ["Tier-Allocation of Capital as a Distinct Decision Margin"]
    evidence:
      - type: citation
        anchor: "Dierickx & Cool 1989 (stock-flow); Mizik & Jacobson 2003, 2009 (marketing vs operating asset equity-value)."
        citation_keys: []

  - id: P11
    statement: >-
      The constraint hierarchy derives a formal (not prescriptive) integration
      SEQUENCING principle: resolve Tier 1 compatibility before Tier 2 revision;
      Tier 2 revision before Tier 4 specification; confirm Tier 4 before Tier 5
      integration; confirm Tier 5 before Tier 6 role redesign; Tier 3 integration
      is legally immediate but should be designed to minimize disruption to Tiers
      4-6. The modal failure mode in practice INVERTS this sequence (beginning at
      Tier 6/5 with Tiers 1-4 unresolved).
    antecedents: [P6, P7]
    body_sections: ["The Integration Sequencing Principle (Table 3)"]
    evidence:
      - type: citation
        anchor: "Larsson & Finkelstein 1999 (inadequate org integration); Jemison & Sitkin 1986 (activity trap); Van Oorschot et al. 2023 (simultaneous integration/differentiation)."
        citation_keys: []

  - id: P12
    statement: >-
      The Six-Tier Separability Diagnostic (STSD) is a THEORETICAL IMPLICATION,
      not the primary contribution: a structured judgment instrument that scores
      each tier Fused / Partial / Independent (Table 4), producing a six-cell
      pre-close risk profile. Its theoretical claim is that pre-close tier
      profiling predicts post-acquisition trajectories better than aggregate
      financial/strategic-fit measures, by disaggregating due-diligence risk by
      tier rather than producing an aggregate pass/fail verdict.
    antecedents: [P6, P11]
    body_sections: ["The Six-Question Diagnostic (Table 4)", "The Separability-as-Screening Principle"]
    evidence:
      - type: citation
        anchor: "Pablo 1994 (pre-close integration-level decision); Bauer & Friesl 2024 (attention allocation)."
        citation_keys: []

  - id: P13
    statement: >-
      Cross-form acquisitions face Tier 1 MISSPECIFICATION risk no standard
      due-diligence checklist captures, because financial due diligence examines
      Tier 3 and not Tier 1 compatibility. A cooperative's controlling intent is
      collectively held (the members are the controlling position) and
      democratically governed; it cannot be transferred without being replaced
      by a fundamentally different Intent (a credit union cannot be acquired by a
      bank without member consent). Privatization is the most tractable natural
      experiment for testing the form-mismatch principle.
    antecedents: [P8, P11]
    body_sections: ["The Form-Mismatch Principle"]
    evidence:
      - type: citation
        anchor: "Battilana & Lee 2014 (mission drift on non-mission acquisition)."
        citation_keys: []

  - id: P14
    statement: >-
      Owner Intent, the controlling position's intent, is phrased in the Owner Ontology: the controlling principal's account of
      what exists in the business, what its basic terms mean, what is connected to what, and
      what is absent. The Owner Ontology is one of the stakeholder ontologies of the business,
      that of the controlling position, and it is Tier 1 content carried by the same principal,
      not a seventh tier; the stakeholder ontology of every other position is Tier 1 content of
      that position. It fixes the terms in which questions about the business are worded;
      Owner Intent fixes which questions are asked. Every stakeholder of the business has a
      stakeholder ontology of it, and the six-tier ontology of a business is the common
      language into which these stakeholder ontologies are translated. The Owner Ontology
      differs from dominant logic, the schema shared by top managers through which they
      conceptualize the business and allocate resources: it is the controlling principal's own
      account, recorded in the principal's words, and the paper's interest in it is its division
      into a shareable and a private part at transfer.
    antecedents: [P4]
    body_sections: ["The Six-Tier Ontology (Table 1 notes)", "Tier 1 — Intent"]
    evidence:
      - type: citation
        anchor: "Prahalad & Bettis 1986 define dominant logic as the way top managers conceptualize the business and make critical resource-allocation decisions; the distinction drawn here is from that construct."
        citation_keys: ["prahalad-1986-dominant-logic-new"]

  - id: P15
    statement: >-
      The Owner Ontology attaches to the principal and exits with the principal, as Owner
      Intent does, with one qualification: records on Tiers 2 through 6 were written in its
      terms, and some of them, the ontology-dependent records, cannot be read correctly without
      it. The Owner Ontology therefore divides into a shareable part (the owner's terms as used
      in the records, verbatim, and the list of ontology-dependent records), which can pass to
      a buyer or successor as a document, and a private part (deliberate absences, causal
      beliefs, sources of the edge, values, judgement of people), which generates future records
      and stays with the principal unless the principal chooses to pass it on. Only the
      shareable part can cross to the asset side.
    antecedents: [P4, P14]
    body_sections: ["Tier 1 — Intent (Attribution refinement; Figure 1)"]
    evidence: []

  - id: P16
    statement: >-
      The Fused / Partial / Independent states of the diagnostic measure whether records exist
      outside the owner's head; they do not measure whether written records can be read without
      the Owner Ontology. A tier can be Independent and still depend on the Owner Ontology when
      its records use the owner's terms in senses a reader outside the firm does not share. The
      share of such ontology-dependent records is a second readiness measure beside fusion, and
      the shareable part of the Owner Ontology is the instrument that lowers it.
    antecedents: [P12, P15]
    body_sections: ["The Six-Question Diagnostic (Table 4 notes)"]
    evidence: []

  - id: P17
    statement: >-
      Each position that deals with the business (the owner, a lender, the
      employees, a union, customers, the state, a potential buyer) has Tier 1
      content of two kinds: its Intent (what it wants from the business, its
      horizon and its exit criteria) and its stakeholder ontology (the terms in
      which it reads the business). Neither is a seventh tier or a separate axis.
      A position is a standpoint from which a subject and an intent are formed:
      the analyst's or a party's. The six-tier matrix is position-symmetric (every
      position has the same row: its intent at Tier 1, its commitments at Tiers
      2-6) and not observer-free: the analyst's position configures it.
    antecedents: [P4, P14]
    body_sections: ["The Six-Tier Ontology (Table 1 notes)", "Tier 1 — Intent"]
    evidence:
      - type: citation
        anchor: "Shchedrovitsky 1981 essay as reprinted in Izbrannye trudy (1995), p. 98: methodology works with the multiplicity of an actor's positions toward one object and with different representations of that object; the precedent does not carry the six-tier configuration or the position-symmetry of the matrix."
        citation_keys: ["shchedrovitsky-1995-izbrannye-trudy"]

  - id: P18
    statement: >-
      The owner's special status among the positions that deal with the business
      is control, a Tier 3 field: the residual decision rights fixed by the legal
      form (charter, cap table). The controlling intent is the one the business's
      bodies adopt by decision; the other positions' intents act through the
      commitments the business accepts.
    antecedents: [P4, P5]
    body_sections: ["Tier 3 — Business Entity", "Tier 1 — Intent"]
    evidence: []

  - id: P19
    statement: >-
      The tier of a commitment is the tier of the field that reads its parameter;
      its author and its recording document are recorded separately. Tier 1
      contains only parameters of a position (what the position wants from this
      business, and its terms), never parameters of the business. An aim that a
      family keep at least a stated share of the capital is a Tier 3 parameter
      (the cap table); an aim of making a stated sum on this business by a stated
      year is Tier 1. A loan is a Tier 3 obligation, and a covenant in it on
      customer concentration constrains a Tier 2 parameter.
    antecedents: [P17, P18]
    body_sections: ["Tier 1 — Intent (Assignment rule)"]
    evidence: []

  - id: P20
    statement: >-
      A trademark is three objects on two tiers. The right to use a sign for given
      classes in a given territory is a Tier 3 asset of the entity. The sign as
      specified (its form and the rules for its use) is Tier 4, the brand
      specification only. The perception the emissions produce is held by
      observers and lies outside the six tiers. Every Tier 4 parameter reads two
      ways, as acceptance (does the product meet its specification) and as
      emission (what signal it sends), and both are objective at the
      specification level: the business specifies what it emits, not what is
      perceived.
    antecedents: [P2, P18]
    body_sections: ["Tier 4 — Product"]
    evidence: []

  - id: P21
    statement: >-
      Two cases illustrate the split in P20 without extending it. An API service
      reachable by IP only, with no name and no certificate-bound name, has a
      complete acceptance specification at Tier 4. It has no sign, so no mark
      right at Tier 3; its emissions are its behaviour. An IP address is an
      assigned locator, not a sign; a certificate-bound name is one. The name
      Pizza Napoletana is entered in the EU register of traditional specialities
      guaranteed with reservation of the name: the right to the reserved name is a
      Tier 3 right whose content is a Tier 4 specification, and before the
      reservation one name could cover products made to many specifications, an
      arrangement analogous to metamerism.
    antecedents: [P20]
    body_sections: ["Tier 4 — Product"]
    evidence:
      - type: citation
        anchor: "Implementing Regulation (EU) 2022/2313 (Article 1: entry with reservation of name; recital 2: earlier registration without reservation by Regulation (EU) No 97/2010). No specification figure is quoted. That the name then covered many specifications is inferred from the absence of reservation; the text does not state it."
        citation_keys: ["eu-2022-reg-2313-pizza-napoletana"]
      - type: citation
        anchor: "Zharnikov 2026x: machine observers read structured data and behaviour; the cryptographic signature is the machine-side identifier. Zharnikov 2026e: metamerism defined for projections of 8D profiles onto a grade, so the Pizza case is an analogy, not an instance."
        citation_keys: ["zharnikov-2026-ai-native-brand-identity-from", "zharnikov-2026-spectral-metamerism-brand-perception-projection"]

  - id: P22
    statement: >-
      A machine or software agent that executes work is not Tier 6. Its
      specification (model, prompts, policies, tools, workflow) is a codified
      record at Tier 5; contracts with model and platform vendors are Tier 3
      records; the persona a customer meets belongs to the Tier 4 specification
      where it is specified. Tier 6 stays people and culture, including the people
      who set an agent's norm, accept its output and can stop it, because only
      persons and legal entities carry obligations. Replacing people with an agent
      moves execution from Tier 6 to Tier 5, from tacit to codified: transferability
      rises, and risk moves to the few people who maintain the agent (Tier 6) and
      to the vendor terms (Tier 3).
    antecedents: [P2, P18]
    body_sections: ["Tier 5 — Process", "Tier 6 — Organization"]
    evidence:
      - type: citation
        anchor: "Acemoglu & Restrepo 2018: automation displaces labor from tasks it performed (task-based framing of replacing people with machines). Polanyi 1966: tacit knowledge resists codification, so what an agent's specification captures is the codified part only."
        citation_keys: ["acemoglu-2018-race-between-man", "polanyi-1966-the-tacit-dimension"]

  - id: P23
    statement: >-
      The people a business organizes can come to hold goals as a collective. That
      collective is a position: its intent is Tier 1 content of that position, and it is
      carried in the Tier 6 culture. This leaves the statement that the business has no
      intent of its own unchanged, and adds no construct.
    antecedents: [P4, P17]
    body_sections: ["Tier 1 — Intent (Attribution refinement)", "Tier 6 — Organization"]
    evidence:
      - type: citation
        anchor: "Jensen & Meckling 1976 remains the anchor for the business having no intent of its own; the collective-as-position reading is this paper's use of the position term (P17) and adds no source."
        citation_keys: ["jensen-1976-theory-firm-managerial"]

  - id: P24
    statement: >-
      The six tiers record what is committed. The reconciliation of the positions' intents
      into accepted commitments (offer, acceptance, rejection, revision) is a process
      outside the tiers, and it leaves its trace as operations on commitments. It is not a
      tier: Table 1 defines a tier by a specification surface and a transferability mode,
      and the process has neither of its own; the records it leaves sit on the tiers. Several parties can steer one organization at the same time.
    antecedents: [P2, P17, P19]
    body_sections: ["Tier Tempo Is Relational"]
    evidence:
      - type: citation
        anchor: "Bernheim & Whinston 1986, pp. 923-924: several principals simultaneously and independently attempt to influence a common agent. Cited for several parties steering one organization at once; no equilibrium or efficiency result is used."
        citation_keys: ["bernheim-1986-common-agency"]

  - id: P25
    statement: >-
      Tier tempo is how often a tier completes a decided change, stated against a named
      reference clock (the calendar, the environment's cycle, another tier, or a party's
      cycle). A commitment is an offer by one party accepted by others, with an author, a
      corridor (a yes/no condition, a minimum, a maximum, a range, or a per-norm
      condition) and a term. The carrier floor is the shortest cycle the tier's carrier
      allows: people learn and agree at human speed, law sets procedural minimums, a
      written artifact changes at machine speed. The claim is a lower bound set by the
      longest chain, not the product of the number of re-acceptances and the time each
      takes: a decided change on a tier cannot finish before the longest chain of
      re-acceptances required from the parties that hold commitments on that tier, and
      not faster than the carrier floor allows. Approvals can run in parallel, so total
      time is bounded below by the longest chain of re-acceptances, not by the sum of all
      approvals. An added party whose agreement is
      needed does not always reduce the possibility of change. Governance arrangements are
      often re-examined at the renewal intervals of the contracts that carry them. The carrier
      floor is this paper's assumption; it was not found in print.
    antecedents: [P6, P19, P24]
    falsifier: >-
      A decided change on a tier completes before the longest chain of required
      re-acceptances by the parties holding commitments on it, or faster than its carrier
      allows.
    body_sections: ["Tier Tempo Is Relational"]
    evidence:
      - type: citation
        anchor: "Djankov et al. 2002, Data section: the time of the set of procedures required to start a firm is measured with procedures taken as simultaneous whenever possible; cited for the method only, no page. Not cited for change of a running business."
        citation_keys: ["djankov-2002-regulation-of-entry"]
      - type: citation
        anchor: "Tsebelis 2000, absorption rule: a veto player can be added without changing the set of feasible changes. The measure is the set of feasible changes, not time, so it supports the word possibility and not speed."
        citation_keys: ["tsebelis-2000-veto-players-institutional"]
      - type: citation
        anchor: "Williamson 2000, p. 599: governance is re-examined periodically, often at contract or equipment renewal intervals. Not cited for a carrier floor."
        citation_keys: ["williamson-2000-new-institutional-economics"]

  - id: P26
    statement: >-
      The Governor column of Table 1 names what constrains a tier; the parties whose
      commitments sit on the tier set its tempo. The two overlap but differ: management
      governs Tier 5, while customer qualification of a supplier sets its tempo in supplier
      industries. Commitments that must be re-accepted include bank covenants (Tiers 2 and
      3), license conditions (Tier 3), and customer qualification of a supplier (Tiers 4
      and 5). The "Tempo Set By" column of Table 1 carries only these examples and gives no
      example for Tiers 1 and 6, which does not mean that no party sets their tempo. A decided change differs from drift, a change in effects without a change in
      formal rules (or their interpretation), caused by a changed external context; the
      paper reads a change in formal rules as a change in the commitments on the tier; the split is prior art. Pace
      layering orders layers by their own rates, whereas this account derives a tier's rate
      from the commitments other parties hold on it.
    antecedents: [P25]
    body_sections: ["The Six-Tier Ontology (Table 1)", "Tier Tempo Is Relational"]
    evidence:
      - type: citation
        anchor: "Galvin & Hacker 2020, p. 217: drift is a substantial and recognizable change in effects that takes place without a change in formal rules (or their interpretation), due to the transformation of the external context. The split between drift and decided change is theirs."
        citation_keys: ["galvin-2020-political-effects-drift"]
      - type: citation
        anchor: "Brand 1999: layers of a civilization evolve at different rates. Beane & Leonardi 2025: the pace-layering idea applied to organizations. Cited as the neighboring account; the relation is complementary and no claim is made that it is replaced."
        citation_keys: ["brand-1999-clock-long-now", "beane-2025-pace-layering-as"]

  - id: P27
    statement: >-
      A testable implication of the tempo bound, stated as untested: an outside event that
      changes the commitments on a tier with a low carrier floor and short re-acceptance
      chains shows on that tier at once; a tier with long chains responds within the same
      year only if the event acts on its commitments directly.
    antecedents: [P25, P26]
    falsifier: >-
      A tier with long re-acceptance chains and a high carrier floor responds within the
      same year to an outside event that does not act on its commitments, or a tier with a
      low carrier floor and short chains does not show an event that changes its
      commitments.
    body_sections: ["Tier Tempo Is Relational", "Limitations (Tier tempo)"]
    evidence: []

  - id: P28
    statement: >-
      The business model is the exchange through which each position contributes to the
      business and is paid in its own valuation; the customer is distinguished as the
      position whose acceptance releases the inflow that pays the others. The customer
      clause is this paper's wording.
    antecedents: [P17]
    body_sections: ["Tier 2 — Business Model"]
    evidence:
      - type: citation
        anchor: "Barnard 1938 (1968 edition), pp. 254-255: separate customer, labor, credit, supply and technological economies; exchanges cannot be confined to or measured completely in dollars. Barnard keeps a common purpose (p. 89). He does not single out the customer."
        citation_keys: ["barnard-1938-functions-executive"]
      - type: citation
        anchor: "Adner 2017, p. 42: actors with different end goals and their alignment; p. 51: a business model is the focal firm's plan, a different level from the ecosystem."
        citation_keys: ["adner-2017-ecosystem-as-structure"]

  - id: P29
    statement: >-
      Law makes commitments whose content sits on other tiers hold against third parties;
      this is the guarantee role of Tier 3, beside the recording-document role stated in the
      assignment rule. The statement is not generalized to every commitment of a business.
    antecedents: [P18, P19]
    body_sections: ["Tier 3 — Business Entity"]
    evidence:
      - type: citation
        anchor: "Pistor 2019, pp. 2, 14-15: capital is an asset plus the legal code; legal coding makes claims hold against anybody; a two-party agreement cannot bind others. Stated by Pistor for capital assets only."
        citation_keys: ["pistor-2019-code-of-capital"]
      - type: citation
        anchor: "Hansmann & Kraakman 2000, pp. 392-393: a firm must bond its contracts credibly with a pool of bonding assets; the firm's creditors have a prior claim on them."
        citation_keys: ["hansmann-2000-essential-role-organizational"]

  - id: P30
    statement: >-
      The positions' intents do not weigh equally on the business. The weight of a
      commitment on a tier is defined here as the loss the business bears if its author
      uses the backing over it. The kinds of backing are control, contract, law, exit and voice. Rights are
      tier-specific: control and law-backed rights sit on Tier 3. A party that gains
      leverage on one tier can use it to obtain a right on another by bargaining: a key
      employee, whose leverage sits on Tier 6, obtains equity, a Tier 3 right. Law can force
      a commitment whatever the position's added value.
    antecedents: [P18, P19]
    body_sections: ["Tier 1 — Intent (Backing by tier)"]
    evidence:
      - type: citation
        anchor: "Emerson 1962, pp. 32-33: power resides in the other's dependency; the power of A over B equals the dependence of B upon A. Not cited for a ranking of whose demands should prevail."
        citation_keys: ["emerson-1962-power-dependence-relations"]
      - type: citation
        anchor: "Mitchell, Agle & Wood 1997: stakeholder salience from power, legitimacy and urgency; no page."
        citation_keys: ["mitchell-1997-toward-theory-stakeholder"]
      - type: citation
        anchor: "Hirschman 1970, pp. 4, 30: customers and members respond to decline by exit or voice; definition of voice. Not cited for loyalty."
        citation_keys: ["hirschman-1970-exit-voice-loyalty"]
      - type: citation
        anchor: "Klein et al. 2012, pp. 306, 309: residual decision rights held by each party affect what it can claim; control goes to the parties whose specific investments matter most. Not cited for control assigned by layer or activity type."
        citation_keys: ["klein-2012-property-rights-stakeholder"]

  - id: P31
    statement: >-
      A customer's requirement on the product is a Tier 4 commitment. What the customer
      wants from the business itself, such as supply for a stated number of years, is Tier
      1 content of the customer position.
    antecedents: [P17, P19]
    body_sections: ["Tier 1 — Intent (Assignment rule)"]
    evidence: []

# ============================================================================
# Boundary conditions — where the framework's claims hold cleanly
# ============================================================================
boundary_conditions:
  - id: C1
    statement: >-
      The framework applies most cleanly to closely-held businesses with a
      dominant principal whose controlling intent is a relatively stable scalar stance.
    excludes: "Dispersed-ownership / publicly-traded / multi-investor-class targets where the controlling intent is a vector."
    body_sections: ["Limitations (Multi-principal Intent configurations)"]
  - id: C2
    statement: >-
      The current tier definitions, propositions, and diagnostic apply to unit-
      good businesses; platform and network (multi-sided) businesses require
      modified governors, specification surfaces, and transferability modes.
    excludes: "Two-sided markets and ecosystem orchestrators apply WITH modification, not without it."
    body_sections: ["Network and Platform Boundary Conditions"]
  - id: C3
    statement: >-
      Table 1's transferability-mode column is indexed to ACQUIRER OPERATING POSTURE. Every entry
      answers what would arrive in a buyer's possession on the unstated assumption that the buyer
      supplies its own operating principal, so the person-carried part of Tiers 4, 5 and 6 is written
      off because no buyer receives the occupant. That assumption holds for acquisition into an
      existing operating platform. It fails where the entity is conveyed AND the operating principal
      is replaced by someone who must acquire the residual personally — search-fund and individual
      acquirers, standalone-hold private equity, a strategic buyer keeping a specialist practice
      running as it is; those structures are a minority of global deal count and are concentrated in
      a few markets. There the person-carried column is not written off; it is precisely what the
      buyer must absorb. The conditioning alters no tier definition and no failure-propagation
      mechanism. What it does alter is how three cells of the transferability-mode column READ under
      the second index value: the person-carried components of Tiers 4, 5 and 6 are not written off
      there but absorbed and priced by the incoming principal, and a retention window is one
      instrument through which that absorption is paid for — a reading complementary to, not a
      replacement for, the established account of contingent consideration as a response to
      valuation disagreement under information asymmetry and as a retention and risk-allocation
      device.
    excludes: >-
      Acquisitions in which the buyer supplies no operating principal: the column applies to those
      only once read against this index, and their persistence reading is derived elsewhere in the
      corpus rather than here.
    body_sections: ["Limitations (Acquirer operating posture)", "The Six-Tier Ontology (Table 1 notes)"]

# ============================================================================
# Alternative frameworks the contribution rules out / distinguishes from
# ============================================================================
alternative_explanations:
  - id: A1
    statement: >-
      The contribution is "just another antecedent variable" or a relabeling of
      an existing layered firm ontology (Zachman, Osterwalder, BIZBOK, DEMO).
    rules_out_required: [P3]
    ruled_out_by: [P2, P3]
    rules_out_status: "rejected"
    reasoning: >-
      The primary contribution is an ARCHITECTURE (a constraint-based view with
      bidirectional propagation), not an antecedent; and no prior layered
      ontology combines a distinct Intent tier above the Business Model, a
      distinct legal Business-Entity tier, per-tier transferability modes, dual
      service/constraint hierarchies, and an M&A application.
    body_sections: ["Layered Ontologies of the Firm", "Theoretical Contribution"]
  - id: A2
    statement: >-
      Single-layer explanations (cultural distance, executive turnover,
      strategic misfit, business-model misalignment) already account for M&A
      failure.
    rules_out_required: [P1]
    ruled_out_by: [P1, P6F]
    rules_out_status: "rejected"
    reasoning: >-
      Each single-layer explanation diagnoses one tier and cannot specify how
      failure propagates to adjacent tiers; the common single-layer structure is
      precisely what makes them collectively inadequate.
    body_sections: ["The M&A Failure Literature and Its Missing Layer"]

# ============================================================================
# Limitations — honest scope
# ============================================================================
limitations:
  - id: L1
    statement: >-
      The cascade claim is theoretical: P1F-P5F and P7F have no end-to-end
      empirical support; P6F is partially documented but not as an end-to-end
      chain. The propositions are derived from the dual hierarchy and consistent
      with adjacent single-layer findings, not yet traced in one integrated
      study. One adjacent structural claim has since been tested at large N, and the result BOUNDS
      rather than confirms — a closing-time product-process / process-organization transfer gap is a
      necessary condition for cascade-type failure only in a bounded form (failure rate conditional
      on no detected gap is low but not zero; roughly half of failures carried a gap), so structural
      conformance is a pre-close negative screen for one failure mode and not a general predictor.
      That bound reaches P4F and P5F by ANALOGY only: its construct is closing-time transfer content,
      whereas every proposition here concerns acquirer-imposed post-close revision. The remaining
      five propositions are untouched by it, and none of the seven may be read as claiming more.
    severity: "scope-bounding"
    affects: [P1F, P2F, P3F, P4F, P5F, P6F, P7F]
    body_sections: ["Limitations (Cascade claim is theoretical)", "Failure-Propagation Propositions", "Validation and Future Research Agenda"]
  - id: L2
    statement: >-
      Form-invariance is provisional: only the Tier 1 and Tier 3 substitutions
      are externally anchored; the Tier 2, 4, and 5 substitutions are logical
      deductions requiring cross-form empirical validation. The state-owned /
      public column added in Table 2 is weaker still — all six of its entries
      are deductions, only its Tier 1 entry carries an external anchor, and that
      anchor establishes the political-principal objective rather than a
      normative public-service mandate.
    severity: "scope-bounding"
    affects: [P8]
    body_sections: ["Limitations (Form-invariance is provisional)"]
  - id: L3
    statement: >-
      The STSD is currently a structured judgment instrument with no inter-rater
      reliability data and no published predictive-validity evidence; validation
      (Cohen's kappa >= .70 per tier, then predictive and cross-form studies) is
      the future-research agenda. The large-N companion does NOT supply any part of that evidence: it
      administered no diagnostic, coding a sibling structural construct from closing documents
      against a different outcome. It constrains how the predictive-validity study should be
      SPECIFIED — as a screen-validation design rather than a strong-predictor test — and the
      instrument companion supplies a measurement discipline, itself an instance of an established
      external content-analysis standard rather than a substitute for it.
    severity: "future-work"
    affects: [P12]
    body_sections: ["Validation and Future Research Agenda"]
  - id: L4
    statement: >-
      Dispersed ownership also multiplies ontologies: co-principals may word the same Intent in
      different stakeholder ontologies, and the framework as stated assumes a single Owner
      Ontology.
    severity: "scope-bounding"
    affects: [P14, P15, P16]
    body_sections: ["Limitations (Multi-principal Intent configurations)"]
  - id: L5
    statement: >-
      Where ownership is dispersed the controlling intent is a vector, which
      differs from the plurality of positions' intents that every business has. In
      a VC-backed start-up the usual Tier 1 event is a change of the controlling
      intent without a sale: the investors exercise control, a Tier 3 field,
      through the board, and the founder's intent persists as the intent of a
      non-controlling position while the founder keeps equity and exits with the
      founder. The founder departure in Table 3 is a different case, the end of
      Tier 6 knowledge transfer after an acquisition. The extension to
      dispersed-ownership structures is not worked through here.
    severity: "scope-bounding"
    affects: [P4, P18]
    body_sections: ["Limitations (Multi-principal Intent configurations)"]
  - id: L6
    statement: >-
      The tempo bound is stated, not tested. The carrier floor is an assumption of this
      paper and was not found in print. A test needs a named reference clock for each tier,
      because a tempo has no value without one.
    severity: "future-work"
    affects: [P25, P26, P27]
    body_sections: ["Limitations (Tier tempo)"]

# ============================================================================
# Cross-paper engagement (real corpus keys)
# ============================================================================
corpus_precedents:
  - paper_key: 2026a
    relationship: applies
    spine_nodes: [P2]
    note: >-
      SBT's eight-dimension framework is cited as one example of a precision
      specification instrument for brand-anchored Tier 4 Products (Table 1 note;
      Tier 4 subsection).
  - paper_key: 2026ah
    relationship: extends
    spine_nodes: [P2, P9]
    note: >-
      Brand-as-Tier-4 (the multi-brand / recovery companion) develops the
      brand-portfolio implications of identifying brand with Tier 4.
  - paper_key: 2026h
    relationship: applies
    spine_nodes: [P4F]
    note: >-
      Specification Impossibility supplies the impossibility-of-full-Product-
      specification result that compounds the Product-Process disruption (P4).
  - paper_key: tier-bundle-algebra
    relationship: extends
    spine_nodes: [P7, P8]
    note: >-
      The compositional grammar over this paper's tier graph: deal types as typed bundles of fork
      operations, with cascade rules and admissibility conditions inherited from the collapse
      patterns. The companion the Future-Research subsection announced, now published and cited.
      Its tables are the formal source for the two deal types the text names: an asset deal leaves
      Tier 3 empty and forks Tier 6 partially; an acqui-hire forks Tier 6 one to one while the
      seller's Tier 3 dissolves.
  - paper_key: 2026bi
    relationship: tests
    spine_nodes: [P4F, P5F, L1]
    note: >-
      Large-N confirmatory necessary-condition test of the closing-time cascade gap. The result
      BOUNDS the propositions rather than confirming them, and reaches only P4F and P5F, by analogy
      (closing-time transfer content versus acquirer-imposed post-close revision). It administered no
      separability diagnostic, so it supplies no part of the STSD's predictive-validity evidence and
      is cited on that scope in the propositions preamble, the validation agenda and Limitations.
  - paper_key: multi-llm-coding-instrument
    relationship: applies
    spine_nodes: [P12, L3]
    note: >-
      Supplies the measurement discipline the STSD validation agenda requires: coding scheme
      registered before data, disjoint evidence per coder, reliability reported rather than assumed.
  - paper_key: succession-rotation
    relationship: extends
    spine_nodes: [C3]
    note: >-
      Derives a second, persistence column from this paper's primitives for the case where nothing is
      conveyed to a counterparty, and in doing so names the assumption Table 1's transferability-mode
      column left unstated: that the buyer supplies an operating principal (C3).
  - paper_key: 2026x
    relationship: applies
    spine_nodes: [P21]
    note: >-
      AI-native brand identity: machine observers read structured data and behaviour, and the
      cryptographic signature is the machine-side identifier. Cited for the illustration of a product
      with no sign (an API service reachable by IP only).
  - paper_key: 2026e
    relationship: applies
    spine_nodes: [P21]
    note: >-
      Spectral metamerism defines metamerism for a projection of 8D profiles onto a grade. Cited for
      an analogy only: one category name over many specifications is analogous to metamerism, not an
      instance of it.
  - paper_key: 2026m
    relationship: applies
    spine_nodes: [P7]
    note: >-
      The Projection Cascade supplies the formal junction-localized rank-
      deficiency bound + sub-additivity inequality the dual-hierarchy framework
      proposes at the ontological level (bidirectional propagation).

