# ONTOLOGY.yaml module — 2026ag (Six-Tier Ontology)
#
# Owns the six-tier organizational ontology terms. Canonical source:
# [internal path removed] §1. Naming convention: Tier 1-6
# (the six-tier scheme), distinct from L0-L5 (OST config schema) per
# memory/[internal ref removed]. The ost-l05-vs-sixtier-note
# will later add an L0-L5 module and explicit maps-to / refines edges between
# the two schemes; this module is the Tier-1-6 authority those edges resolve to.

paper_key: 2026ag
schema_version: 0.1

owns:
  - term_key: six-tier-ontology
    label: "six-tier ontology"
    canonical_form: "six-tier ontology"
    definition: >-
      The ontology that decomposes an organization into six nested
      specification tiers, always in the order Intent -> Business Model
      -> Business Entity -> Product -> Process -> Organization. Each tier
      answers a distinct governing question and transfers differently on sale.
      Full form: "six-tier ontology of a business". It is the analyst's common
      language for a business, set apart from a stakeholder ontology, which is
      the business's own ontology as one named position writes it.
      Position-symmetric (every position has the same row: its intent at
      Tier 1, its commitments at Tiers 2-6) but not observer-free: the
      analyst's position configures it. Each position's Tier 1 content is its
      Intent and its stakeholder ontology; the position reads the six tiers in
      that ontology.
    first_section: "§1"

  - term_key: position
    label: "position"
    canonical_form: "position"
    definition: >-
      A standpoint from which a subject and an intent are formed: the
      analyst's or a party's. A party's position is the one from which it deals
      with the business (owner, lender, employees, union, customers, the state,
      a potential buyer). A collective can hold a position: the people a
      business organizes can come to hold goals as a collective, and that
      collective's intent is Tier 1 content of its position, carried in the
      Tier 6 culture; the business itself has no intent of its own. Tiers are
      ordered by rank in the constraint hierarchy, not by position.
    first_section: "§1"

  - term_key: tier-1-intent
    label: "Tier 1 (Intent)"
    canonical_form: "Tier 1 (Intent)"
    definition: >-
      The intent regarding the business of each position that deals with it
      (owner, lender, employees, union, customers, the state, a potential
      buyer): its purpose, what it wants from the business, its horizon and its
      exit criteria. Tier 1 contains parameters of positions, never parameters
      of the business. Position-bound: at a change of control the controlling
      intent is replaced and the other positions' intents persist. Each
      position's stakeholder ontology is Tier 1 content of that position.
    first_section: "§1"

  - term_key: tier-1-owner-intent
    label: "Owner Intent"
    canonical_form: "Owner Intent"
    definition: >-
      The intent of the controlling position: the instance of Tier 1 (Intent)
      that the business's bodies adopt by decision. The owner's special status
      is control, a Tier 3 field. Replaced, not transferred, at a change of
      control.
    first_section: "§1"
    relations:
      - {type: specializes, term_key: tier-1-intent}

  - term_key: stakeholder-ontology
    label: "stakeholder ontology"
    canonical_form: "stakeholder ontology"
    definition: >-
      A picture of what exists in an activity, what its basic terms mean, what
      is connected to what, and what is absent, as written from one named
      position (owner, manager, employee, customer, lender, regulator, buyer,
      successor), recorded in that position's own words. It is Tier 1 content
      of its position.
    first_section: "§1"

  - term_key: owner-ontology
    label: "Owner Ontology"
    canonical_form: "Owner Ontology"
    definition: >-
      The stakeholder ontology of the controlling position: the terms in
      which Owner Intent is phrased and most of the
      firm's records are written. Tier 1 content carried by the same principal
      as Owner Intent, not a seventh tier: the Owner Ontology fixes the terms in
      which questions about the business are worded, and Owner Intent fixes
      which questions are asked.
    first_section: "§1"
    relations:
      - {type: specializes, term_key: stakeholder-ontology}

  - term_key: owner-ontology-shareable-part
    label: "shareable part"
    canonical_form: "shareable part"
    definition: >-
      The part of the Owner Ontology that is the reading key to existing
      records: the owner's terms as used in the records, verbatim, and the list
      of ontology-dependent records. It can pass to a buyer or successor as a
      document.
    first_section: "§1"

  - term_key: owner-ontology-private-part
    label: "private part"
    canonical_form: "private part"
    definition: >-
      The part of the Owner Ontology that generates future records: deliberate
      absences, causal beliefs, sources of the edge, values, and judgement of
      people. It stays with the owner and passes to a successor only by the
      owner's choice.
    first_section: "§1"

  - term_key: ontology-dependent-records
    label: "ontology-dependent records"
    canonical_form: "ontology-dependent records"
    definition: >-
      Records whose meaning depends on the Owner Ontology, so that a reader
      outside the firm cannot read them correctly without it. Their share is a
      readiness measure beside fusion.
    first_section: "§1"

  - term_key: tier-2-business-model
    label: "Tier 2 (Business Model)"
    canonical_form: "Tier 2 (Business Model)"
    definition: >-
      How value flows into resources. Governed by the CEO (a founder-CEO holds
      the controlling position and the chief-executive place). Conceptually
      replicable; not legally owned. Customer concentration is a Tier 2
      parameter. The business model is the exchange through which each position
      contributes to the business and is paid in its own valuation; the
      customer is distinguished as the position whose acceptance releases the
      inflow that pays the others.
    first_section: "§1"

  - term_key: tier-3-business-entity
    label: "Tier 3 (Business Entity)"
    canonical_form: "Tier 3 (Business Entity)"
    definition: >-
      What is legally registered and saleable (IP, trademarks, contracts,
      corporate-legal personality). Governed by General Counsel / corporate
      treasury. Transfers by document. Often absent from AI-strategy meetings.
      Includes control (residual decision rights fixed by the legal form:
      charter, cap table) and the registered rights to use a sign (classes,
      territory). It also has a guarantee role: law makes commitments whose
      content sits on other tiers hold against third parties, beside the
      recording-document role of the assignment rule. The guarantee role is
      not generalized to every commitment of a business.
    first_section: "§1"

  - term_key: tier-4-product
    label: "Tier 4 (Product)"
    canonical_form: "Tier 4 (Product)"
    definition: >-
      What is delivered to whom; includes the brand's specification only (the
      sign, its form and the rules for its use, and its dimensions as
      specified), per Brand-as-Tier-4. Campaigns and PR are flow on Tier 2
      channels; the perception the emissions produce lies outside the six
      tiers. CMO governs the brand sub-spec; CTO the technical sub-spec
      (canonical collision at Tier 4). Transfers if specified; not if tacit.
    first_section: "§1"

  - term_key: tier-5-process
    label: "Tier 5 (Process)"
    canonical_form: "Tier 5 (Process)"
    definition: >-
      How the product is produced. CFO governs the financial sub-spec; COO the
      operational sub-spec (canonical collision at Tier 5). Transfers if codified.
    first_section: "§1"

  - term_key: tier-6-organization
    label: "Tier 6 (Organization)"
    canonical_form: "Tier 6 (Organization)"
    definition: >-
      The people, roles, culture, tacit knowledge and relational networks that
      execute the Process; the Tier 6 part of marketing is the department's
      people. Governed by CHRO (sometimes COO). Transfers only partially
      (retention contracts at best).
    first_section: "§1"

  - term_key: tier-tempo
    label: "tier tempo"
    canonical_form: "tier tempo"
    definition: >-
      How often a tier completes a decided change, stated against a named
      reference clock (the calendar, the environment's cycle, another tier, or
      a party's cycle). A decided change on a tier cannot finish before the
      longest chain of re-acceptances required from the parties that hold
      commitments on that tier, nor faster than the tier's carrier floor
      allows. The claim is a lower bound set by the longest chain, not the
      product of the number of re-acceptances and the time each takes; it
      counts decided change and not drift. Distinct from temporal-stability-hierarchy, which
      orders levels of organizational abstraction by stability.
    first_section: "§1"

  - term_key: carrier-floor
    label: "carrier floor"
    canonical_form: "carrier floor"
    definition: >-
      The shortest cycle the carrier of a tier allows. People learn and agree
      at human speed, law sets procedural minimums, and a written artifact
      changes at machine speed. An assumption of the six-tier paper; it was not
      found in print.
    first_section: "§1"

  - term_key: facet
    label: "facet"
    canonical_form: "facet"
    definition: >-
      Observer-relative: the part of the business that one position reads, namely
      the commitments in force on a date that the position authors, holds, accepts
      or receives records of. It is not an intrinsic constituent of a tier;
      culture, for example, is Tier 6 content and not a constituent of every
      tier. Distinct from the tier itself (a stratum). Additive OST/SBT construct
      reconciled from the manda five-term method vocabulary 2026-08-01; it does
      NOT replace "layer", which keeps its canonical corpus senses (including the
      colloquial synonym for Tier). Its specification depth, where applicable, is
      the native L0-L5 cascade. RU canonical form: Gran (Грань).
    first_section: "§1"

imports:
  - {term_key: acquirer-operating-posture}
refines: []

