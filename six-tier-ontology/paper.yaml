limitations:
- description: 'The cascade claim is theoretical: P1F-P5F and P7F have no end-to-end empirical support;
    P6F is partially documented but not as an end-to-end chain. The propositions are derived from the
    dual hierarchy and consistent with adjacent single-layer findings, not yet traced in one integrated
    study. One adjacent structural claim has since been tested at large N, and the result BOUNDS rather
    than confirms — a closing-time product-process / process-organization transfer gap is a necessary
    condition for cascade-type failure only in a bounded form (failure rate conditional on no detected
    gap is low but not zero; roughly half of failures carried a gap), so structural conformance is a pre-close
    negative screen for one failure mode and not a general predictor. That bound reaches P4F and P5F by
    ANALOGY only: its construct is closing-time transfer content, whereas every proposition here concerns
    acquirer-imposed post-close revision. The remaining five propositions are untouched by it, and none
    of the seven may be read as claiming more.'
  severity: moderate
  addressable: true
- description: 'Form-invariance is provisional: only the Tier 1 and Tier 3 substitutions are externally
    anchored; the Tier 2, 4, and 5 substitutions are logical deductions requiring cross-form empirical
    validation. The state-owned / public column added in Table 2 is weaker still — all six of its entries
    are deductions, only its Tier 1 entry carries an external anchor, and that anchor establishes the
    political-principal objective rather than a normative public-service mandate.'
  severity: moderate
  addressable: true
- description: 'The STSD is currently a structured judgment instrument with no inter-rater reliability
    data and no published predictive-validity evidence; validation (Cohen''s kappa >= .70 per tier, then
    predictive and cross-form studies) is the future-research agenda. The large-N companion does NOT supply
    any part of that evidence: it administered no diagnostic, coding a sibling structural construct from
    closing documents against a different outcome. It constrains how the predictive-validity study should
    be SPECIFIED — as a screen-validation design rather than a strong-predictor test — and the instrument
    companion supplies a measurement discipline, itself an instance of an established external content-analysis
    standard rather than a substitute for it.'
  severity: moderate
  addressable: true
- description: 'Dispersed ownership also multiplies ontologies: co-principals may word the same Intent
    in different stakeholder ontologies, and the framework as stated assumes a single Owner Ontology.'
  severity: moderate
  addressable: true
- description: 'Where ownership is dispersed the controlling intent is a vector, which differs from the
    plurality of positions'' intents that every business has. In a VC-backed start-up the usual Tier 1
    event is a change of the controlling intent without a sale: the investors exercise control, a Tier
    3 field, through the board, and the founder''s intent persists as the intent of a non-controlling
    position while the founder keeps equity and exits with the founder. The founder departure in Table
    3 is a different case, the end of Tier 6 knowledge transfer after an acquisition. The extension to
    dispersed-ownership structures is not worked through here.'
  severity: moderate
  addressable: true
