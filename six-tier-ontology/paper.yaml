acceptance:
- claim_id: P1F
  criterion: 'Holds if P1 (Intent-Model Misalignment): when an acquirer''s controlling intent differs
    structurally from the target''s configuration and from the intents behind the commitments that carry
    over, the target''s Business Model requires fundamental revision, generating downstream Tier 4/Tier
    5 friction not visible in pre-close due diligence.'
  falsification: For-profit acquisitions of mission-primary targets show no greater rate of Model revision
    / downstream disruption than financially equivalent for-profit-to-for-profit deals.
- claim_id: P2F
  criterion: 'Holds if P2 (Business Model-Product Friction): an imposed Model revision drifts the Product
    specification toward the new Model''s optimization criteria, and customers anchored in the prior dimensional
    configuration churn above pre-acquisition baselines.'
  falsification: No systematic association between Model revision and product attribute drift across completed
    acquisitions with matched pre/post-close data.
- claim_id: P3F
  criterion: 'Holds if P3 (Entity-Operations Disruption): Entity restructuring following close disrupts
    operational continuity at Tiers 5 and 4 via contract renegotiation, regulatory re-certification, and
    counterparty uncertainty disproportionate to the restructuring''s legal scope.'
  falsification: No significant association between Entity restructuring and operational-continuity disruption.
- claim_id: P4F
  criterion: 'Holds if P4 (Product-Process Disruption): revising the Product specification misaligns the
    Process architecture built for the prior Product, generating quality failures or cost overruns until
    Process is rebuilt around the new spec — compounded by the impossibility of fully specifying Product
    requirements and the tacit residuals documentation cannot eliminate.'
  falsification: No systematic association between Product revision and quality/cost variance, controlling
    for baseline Process maturity.
- claim_id: P5F
  criterion: 'Holds if P5 (Process-Organization Fracture): imposing Process integration on the acquired
    Organization before Tier 4 specification clarity is established produces employee resistance and attrition
    exceeding rates when Process integration follows Product confirmation.'
  falsification: No systematic difference in attrition between Product-first and Process-first sequencings
    in matched samples.
- claim_id: P6F
  criterion: 'Holds if P6 (Organization Fracture to All-Layer Degradation): when key Organization members
    exit post-acquisition, the tacit knowledge they carried degrades across all six tiers at rates retention
    bonuses or post-exit documentation cannot recover, because Tier 6 is the sole repository of tacit
    specification knowledge never externalized to Tier 4/5 surfaces.'
  falsification: Acquisitions with high pre-close codification show the same all-layer degradation rate
    following executive turnover as low-codification ones.
- claim_id: P7F
  criterion: 'Holds if P7 (Bidirectional Feedback): sustained lower-tier failure crossing a duration-and-severity
    threshold (Tier 5/6 fracture >= 12 months depressing Tier 3 revenue >= 10% from deal thesis) forces
    upward revision — documented Tier 2 Model revision within 24 months, and conditionally documented
    Tier 1 Intent revision (write-down/divestiture/strategic-review) within a further 12 months.'
  falsification: No systematic instances of threshold-crossing lower-tier failures precipitating Model/Intent
    revision under controlled exogenous shocks; or Model/Intent revisions as frequent below threshold
    as above.
