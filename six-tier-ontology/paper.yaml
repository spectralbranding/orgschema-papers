    the business, that of the controlling position, and it is Tier 1 content carried by the same principal,
    not a seventh tier; the stakeholder ontology of every other position is Tier 1 content of that position.
    It fixes the terms in which questions about the business are worded; Owner Intent fixes which questions
    are asked. Every stakeholder of the business has a stakeholder ontology of it, and the six-tier ontology
    of a business is the common language into which these stakeholder ontologies are translated. The Owner
    Ontology differs from dominant logic, the schema shared by top managers through which they conceptualize
    the business and allocate resources: it is the controlling principal''s own account, recorded in the
    principal''s words, and the paper''s interest in it is its division into a shareable and a private
    part at transfer.'
