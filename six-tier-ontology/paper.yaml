  - P7
- id: P12
  type: proposition
  statement: 'The Six-Tier Separability Diagnostic (STSD) is a THEORETICAL IMPLICATION, not the primary
    contribution: a structured judgment instrument that scores each tier Fused / Partial / Independent
    (Table 4), producing a six-cell pre-close risk profile. Its theoretical claim is that pre-close tier
    profiling predicts post-acquisition trajectories better than aggregate financial/strategic-fit measures,
    by disaggregating due-diligence risk by tier rather than producing an aggregate pass/fail verdict.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
