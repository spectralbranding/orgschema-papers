meta:
  title: 'Dual Hierarchies of Organizational Transferability: A Six-Tier Ontology and Theory of Acquisition
    Failure Propagation'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.19895813
  date: '2026-11-02'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - mergers and acquisitions
  - organizational ontology
  - transferability
  - business model
  - integration failure
  - form-invariance
  - separability diagnostic
  abstract: 'Mergers and acquisitions destroy value at high rates because scholars and practitioners lack
    a shared ontology specifying which organizational layers transfer and how failures propagate across
    them. This paper develops a six-tier ontology of the acquisition target — Intent, Business Model,
    Business Entity, Product, Process, and Organization — each with a distinct governor, specification
    surface, and transferability mode. The tiers form dual oppositely directed hierarchies: a service
    hierarchy upward from Organization to Intent and a constraint hierarchy downward from Intent to Organization.
    The constraint hierarchy determines integration sequencing; shocks propagate bidirectionally, generating
    seven falsifiable propositions about failure cascades. The framework is form-invariant across for-profit,
    NGO, cooperative, and state-owned entities via substitution rules, with Tier 2, 4, and 5 and the whole
    state-owned column provisional. The ontology connects siloed streams — cultural distance, executive
    turnover, business-model misfit, integration capabilities — under one transferability logic, explaining
    residual variance in meta-analyses [@king-2004-metaanalyses-postacquisition-performance; @king-2021-metaanalytic-integration-acquisition].
    The primary contribution is a generalizable theory of organizational separability under ownership
    change, with implications for theory of the firm and dynamic capabilities. A Six-Tier Separability
    Diagnostic is derived as a theoretical implication; a companion large-N test bounds an adjacent structural
    claim to a pre-close screen for one failure mode, not a general predictor.'
