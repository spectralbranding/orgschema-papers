- id: P11
  type: proposition
  statement: 'The constraint hierarchy derives a formal (not prescriptive) integration SEQUENCING principle:
    resolve Tier 1 compatibility before Tier 2 revision; Tier 2 revision before Tier 4 specification;
    confirm Tier 4 before Tier 5 integration; confirm Tier 5 before Tier 6 role redesign; Tier 3 integration
    is legally immediate but should be designed to minimize disruption to Tiers 4-6. The modal failure
    mode in practice INVERTS this sequence (beginning at Tier 6/5 with Tiers 1-4 unresolved).'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
