meta:
  title: 'Dual Hierarchies of Organizational Transferability: A Six-Tier Ontology and Theory of Acquisition
    Failure Propagation'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.19895813
  date: '2026-06-01'
  venue: AMR-tradition conceptual theory journal
  license: CC-BY-4.0
  keywords:
  - mergers and acquisitions
  - organizational ontology
  - transferability
  - business model
  - integration failure
  - form-invariance
  - separability diagnostic
  abstract: 'Mergers and acquisitions continue to destroy value at high rates because scholars and practitioners
    lack a shared ontology specifying which organizational layers are transferred and how failures propagate
    across them. This paper develops a six-tier ontology of the acquisition target — Owner Intent, Business
    Model, Business Entity, Product, Process, and Organization — each characterized by a distinct governor,
    specification surface, and transferability mode. The tiers form dual oppositely directed hierarchies:
    a service hierarchy running upward from Organization to Intent and a constraint hierarchy running
    downward from Intent to Organization. The constraint hierarchy determines integration sequencing;
    shocks propagate bidirectionally, generating seven falsifiable propositions about failure cascades.
    The framework is form-invariant across for-profit, NGO, and cooperative entities via explicit substitution
    rules, with Tier 2, 4, and 5 substitutions provisional. The ontology connects previously siloed streams
    — cultural distance, executive turnover, business-model misfit, and integration capabilities — under
    a single transferability logic, explaining residual variance documented in meta-analyses [@king-2004-metaanalyses-postacquisition-performance;
    @king-2021-metaanalytic-integration-acquisition]. The primary contribution is a generalizable theory
    of organizational separability under ownership change, with implications for theory of the firm and
    dynamic capabilities. A Six-Tier Separability Diagnostic is derived as a theoretical implication;
    propositions carry confirming and falsifying criteria.'
claims:
- id: SF1
  type: proposition
  statement: Across two decades of meta-analyses, post-acquisition failure remains the modal outcome and
    strategic/financial/organizational antecedents explain only a modest fraction of performance variance
    — a persistent residual the field attributes to "unidentified moderators."
  testable: false
  tested_in_paper: false
  status: not_tested
- id: P1
  type: proposition
  statement: 'The residual is an ontological deficit, not merely an empirical one: the M&A literature
    has accumulated sophisticated single-layer explanations (cultural distance, executive turnover, strategic
    misfit, business-model misalignment) but lacks a shared vocabulary for how those layers relate, constrain
    one another, or propagate failure across the entity.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - SF1
- id: P2
  type: proposition
  statement: An acquisition target decomposes into exactly six tiers — Owner Intent, Business Model, Business
    Entity, Product, Process, Organization — each individuated by a distinct GOVERNOR (force that sets
    the tier's configuration), a distinct SPECIFICATION SURFACE (observable artifacts), and a distinct
    TRANSFERABILITY MODE (mechanism by which the tier does or does not cross an ownership boundary).
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
- id: P3
  type: proposition
  statement: 'The six tiers are objects of heterogeneous ontological type (a latent psychological state,
    an abstract projection, a legal artifact, operational realities) unified under a single instrumental
    axis — transferability mode: the question is not "are they the same kind of thing?" but "what happens
    to each kind of thing when it crosses a new-owner boundary?" This answers the ontological-mixing objection
    and distinguishes the framework from prior layered firm ontologies (Zachman, Osterwalder, BIZBOK,
    DEMO), none of which combine a distinct Owner-Intent tier above the Business Model, a distinct Business-Entity
    legal tier, per-tier transferability modes, dual hierarchies, and an M&A application.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P2
- id: P4
  type: proposition
  statement: 'Tier 1 (Owner Intent) attaches to the controlling principal, not to the asset, and only
    IMPRINTS onto the asset''s downstream tiers. Consequently Tier 1 is REPLACED, not transferred, across
    ownership change: a new principal supplies a new Tier 1 imprint while Tiers 2-6 carry forward (subject
    to the integration cascade). A single principal controlling multiple assets carries a per-asset Tier
    1, drawn from one archetype distribution but expressing differently per asset.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P2
- id: P5
  type: proposition
  statement: 'Tier 3 (Business Entity) is the most jurisdictionally MUTABLE of the six tiers: the legal
    vehicle can swap (redomiciliation, opco/holdco interposition, SPV insertion, sole-prop-to-LLC conversion)
    while Tiers 2, 4, 5, 6 continue without operational disruption. The persistent identity of a business
    therefore does not reside in Tier 3; the substantive Tier 3 transferability claim is decoupling of
    obligations from the principal''s balance sheet, not identification with a specific legal form.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P2
- id: P6
  type: proposition
  statement: The six tiers form two overlapping, oppositely directed hierarchies that are the same relationships
    read from opposite ends. The SERVICE hierarchy runs upward (Organization serves Process; Process serves
    Product; Product funds Entity; Entity implements Model; Model realizes Intent). The CONSTRAINT hierarchy
    runs downward (each tier rules out inadmissible configurations for the tier below it).
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P2
- id: P7
  type: proposition
  statement: Because upper tiers constrain lower tiers, specification clarity at upper tiers is logically
    PRIOR to integration execution at lower tiers, and a shock at any tier propagates in BOTH directions
    (a Tier 6 fracture reduces the productive capacity Tier 5 requires, transmitting up the service chain
    to Tier 4 drift even when the Product spec was never altered). Integration is therefore a cross-tier
    problem, not a within-tier one.
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P6
- id: P1F
  type: proposition
  statement: 'P1 (Intent-Model Misalignment): when an acquirer''s Owner Intent differs structurally from
    the target''s, the target''s Business Model requires fundamental revision, generating downstream Tier
    4/Tier 5 friction not visible in pre-close due diligence.'
  testable: true
  tested_in_paper: false
  status: not_tested
  depends_on:
