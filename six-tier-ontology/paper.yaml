- id: P9
  type: proposition
  statement: 'Tier-collapse is a structural pattern parameterized over TIER PAIRS, arising when the governor
    of one tier is identical to another''s. Two canonical instances: Tier 1 ≡ Tier 4 (Domain Craftsman
    / Family Steward / Mission Founder — Intent is inseparable from Product) and Tier 1 ≡ Tier 3 (sole-proprietor
    — the natural person IS the legal subject). In each, the fused-tier asset is untransferable as a going
    concern because the fused tier carries the principal''s identity, which legal instruments cannot convey.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P4
  - P5
- id: P10
  type: proposition
  statement: 'Capital allocation across tiers carries a flow-versus-stock character that varies systematically
    by tier position: Tier 6 spend (marketing, PR) is predominantly flow consumption (low transferable
    value); Tier 2-5 spend (model architecture, governance, product/process codification) is predominantly
    stock accumulation (high transferable value). Each tier carries a distinct half-life and substrate-accumulation
    coefficient; the transferability and accumulation classifications ALIGN.'
  testable: false
  tested_in_paper: false
  status: not_tested
