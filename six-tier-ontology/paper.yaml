  - P7
- id: P7F
  type: proposition
  statement: 'P7 (Bidirectional Feedback): sustained lower-tier failure crossing a duration-and-severity
    threshold (Tier 5/6 fracture >= 12 months depressing Tier 3 revenue >= 10% from deal thesis) forces
    upward revision — documented Tier 2 Model revision within 24 months, and conditionally documented
    Tier 1 Intent revision (write-down/divestiture/strategic-review) within a further 12 months. The feedback
    is asymmetric: below threshold, lower-tier failures are absorbed without upper-tier revision.'
  testable: true
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P6
  - P7
- id: P8
  type: proposition
  statement: 'The six-tier structure is FORM-INVARIANT: each tier has a structurally equivalent form across
    for-profit, NGO/charity, and mutual/cooperative types via explicit substitution rules (Table 2). Tier
    1 and Tier 3 substitutions are anchored in prior work; Tier 2, 4, and 5 substitutions are provisional
    theoretical deductions pending cross-form validation. The cooperative Tier 1 is a collective mandate,
    not a scalar individual intent.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
