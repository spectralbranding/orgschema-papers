  - P11
- id: P13
  type: proposition
  statement: Cross-form acquisitions face Tier 1 MISSPECIFICATION risk no standard due-diligence checklist
    captures, because financial due diligence examines Tier 3 and not Tier 1 compatibility. A cooperative's
    collectively held, democratically governed Tier 1 cannot be transferred without being replaced by
    a fundamentally different Intent (a credit union cannot be acquired by a bank without member consent).
    Privatization is the most tractable natural experiment for testing the form-mismatch principle.
  testable: false
