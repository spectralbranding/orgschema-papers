spec_version: 0.1.0
meta:
  title: 'Preparing to Sell and Preparing to Hand Over Are Rival Investments: A Persistence Column for
    the Six-Tier Ontology'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.21868658
  date: '2026-08-01'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - succession
  - business transfer
  - owner-managed firms
  - knowledge codification
  - tacit knowledge
  - organizational tiers
  - pre-registered design
  - measurement.
  abstract: 'An owner preparing to leave a firm faces two futures that are usually treated as one: the
    firm is sold, or the firm is handed to a successor. This paper derives why the preparation each rewards
    is different. A six-tier ontology of organizational transferability already states what arrives in
    a buyer''s possession, but that column is indexed to a counterparty, and a succession has none. Decomposing
    it into three mechanisms of persistence — legal, artifact, and person — yields a second column indexed
    to the event, under which a sale disturbs legal continuity and prices artifact continuity while a
    succession disturbs only what a person carries. Among the tiers a succession disturbs, exactly one
    is drawn at the firm''s operating frequency rather than at discretion, so its loss cannot be absorbed
    by deferral. In an owner-operated firm the holder of that residual is the only person who could document
    it and the only person who could teach it, making the two preparations rivals for one budget. The
    paper states the crossover this predicts, supplies a pre-registered design with its power, and reports
    an instrument-level audit finding neither construct measured in the survey and administrative families
    examined.'
claims:
- id: P1
  type: proposition
  statement: The six-tier ontology's published transfer column is indexed to a counterparty, so an event
    with no counterparty requires its own column -- the persistence column -- which is derivable from
    the same primitives rather than posited alongside them.
  testable: true
  tested_in_paper: true
  status: not_tested
- id: P0
  type: proposition
  statement: 'The entrepreneurial-exit literature establishes that exit is a set of divergent ROUTES with
    different drivers, and asks which route an owner takes. This paper asks the question that literature
    leaves open: given that the routes diverge, what does preparing for one do to readiness for the other?
    Preparation is where the divergence originates, not an undifferentiated antecedent to it.'
  testable: true
  tested_in_paper: true
  status: not_tested
- id: P2
  type: proposition
  statement: A tier whose persistence mechanism is undisturbed by an event cannot be the binding constraint
    on value retained through that event.
  testable: true
  tested_in_paper: true
  status: not_tested
- id: P3
  type: proposition
  statement: Removal disturbs legal continuity and prices artifact continuity, while replacement disturbs
    only person continuity. The two events therefore bind on different tiers, and preparation that raises
    value under one does not thereby raise value under the other.
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P2
- id: P4
  type: proposition
  statement: Tier 5 is the unique tier whose person-carried residual is both destroyed by Tier-1 replacement
    in the owner-operated population and exercised at operating frequency, so that its loss cannot be
    absorbed by deferring anything. The discriminating property is draw frequency, not tacitness.
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P3
- id: P5
  type: proposition
  statement: 'The successor''s acquisition of the Tier-5 residual is rate-limited by exception arrival
    rather than by preparation effort, so the transfer-rate bound differs in kind from a codification-rate
    bound: money buys codification, and it does not buy elapsed operating time. A multi-decade preparation
    window is therefore a structural feature, not a planning failure.'
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P4
- id: P6
  type: proposition
  statement: Under a finite budget of managerial attention and capital, an owner allocates between converting
    person-carried residual into artifact -- which raises value under removal -- and moving person-carried
    residual into a specific successor, which raises value under replacement. The two draw on the same
    scarce input, the incumbent's own time, and the second is additionally rate-limited by exception arrival,
    which the budget cannot relax.
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P4
  - P5
- id: P7
  type: proposition
  statement: 'The trade-off has gone untested because neither of its terms is measured by any existing
    instrument: the management-practice survey family scores response mode rather than documentation coverage,
    and exception rate is collected by no statistical agency. The absence of prior evidence is therefore
    predicted by the account rather than evidence against it.'
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P6
- id: P8
  type: proposition
  statement: 'The account predicts a crossover: documentation coverage predicts realized sale price but
    not handover disruption, and successor exposure predicts handover disruption but not sale price. The
    null it must beat is not "no association" but "one portfolio raises both".'
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P3
  - P6
methodology:
  type: computational
  design: 'Monte Carlo power simulation for the crossover contrast, over per-arm sample size, per-arm
    standardised effect, and the correlation between the two investments. Instrument-level audit of candidate
    sampling frames: for each candidate, read the survey instrument or data dictionary at primary-document
    level and record whether it contains an item measuring documentation coverage and an item measuring
    exception rate. The pre-registered design itself: a two-arm matched-transition study measuring documentation
    coverage and successor exposure at t-1 on one instrument, with realized price as the arm-A outcome
    at t and operating disruption as the arm-B outcome over t+1 to t+3.'
  analysis:
    software: code/power_divergence_signature.py
    method: Python 3.12 + uv-managed dependencies; numpy only
acceptance:
- claim_id: P1
  criterion: Holds if the six-tier ontology's published transfer column is indexed to a counterparty,
    so an event with no counterparty requires its own column -- the persistence column -- which is derivable
    from the same primitives rather than posited alongside them.
  falsification: If the transfer column already answers the no-counterparty question -- i.e. if for every
    tier what a buyer would receive coincides with what survives a replacement -- the second column is
    redundant and contribution 1 collapses into redescription.
- claim_id: P0
  criterion: Holds if the entrepreneurial-exit literature establishes that exit is a set of divergent
    ROUTES with different drivers, and asks which route an owner takes.
  falsification: Existing exit-route work shown to already model preparation as route-specific and rivalrous,
    in which case this paper's question is answered rather than open.
- claim_id: P2
  criterion: Holds if a tier whose persistence mechanism is undisturbed by an event cannot be the binding
    constraint on value retained through that event.
  falsification: An event in which value is demonstrably lost at a tier whose persistence mechanism the
    event leaves intact.
- claim_id: P3
  criterion: Holds if removal disturbs legal continuity and prices artifact continuity, while replacement
    disturbs only person continuity.
  falsification: A demonstration that replacement disturbs legal or artifact continuity materially, or
    that removal leaves the person-carried residual at risk in a way preparation could address.
- claim_id: P4
  criterion: Holds if tier 5 is the unique tier whose person-carried residual is both destroyed by Tier-1
    replacement in the owner-operated population and exercised at operating frequency, so that its loss
    cannot be absorbed by deferring anything.
  falsification: Another tier's person-carried residual shown to be drawn at operating frequency under
    replacement, or Tier 5's shown to be deferrable without production degrading.
- claim_id: P5
  criterion: 'Holds if the successor''s acquisition of the Tier-5 residual is rate-limited by exception
    arrival rather than by preparation effort, so the transfer-rate bound differs in kind from a codification-rate
    bound: money buys codification, and it does not buy elapsed operating time.'
  falsification: Transfer duration shown to respond strongly to investment intensity -- contact hours,
    structured rotation, simulated exception exposure -- which would weaken the claim to "differs in parameter".
- claim_id: P6
  criterion: Holds if under a finite budget of managerial attention and capital, an owner allocates between
    converting person-carried residual into artifact -- which raises value under removal -- and moving
    person-carried residual into a specific successor, which raises value under replacement.
  falsification: Owner-operated firms shown to raise both investments together without trade-off outside
    the C5 conditions, or the documenter and the teacher shown to be separable persons within C1.
- claim_id: P7
  criterion: 'Holds if the trade-off has gone untested because neither of its terms is measured by any
    existing instrument: the management-practice survey family scores response mode rather than documentation
    coverage, and exception rate is collected by no statistical agency.'
  falsification: An existing firm-level instrument containing an item measuring documentation coverage
    or exception rate, which would show the constructs were measurable and the trade-off simply untested.
- claim_id: P8
  criterion: 'Holds if the account predicts a crossover: documentation coverage predicts realized sale
    price but not handover disruption, and successor exposure predicts handover disruption but not sale
    price.'
  falsification: Both investments predicting both outcomes with the same sign and comparable magnitude
    within the C5 scope, which is the single-portfolio account.
