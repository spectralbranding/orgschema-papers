limitations:
- description: The design is specified and NOT run. Every proposition is derived; none is tested here.
  severity: major
  addressable: true
- description: The exception-arrival bound is the most exposed link in the chain and rests on an unmeasured
    parameter (AA2, NF5).
  severity: major
  addressable: true
- description: Selection into succession versus exit is not bounded outside the sudden-transition stratum,
    and that stratum is thin and cleans selection only WITHIN the succession arm -- a sudden transition
    largely forecloses the exit arm.
  severity: moderate
  addressable: true
- description: SF2 holds in one institutional setting with no replication outside it, and the features
    that make its natural experiment work do not travel.
  severity: moderate
  addressable: true
- description: The evidence base and the proposed setting are different jurisdictions. The three documented
    phenomena come from Italy, Denmark and Japan; the frame most likely to supply dated, identified transitions
    with an unambiguous sold-versus-retained test is a common-law company register elsewhere.
  severity: moderate
  addressable: true
- description: 'The cross-sectional gradients that distinguish the two accounts are separable in principle
    but not cleanly in practice: an insider is typically also more exposed, so counterparty distance and
    exposure move together in most samples.'
  severity: moderate
  addressable: true
- description: A documentary or artifact-count measure of documentation coverage behaves unknown-ly on
    low-activity units, and the error plausibly runs toward "prepared".
  severity: moderate
  addressable: true
- description: The exit arm as specified is not homogeneous. The frame excludes mixed leveraged handovers
    but does NOT exclude the fourth cell of P9 -- an ordinary arm's-length sale to a buyer who supplies
    no operating principal -- so the exit arm will contain such sales in unknown proportion. There successor
    exposure plausibly raises the price too, because the buyer is pricing handover risk they are about
    to bear personally, and the crossover attenuates toward zero as the fourth-cell share of the arm rises.
  severity: moderate
  addressable: true
- description: 'NOT ALL KNOWN BIAS IN THIS DESIGN IS CONSERVATIVE, and the paper must not imply that it
    is. The two arms carry outcomes of unequal reliability: the exit arm''s outcome is a realised transaction
    price, measured with near-zero error, while the succession arm''s outcome is operating disruption
    over t+1 to t+3, measured with substantial error. Differential attenuation shrinks the succession
    arm''s coefficients relative to the exit arm''s, and because delta is the exit-arm contrast minus
    the succession-arm contrast, shrinking the second inflates delta. That bias runs TOWARD this paper''s
    hypothesis, in the opposite direction to L8.'
  severity: major
  addressable: true
- description: The GROUP-CARRIED residual conceded under AA4 has no consequence anywhere in the design.
    Nothing measures or bounds the share of a firm's operating residual that is held jointly rather than
    by the departing principal, so the share of the firm to which the analysis applies is itself unmeasured.
  severity: moderate
  addressable: true
- description: The POWER TABLE IS AN UPPER BOUND FOR MORE REASONS THAN THE EXIT ARM'S HETEROGENEITY. The
    simulation also assumes no measurement error in either construct -- in a paper whose P7 says no instrument
    measures either, so attenuation is certain -- no covariates, although pre-trend controls and a relational-channel
    control are both mandatory in the design; balanced arms; identical standardised effects in the two
    arms; and a standard-normal rather than t reference for the test statistic, which is anti-conservative
    at the smallest sample sizes shown.
  severity: moderate
  addressable: true
