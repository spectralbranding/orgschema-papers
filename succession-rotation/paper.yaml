spec_version: 0.1.0
meta:
  title: 'Preparing to Sell and Preparing to Hand Over Are Rival Investments: A Persistence Column for
    the Six-Tier Ontology'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.21868658
  date: '2026-08-10'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - succession
  - business transfer
  - owner-managed firms
  - knowledge codification
  - tacit knowledge
  - organizational tiers
  - pre-registered design
  - measurement.
  abstract: 'An owner preparing to leave a firm faces two futures usually treated as one: sale, or handover
    to a successor. This paper derives why the preparation each rewards differs. A six-tier ontology of
    organizational transferability already states what arrives in a buyer''s possession, but that column
    is indexed to a counterparty, which a succession lacks. Decomposing it into three mechanisms of persistence
    — legal, artifact, and person — yields a second column indexed instead to two independent facts: whether
    the going concern is conveyed, and whether the incoming principal must acquire what a person carries.
    Crossed, a sale to an acquirer supplying its own principal disturbs legal and prices artifact continuity,
    a succession disturbs only person continuity, and a fourth case inherits both. Among the tiers a succession
    disturbs, one is drawn at operating frequency rather than at discretion, so its loss cannot be deferred.
    In an owner-operated firm the holder of that residual is the only one who could document it and the
    only one who could teach it, making the two preparations rivals for one budget. The paper states the
    crossover this predicts, supplies a pre-registered design with its power, and reports an audit finding
    neither construct measured.'
claims:
- id: P1
  type: proposition
  statement: The six-tier ontology's published transfer column is indexed to a counterparty, so an event
    with no counterparty requires its own column -- the persistence column -- which is derivable from
    the same primitives rather than posited alongside them.
  testable: true
  tested_in_paper: true
  status: not_tested
- id: P0
  type: proposition
  statement: 'The entrepreneurial-exit literature establishes that exit is a set of divergent ROUTES with
    different drivers, and asks which route an owner takes. This paper asks the question that literature
    leaves open: given that the routes diverge, what does preparing for one do to readiness for the other?
    Preparation is where the divergence originates, not an undifferentiated antecedent to it.'
  testable: true
  tested_in_paper: true
  status: not_tested
- id: P2
  type: proposition
  statement: A tier whose persistence mechanism is undisturbed by an event cannot be the binding constraint
    on value retained through that event.
  testable: true
  tested_in_paper: true
  status: not_tested
- id: P3
  type: proposition
  statement: 'RESTRICTED TO TWO CELLS OF P9''s PARTITION, and stated over the cells rather than over the
    event names. Where the going concern is conveyed to a buyer who supplies its own operating principal,
    the event disturbs legal continuity and prices artifact continuity; where the going concern is not
    conveyed and the incoming principal must acquire the person-carried residual, the event disturbs only
    person continuity. Those two events therefore bind on different tiers, and preparation that raises
    value under one does not thereby raise value under the other. The claim does NOT extend to the cell
    in which the going concern is conveyed AND the incoming principal must acquire the residual: there
    both disturbances occur together, and the phrase "removal prices artifact continuity and nothing else"
    is false.'
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P2
- id: P4
  type: proposition
  statement: Tier 5 is the unique tier whose person-carried residual is both destroyed by Tier-1 replacement
    in the owner-operated population and exercised at operating frequency, so that its loss cannot be
    absorbed by deferring anything. The discriminating property is draw frequency, not tacitness.
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P3
- id: P5
  type: proposition
  statement: 'The successor''s acquisition of the Tier-5 residual is rate-limited by exception arrival
    rather than by preparation effort, so the transfer-rate bound differs in kind from a codification-rate
    bound: money buys codification, and it does not buy elapsed operating time. A multi-decade preparation
    window is therefore a structural feature, not a planning failure.'
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P4
- id: P6
  type: proposition
  statement: Under a finite budget of managerial attention and capital, an owner allocates between converting
    person-carried residual into artifact -- which raises value under removal -- and moving person-carried
    residual into a specific successor, which raises value under replacement. The two draw on the same
    scarce input, the incumbent's own time, and the second is additionally rate-limited by exception arrival,
    which the budget cannot relax.
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P4
  - P5
- id: P7
  type: proposition
  statement: 'The trade-off has gone untested because neither of its terms is measured by any existing
    instrument: the management-practice survey family scores response mode rather than documentation coverage,
    and exception rate is collected by no statistical agency. The absence of prior evidence is therefore
    predicted by the account rather than evidence against it.'
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P6
- id: P8
  type: proposition
  statement: 'RESTRICTED, like P3, to the two cells the derivation runs on. Comparing the platform-acquisition
    cell with the succession cell, the account predicts a crossover: documentation coverage predicts realized
    sale price but not handover disruption, and successor exposure predicts handover disruption but not
    sale price. IN THE FOURTH CELL THE SECOND CLAUSE FAILS -- there successor exposure plausibly raises
    the price too, because the buyer is pricing handover risk they are about to bear personally -- so
    an exit arm that mixes the two cells attenuates the contrast (L8), and the confirmatory estimate is
    the platform-acquisition stratum rather than the pooled arm. The null it must beat is not "no association"
    but "one portfolio raises both". ESTIMAND: with the non-matching investment carrying no effect within
    an arm under P3, the four standardised coefficients are (beta, 0) in the exit arm and (0, beta) in
    the succession arm, so the two within-arm differences are +beta and -beta and the difference-in-differences
    delta = 2*beta. Under the single-portfolio account the two coefficients are EQUAL within each arm
    -- whatever their common value, and it may differ between arms -- so each difference vanishes and
    delta = 0. The contrast is therefore blind to how well-prepared a firm is and sensitive only to whether
    preparation is route-specific, which is the claim in dispute. SYMMETRY ASSUMPTIONS, stated rather
    than left implicit: delta = 2*beta requires (i) the same standardised beta in both arms, (ii) the
    non-matching investment''s true coefficient exactly zero within each arm -- already conceded false
    in the fourth cell -- and (iii) equal per-arm n, which no realised frame will deliver, since sales
    and successions do not arrive in equal numbers. The estimand is defined without (i) and (iii); only
    the "2*beta" shorthand and the per-arm reading of the power table depend on them.'
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P3
  - P6
- id: P9
  type: proposition
  statement: Over clean control transfers, the event space is generated by two independent binary facts
    -- whether the GOING CONCERN is conveyed to a counterparty, and whether the incoming operating principal
    must ACQUIRE the person-carried residual -- rather than by an event name. The persistence column is
    therefore indexed to those two facts. The DERIVATION of P1-P8 runs on two of the four cells; the design's
    exit arm, AS SAMPLED, spans two cells rather than one, because the frame excludes buyouts but does
    not exclude the fourth cell. Those are different statements about different objects and the paper
    states both. The fourth cell -- an arm's-length sale to a buyer who supplies no operating principal
    -- inherits both disturbances at once. It is not a corner case in the 10-250-employee owner-operated
    population; whether it is the MODAL exit there is a conjecture this paper does not have the data to
    settle, and it is labelled as one wherever it appears.
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P3
- id: P10
  type: proposition
  statement: 'An earn-out is two instruments bundled: a contingent payment, which moves risk and teaches
    no one anything, and a retention window, which conveys elapsed operating time with the incumbent present.
    In the fourth cell the second half carries a SECOND function alongside the standard one -- it is a
    priced purchase of ACCESS to exposure, not of exposure compressed -- so it is consistent with the
    capacity constraint rather than a counterexample to it. It is not evidence FOR the constraint: enforcement
    of the contingent payment, relationship continuity and hold-up prevention each predict buyer-imposed
    retention as well, so the prevalence of retention does not discriminate between the accounts. What
    would discriminate is a CONTRAST BETWEEN CELLS: holding the verifiability of the contingent metric
    fixed, retention windows should be longer where the buyer supplies no operating principal than where
    the buyer supplies one, because only in the first case must the incoming principal absorb the residual
    personally. Both terms of that contrast are carried by transaction records; the SIZE of the uncodified
    residual is not, and P7 says no instrument measures it, so the residual-size version of the test is
    not available and is withdrawn.'
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P5
  - P9
methodology:
  type: computational
  design: 'Monte Carlo power simulation for the crossover contrast, over per-arm sample size, per-arm
    standardised effect, and the correlation between the two investments. Instrument-level audit of candidate
    sampling frames: for each candidate, read the survey instrument or data dictionary at primary-document
    level and record whether it contains an item measuring documentation coverage and an item measuring
    exception rate. The pre-registered design itself: a two-arm matched-transition study measuring documentation
    coverage and successor exposure at t-1 on one instrument, with realized price as the arm-A outcome
    at t and operating disruption as the arm-B outcome over t+1 to t+3.'
  analysis:
    software: code/power_divergence_signature.py
    method: Python 3.12 + uv-managed dependencies; numpy only
acceptance:
- claim_id: P1
  criterion: Holds if the six-tier ontology's published transfer column is indexed to a counterparty,
    so an event with no counterparty requires its own column -- the persistence column -- which is derivable
    from the same primitives rather than posited alongside them.
  falsification: If the transfer column already answers the no-counterparty question -- i.e. if for every
    tier what a buyer would receive coincides with what survives a replacement -- the second column is
    redundant and contribution 1 collapses into redescription.
- claim_id: P0
  criterion: Holds if the entrepreneurial-exit literature establishes that exit is a set of divergent
    ROUTES with different drivers, and asks which route an owner takes.
  falsification: Existing exit-route work shown to already model preparation as route-specific and rivalrous,
    in which case this paper's question is answered rather than open.
- claim_id: P2
  criterion: Holds if a tier whose persistence mechanism is undisturbed by an event cannot be the binding
    constraint on value retained through that event.
  falsification: An event in which value is demonstrably lost at a tier whose persistence mechanism the
    event leaves intact.
- claim_id: P3
  criterion: Holds if rESTRICTED TO TWO CELLS OF P9's PARTITION, and stated over the cells rather than
    over the event names.
  falsification: A demonstration that replacement disturbs legal or artifact continuity materially, or
    that removal-with-a-platform-acquirer leaves the person-carried residual at risk in a way preparation
    could address. A demonstration that the two disturbances co-occur in the fourth cell does NOT falsify
    P3 as restricted; that co-occurrence is P9's own content.
- claim_id: P4
  criterion: Holds if tier 5 is the unique tier whose person-carried residual is both destroyed by Tier-1
    replacement in the owner-operated population and exercised at operating frequency, so that its loss
    cannot be absorbed by deferring anything.
  falsification: Another tier's person-carried residual shown to be drawn at operating frequency under
    replacement, or Tier 5's shown to be deferrable without production degrading.
- claim_id: P5
  criterion: 'Holds if the successor''s acquisition of the Tier-5 residual is rate-limited by exception
    arrival rather than by preparation effort, so the transfer-rate bound differs in kind from a codification-rate
    bound: money buys codification, and it does not buy elapsed operating time.'
  falsification: Transfer duration shown to respond strongly to investment intensity -- contact hours,
    structured rotation, simulated exception exposure -- which would weaken the claim to "differs in parameter".
- claim_id: P6
  criterion: Holds if under a finite budget of managerial attention and capital, an owner allocates between
    converting person-carried residual into artifact -- which raises value under removal -- and moving
    person-carried residual into a specific successor, which raises value under replacement.
  falsification: Owner-operated firms shown to raise both investments together without trade-off outside
    the C5 conditions, or the documenter and the teacher shown to be separable persons within C1.
- claim_id: P7
  criterion: 'Holds if the trade-off has gone untested because neither of its terms is measured by any
    existing instrument: the management-practice survey family scores response mode rather than documentation
    coverage, and exception rate is collected by no statistical agency.'
  falsification: An existing firm-level instrument containing an item measuring documentation coverage
    or exception rate, which would show the constructs were measurable and the trade-off simply untested.
- claim_id: P8
  criterion: Holds if rESTRICTED, like P3, to the two cells the derivation runs on.
  falsification: Both investments predicting both outcomes with the same sign and comparable magnitude
    within the C5 scope, which is the single-portfolio account.
- claim_id: P9
  criterion: Holds if over clean control transfers, the event space is generated by two independent binary
    facts -- whether the GOING CONCERN is conveyed to a counterparty, and whether the incoming operating
    principal must ACQUIRE the person-carried residual -- rather than by an event name.
  falsification: A demonstration that the two facts are not independent in this population -- that conveyance
    of the going concern and residual acquisition co-occur or exclude each other by construction -- which
    would collapse the two-by-two back to the paper's dichotomy. Alternatively, a demonstration that the
    fourth cell is empty or negligible in the 10-250-employee owner-operated population, which would make
    the refinement correct but idle. A demonstration that clean control transfers are a small share of
    exits would not falsify P9 but would narrow what it covers.
- claim_id: P10
  criterion: 'Holds if an earn-out is two instruments bundled: a contingent payment, which moves risk
    and teaches no one anything, and a retention window, which conveys elapsed operating time with the
    incumbent present.'
  falsification: Retention windows of the same length, holding contingent-metric verifiability fixed,
    in deals where the buyer supplies its own operating principal as in deals where it does not -- which
    would leave the exposure reading with no work to do. Or retention obligations systematically discounted
    by buyers rather than sought.
