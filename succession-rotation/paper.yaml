limitations:
- description: The design is specified and NOT run. Every proposition is derived; none is tested here.
  severity: major
  addressable: true
- description: The exception-arrival bound is the most exposed link in the chain and rests on an unmeasured
    parameter (AA2, NF5).
  severity: major
  addressable: true
- description: Selection into succession versus exit is not bounded outside the sudden-transition stratum,
    and that stratum is thin and cleans selection only WITHIN the succession arm -- a sudden transition
    largely forecloses the exit arm.
  severity: moderate
  addressable: true
- description: SF2 holds in one institutional setting with no replication outside it, and the features
    that make its natural experiment work do not travel.
  severity: moderate
  addressable: true
- description: The evidence base and the proposed setting are different jurisdictions. The three documented
    phenomena come from Italy, Denmark and Japan; the frame most likely to supply dated, identified transitions
    with an unambiguous sold-versus-retained test is a common-law company register elsewhere.
  severity: moderate
  addressable: true
- description: 'The cross-sectional gradients that distinguish the two accounts are separable in principle
    but not cleanly in practice: an insider is typically also more exposed, so counterparty distance and
    exposure move together in most samples.'
  severity: moderate
  addressable: true
- description: A documentary or artifact-count measure of documentation coverage behaves unknown-ly on
    low-activity units, and the error plausibly runs toward "prepared".
  severity: moderate
  addressable: true
