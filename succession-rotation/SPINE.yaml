    statement: >-
      Sudden-transition stratum: transitions triggered by death or sudden incapacity of the operating
      owner, where the owner did not choose the timing, so selection into preparing for succession
      versus exit cannot operate.
    varied_parameter: "exogeneity of transition timing"
