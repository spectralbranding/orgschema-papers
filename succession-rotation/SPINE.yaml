# ---------------------------------------------------------------------------
# Limitations.
# ---------------------------------------------------------------------------
limitations:
  - id: L1
    statement: >-
      The design is specified and NOT run. Every proposition is derived; none is tested here.
    affects: [P1, P2, P3, P4, P5, P6, P8]
    severity: "high"
    mitigation: >-
      The design is pre-registered with its power stated, and the reason it is unrun is itself
      established at instrument level (P7) rather than asserted. The paper must present it as a
      specification; if the design section reads as an aspiration, the paper has drifted into a
      theory-only fallback rather than chosen this shape.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Limitations"]
  - id: L2
    statement: >-
      The exception-arrival bound is the most exposed link in the chain and rests on an unmeasured
      parameter (AA2, NF5).
    affects: [P5, AA2]
    severity: "high"
    mitigation: >-
      State exception-arrival rate as an unmeasured parameter; the design's job is to bound it, not to
      estimate it. Draft P5 as a derived structural claim, never as a calibrated one.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Limitations"]
  - id: L3
    statement: >-
      Selection into succession versus exit is not bounded outside the sudden-transition stratum, and
      that stratum is thin and cleans selection only WITHIN the succession arm -- a sudden transition
      largely forecloses the exit arm.
    affects: [P8]
    severity: "medium"
    mitigation: "RC1 bounds the succession side; the exit side rests on the matched design."
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Limitations"]
  - id: L4
    statement: >-
      SF2 holds in one institutional setting with no replication outside it, and the features that
      make its natural experiment work do not travel.
    affects: [SF2]
    severity: "medium"
    mitigation: "Cite with the transportability limit in the same sentence; never as a general regularity."
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Boundary Objects", "Limitations"]
  - id: L6
    statement: >-
      The evidence base and the proposed setting are different jurisdictions. The three documented
      phenomena come from Italy, Denmark and Japan; the frame most likely to supply dated, identified
      transitions with an unambiguous sold-versus-retained test is a common-law company register
      elsewhere.
    affects: [SF1, SF2, SF3, M3]
    severity: "medium"
    mitigation: >-
      Nothing in the derivation is jurisdiction-specific -- draw frequency and one owner's time do not
      depend on company law -- but the quoted succession-penalty magnitudes are not transportable
      without argument and are used to anchor scale, never to predict a coefficient. A design fielded
      in one country is powered and interpreted on its own.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Limitations"]
  - id: L7
    statement: >-
      The cross-sectional gradients that distinguish the two accounts are separable in principle but
      not cleanly in practice: an insider is typically also more exposed, so counterparty distance and
      exposure move together in most samples.
    affects: [A1]
    severity: "medium"
    mitigation: >-
      Stated as a demand on the design rather than a property of the world; separating the two is a
      requirement the frame must meet, and the original phrasing overclaimed by implying the gradients
      come apart on their own.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["The Rival Account"]
  - id: L5
    statement: >-
      A documentary or artifact-count measure of documentation coverage behaves unknown-ly on
      low-activity units, and the error plausibly runs toward "prepared".
    affects: [M3]
    severity: "medium"
    mitigation: >-
      The C5 composite (the product of coverage and exception rate) is the antidote and is fixed in the
      pre-registration rather than left as an analysis choice; a zero-activity control belongs in any
      documentary measure from the start. Note this corpus's one test of the analogous premise did NOT
      confirm the confound, so it is carried as a design risk and not as an established effect.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["The Pre-Registered Design -- measurement"]
  - id: L8
    statement: >-
      The exit arm as specified is not homogeneous. The frame excludes mixed leveraged handovers but
      does NOT exclude the fourth cell of P9 -- an ordinary arm's-length sale to a buyer who supplies
      no operating principal -- so the exit arm will contain such sales in unknown proportion. There
      successor exposure plausibly raises the price too, because the buyer is pricing handover risk
      they are about to bear personally, and the crossover attenuates toward zero as the fourth-cell
      share of the arm rises.
    affects: [P8, F1]
    severity: "medium"
    mitigation: >-
      The contamination bias is CONSERVATIVE -- it works against this paper's own hypothesis, so a
      positive finding survives it -- but it costs power that the reported power table does not
      account for, since every cell there assumes a homogeneous exit arm. RC4 pre-registers acquirer
      operating posture as a moderator so the share is measured rather than assumed, the
      platform-acquisition stratum carries the CONFIRMATORY estimate and the pooled arm a secondary
      one, and the raw frame must accordingly be inflated by the reciprocal of the platform share.
      The power table is not re-computed here: the attenuation factor is the fourth-cell share, which
      is itself unmeasured.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["The Pre-Registered Design -- identification", "Limitations"]
  - id: L9
    statement: >-
      NOT ALL KNOWN BIAS IN THIS DESIGN IS CONSERVATIVE, and the paper must not imply that it is. The
      two arms carry outcomes of unequal reliability: the exit arm's outcome is a realised transaction
      price, measured with near-zero error, while the succession arm's outcome is operating disruption
      over t+1 to t+3, measured with substantial error. Differential attenuation shrinks the succession
      arm's coefficients relative to the exit arm's, and because delta is the exit-arm contrast minus
      the succession-arm contrast, shrinking the second inflates delta. That bias runs TOWARD this
      paper's hypothesis, in the opposite direction to L8.
    affects: [P8, F1, L8]
    severity: "high"
    mitigation: >-
      Declared rather than corrected: no reliability estimate for either outcome exists in advance,
      so the magnitude cannot be bounded here. Any realised study should estimate outcome reliability
      per arm and report the contrast corrected for attenuation alongside the raw one. A paper that
      stakes its credibility on declaring its biases cannot declare only the flattering one.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Limitations"]
  - id: L10
    statement: >-
      The GROUP-CARRIED residual conceded under AA4 has no consequence anywhere in the design. Nothing
      measures or bounds the share of a firm's operating residual that is held jointly rather than by
      the departing principal, so the share of the firm to which the analysis applies is itself
      unmeasured.
    affects: [AA4, P4, P6, M3]
    severity: "medium"
    mitigation: >-
      Named as an open quantity rather than assumed small. The design cannot bound it without an
      instrument that separates jointly held from individually held residual, which the audit did not
      find either; the honest position is that the concession narrows the claim by an unknown amount.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Limitations"]
  - id: L11
    statement: >-
      The POWER TABLE IS AN UPPER BOUND FOR MORE REASONS THAN THE EXIT ARM'S HETEROGENEITY. The
      simulation also assumes no measurement error in either construct -- in a paper whose P7 says no
      instrument measures either, so attenuation is certain -- no covariates, although pre-trend
      controls and a relational-channel control are both mandatory in the design; balanced arms;
      identical standardised effects in the two arms; and a standard-normal rather than t reference
      for the test statistic, which is anti-conservative at the smallest sample sizes shown.
    affects: [F1, M1]
    severity: "medium"
    mitigation: >-
      Each of these pushes the required sample UP, so the table's entries are floors and the paper
      states them as such. Re-computing under measurement error would require reliability estimates
      that do not exist (P7), which is why the table is left stated for the ideal case and labelled.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Limitations"]

