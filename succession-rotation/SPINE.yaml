spine_version: "0.2"
spine_doc_version: "1.0.0"
paper_key: "succession-rotation"
# TITLE APPROVED by the author 2026-08-10, with "Different" sharpened to "Rival" -- the paper's own
# word for the relation (complements as knowledge, rivals as investments). Deliberately NOT
# "Succession Is Not an Exit": that is the title of the already-published practitioner article in
# this corpus, and reusing it would collide on a public surface.
title: "Preparing to Sell and Preparing to Hand Over Are Rival Investments: A Persistence Column for the Six-Tier Ontology"
provenance: "new"
thesis: |
  An exit and a succession disturb different mechanisms of persistence in the six-tier stack, so they
  bind on different tiers. The ontology's published transfer column answers what would arrive in a
  buyer's possession and is therefore indexed to a counterparty; an event with no counterparty --
  the occupant of Tier 1 is replaced, the entity persists, nothing is conveyed -- requires a second,
  derivable column. Under that column, replacement disturbs only the person-carried residual, and
  among the tiers it disturbs exactly one, Tier 5, is drawn at the firm's operating frequency rather
  than at discretion, so its loss cannot be absorbed by deferring anything. In an owner-managed firm
  the person holding that residual is simultaneously the only one who could document it and the only
  one who could teach it, so the preparation that raises value under removal and the preparation that
  raises value under replacement are rivals for one budget. The paper derives this, states the
  crossover it predicts, supplies a pre-registered design with its power, and reports that the design
  cannot currently be run because neither construct it requires is measured by the instruments the
  field has built -- a bounded, instrument-level negative over five frame families, offered as part
  of the contribution rather than as a limitation.

# ---------------------------------------------------------------------------
# Boundary conditions -- the theory does not apply outside these.
# ---------------------------------------------------------------------------
boundary_conditions:
  - id: C1
    statement: >-
      The firm is owner-OPERATED, not merely owner-owned: the outgoing principal both holds the
      controlling or founder-family principal stake and is the operating decision-maker. Where the
      owner does not operate, the Tier-5 residual sits with managers who are not being replaced and
      the paper's constraint is simply absent. This is the sharpest boundary in the paper and belongs
      in the first paragraph.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
  - id: C2
    statement: >-
      The event is REPLACEMENT, not removal: the occupant of Tier 1 is replaced, the going concern is
      not conveyed to any counterparty, and the registered entity carries on operating the same
      business. A leveraged handover that transfers operating control and ownership together is a
      mixed event and is out of scope -- excluded, not controlled for. Per P9 this is one cell of a
      two-by-two rather than one pole of a dichotomy: C2 selects the cell in which the GOING CONCERN
      is NOT conveyed and the incoming operating principal MUST acquire the person-carried residual.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
  - id: C3
    statement: >-
      Exception resolution is not already fully delegated downward at the time of the transition.
      Where it is, the residual sits at Tier 6 rather than Tier 5 and is not disturbed by this event.
      MEASUREMENT NOTE: unlike the other four frame conditions, this one is NOT verifiable from an
      administrative record -- the locus of exception resolution is exactly the quantity NF2 reports
      no dataset collects. The design must therefore carry it as a record-verifiable PROXY (the
      absence of a separately titled operating manager on the register) and say that it is a proxy,
      or establish it from an informant and forfeit the record-verifiability claim for this condition.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
  - id: C4
    statement: >-
      The firm is large enough that documented process is a meaningful variable and small enough that
      the residual has not already devolved to a management layer the event does not replace. The
      design operationalises this as 10-250 employees; the construct, not the headcount, is the
      boundary.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
  - id: C5
    statement: >-
      NEGATIVE SCOPE -- the two observable conditions under which the trade-off VANISHES rather than
      weakens, both observable BEFORE the transition. (i) The Tier-5 person-carried residual is empty
      or near-empty, because the codified process already covers ordinary operation; both events then
      bind on the same near-empty set. (ii) The budget does not bind -- sufficient managerial slack,
      a deputy who can run operations while the incumbent documents, or a successor whose absorptive
      capacity needs less exposure per unit of capability. The composite that matters for (i) is the
      PRODUCT of documentation coverage and exception rate, not either alone: a heavily documented firm
      in a high-variance environment still has a live residual, and a lightly documented firm in a
      low-variance one may not.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"

# ---------------------------------------------------------------------------
# Assumption atoms -- premises taken without test; each is relaxable.
# ---------------------------------------------------------------------------
assumption_atoms:
  - id: AA1
    statement: >-
      The six-tier ontology's published transfer column is correct AS a transaction column -- i.e.
      it correctly answers what arrives in a buyer's possession.
    type: "inherited_framework_trust"
    relaxable: true
    relaxation_consequence: >-
      The persistence column is derived from the same primitives as the transfer column (the L/A/P
      decomposition). If the transfer column is wrong, D1 does not go through and P1 loses its
      derivation, though the persistence column could still be asserted directly at the cost of
      contribution 1's status as a result.
    affects: [D1, P1]
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
  - id: AA2
    statement: >-
      Exception arrival is exogenous to preparation effort: the rate at which ordinary operation
      throws uncovered cases is set by the business, not by how hard the incumbent tries.
    type: "structural_exogeneity"
    relaxable: true
    relaxation_consequence: >-
      This is the single most exposed link in the chain. If transfer duration responds strongly to
      investment intensity -- more contact hours, structured rotation, simulated exception exposure --
      then the bound is soft and P5's "differs in kind" claim weakens to "differs in parameter". The
      honest fallback is to state exception-arrival rate as an unmeasured parameter rather than to
      calibrate it.
    affects: [P5, D4]
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
  - id: AA4
    statement: >-
      The three persistence mechanisms are exhaustive over the six-tier stack because they classify by
      CARRIER — an institution, an inspectable object, or a person — and the ontology admits no fourth
      carrier.
    type: "classification_completeness"
    relaxable: true
    relaxation_consequence: >-
      The live boundary is a residual distributed across several people and held by none of them
      individually. It is treated here as belonging to the organization tier rather than as a fourth
      carrier. If a substantial share of what a firm needs to keep operating is group-carried in that
      way, P4 applies to a smaller share of the firm than it appears to, and the trade-off is
      correspondingly smaller. Conceded in the body rather than left for a reader to find.
    affects: [P1, P3, P4]
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
  - id: AA3
    statement: >-
      The incumbent's own time is the shared scarce input to both preparation channels, so the two
      investments draw on one budget.
    type: "resource_identity"
    relaxable: true
    relaxation_consequence: >-
      This is what makes the constraint bind, and it is a consequence of C1 rather than a free
      assumption: in an owner-managed firm the person who holds the residual is the person who would
      document it and the person who would teach it. Relaxing it is exactly C5(ii), where the
      trade-off dissolves -- so the assumption and the negative scope condition are the same statement
      read in two directions.
    affects: [P6, D5]
    provenance:
      created_by: "author"
      created_at: "2026-08-10"

# ---------------------------------------------------------------------------
# Methods.
# ---------------------------------------------------------------------------
methods:
  - id: M1
    statement: >-
      Monte Carlo power simulation for the crossover contrast, over per-arm sample size, per-arm
      standardised effect, and the correlation between the two investments.
    type: "simulation"
    inputs: []
    outputs: [F1, F2]
    code_anchor: "code/power_divergence_signature.py"
    reproducibility:
      seed: "20260810"
      version: "20,000 replications per cell; deterministic given the seed"
      runtime_environment: "Python 3.12 + uv-managed dependencies; numpy only"
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["The Testable Signature -- Power"]
  - id: M2
    statement: >-
      Instrument-level audit of candidate sampling frames: for each candidate, read the survey
      instrument or data dictionary at primary-document level and record whether it contains an item
      measuring documentation coverage and an item measuring exception rate.
    type: "archival_search"
    inputs: []
    outputs: [NF1, NF2, NF3]
    reproducibility:
      seed: "not applicable"
      version: "candidate list and per-candidate verdicts recorded with a fetch ledger"
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Why the Design Cannot Yet Be Run"]
  - id: M3
    statement: >-
      The pre-registered design itself: a two-arm matched-transition study measuring documentation
      coverage and successor exposure at t-1 on one instrument, with realized price as the arm-A
      outcome at t and operating disruption as the arm-B outcome over t+1 to t+3.
    type: "survey_instrument"
    inputs: []
    outputs: []
    reproducibility:
      seed: "not applicable"
      version: "specified, NOT executed -- see L1"
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["The Pre-Registered Design"]

# ---------------------------------------------------------------------------
# Findings -- what is the case, from M1.
# ---------------------------------------------------------------------------
findings:
  - id: F1
    statement: >-
      For the crossover contrast, .80 power is reached at 75 transitions per arm when the two
      investments are uncorrelated and each carries a standardised effect of .35; at 100 per arm when
      they correlate at +.30, and at 50 per arm when they correlate at -.30.
    source_measurements: []
    generating_method: M1
    statistical_strength: "20,000 replications per cell; two-sided alpha .05"
    conditions: "C1, C2, C4"
    antecedents: [M1]
    falsifier: >-
      A simulation under the same estimand and error structure returning materially different
      thresholds at the same seed and replication count.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["The Testable Signature -- Power"]
  - id: F2
    statement: >-
      At zero correlation between the two investments the crossover test has ESSENTIALLY the power of
      a single standardised slope at the same per-arm n. The quoted pairs are the beta = .25 column
      (.352 against .349 at n = 40; .719 against .720 at n = 100), and the equality is asymptotic
      rather than exact: at beta = .45 and n = 40 the same comparison is .854 against .865. The
      mechanism is that the contrast is twice the effect and carries four coefficient variances, and
      the two cancel. The factor of two therefore falls on the TOTAL sample, not on the contrast.
    source_measurements: []
    generating_method: M1
    statistical_strength: "identity, confirmed numerically at three sample sizes"
    conditions: "correlation between investments = 0"
    antecedents: [M1]
    falsifier: >-
      Any cell at rho = 0 in which crossover power and single-slope power at the same per-arm n differ
      by more than simulation error.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["The Testable Signature -- Power"]

# ---------------------------------------------------------------------------
# Negative findings -- discoveries of absence. These carry the route-1 contribution.
# ---------------------------------------------------------------------------
negative_findings:
  - id: NF1
    statement: >-
      No firm-level dataset in the audited set measures process documentation coverage. The large
      management-practice instruments -- the World Management Survey interview grid and the
      Management and Organizational Practices Survey re-fielded from it through national statistical
      programmes, NAMED so the audit's key claim is checkable -- all descend from a single
      questionnaire grid and each contains
      exactly one item touching operational problems, which in every case scores the RESPONSE MODE to
      a problem rather than the share of ordinary operation that is written down. BOUNDED CLAIM: the
      audit covered five frame families at instrument level, with unobtained sources recorded as
      unobtained rather than assumed empty. This is a strong negative over a bounded search, not a
      proof of non-existence, and the body says so before stating the result.
    expected_observation: >-
      A firm-level instrument with an item asking what proportion of ordinary operating procedure is
      documented.
    source_method: M2
    affects_nodes: [M3, P6]
    motivates: [P7]
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Why the Design Cannot Yet Be Run"]
  - id: NF2
    statement: >-
      Exception rate is measured by no firm-level dataset examined, administrative or survey. It is a
      shop-floor quantity that no statistical agency in the audited set collects. The absence is
      uniform across all five families, which supports reading it as a property of what statistical
      agencies measure rather than as an accident of which ones were reached -- but that reading is an
      inference and is marked as one.
    expected_observation: >-
      A firm-level variable recording the frequency with which operation throws a case the documented
      process does not cover.
    source_method: M2
    affects_nodes: [M3, C5]
    motivates: [P7]
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Why the Design Cannot Yet Be Run"]
  - id: NF3
    statement: >-
      No available pairing of sources measures both arms on one instrument. The best exit-side and
      succession-side sources differ simultaneously in informant, unit of observation, country,
      selection rule and outcome type, so a divergence estimated across them would be confounded with
      the instrument rather than identified by the design.
    expected_observation: >-
      One instrument, administered before the owner knows which path they will take, scoring both
      investments on firms subsequently observed to sell or to hand over.
    source_method: M2
    affects_nodes: [M3]
    motivates: [P7]
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Why the Design Cannot Yet Be Run"]
  - id: NF4
    statement: >-
      No empirical estimate exists of the opportunity cost of an incumbent's preparation time: no
      study measures how contact hours with a successor reduce current firm performance. This is the
      other half of the budget constraint and must be modelled theoretically and declared unmeasured.
    expected_observation: >-
      An estimate of the performance cost of incumbent time diverted to successor preparation.
    source_method: "Phase-2 targeted literature search"
    affects_nodes: [P6, AA3]
    motivates: []
    provenance:
      created_by: "author"
      created_at: "2026-08-09"
    body_sections: ["The Budget Constraint -- unmeasured parameters"]
  - id: NF5
    statement: >-
      No defensible estimate exists of transfer duration as a function of investment intensity. The
      elasticity of transfer duration to incumbent effort is unmeasured, so there is no equation to
      calibrate and the paper must not imply one.
    expected_observation: >-
      An estimated duration-effort relationship for knowledge transfer to a named successor.
    source_method: "Phase-2 targeted literature search"
    affects_nodes: [P5, AA2]
    motivates: []
    provenance:
      created_by: "author"
      created_at: "2026-08-09"
    body_sections: ["The Budget Constraint -- unmeasured parameters"]
  - id: NF6
    statement: >-
      The roughly 80/20 codification-versus-personalization split is a PRESCRIPTION in a practitioner
      essay, not an observed equilibrium, and subsequent empirical work measuring the two directly in
      product-development units reports that firms do not hold the ratio. It therefore cannot serve as
      a phenomenon the theory explains. NARROWED: the stronger companion claim -- that DEPARTING from
      the ratio does not degrade performance -- is a different statement from a null on a moderator,
      is not checked against the primary text at composition level, and is no longer relied on. The
      "firms do not hold the ratio" clause alone carries the demotion from evidence to vocabulary.
    expected_observation: >-
      Evidence that firms converge on the ratio as an equilibrium outcome.
    source_method: "Phase-2 targeted literature search"
    affects_nodes: [P6]
    motivates: []
    provenance:
      created_by: "author"
      created_at: "2026-08-09"
    body_sections: ["Related Work -- what this paper does not claim"]
  - id: NF7
    statement: >-
      No empirical work establishes that transfer stickiness varies with the stage of the RECIPIENT
      RELATIONSHIP. The established result concerns variation across the stages of the transfer
      PROCESS, which is a different variable; earlier framings in this line conflated them.
    expected_observation: >-
      A study measuring stickiness against recipient-relationship stage.
    source_method: "Phase-2 targeted literature search"
    affects_nodes: []
    motivates: []
    provenance:
      created_by: "author"
      created_at: "2026-08-09"
    body_sections: ["Related Work -- what this paper does not claim"]

# ---------------------------------------------------------------------------
# Stylized facts -- documented phenomena the constraint predicts.
# ---------------------------------------------------------------------------
stylized_facts:
  - id: SF1
    statement: >-
      The succession penalty is not uniform: it is borne by previously good performers in highly
      competitive sectors.
    aggregates_findings: []
    aggregation_logic: >-
      External result, single country (Italian SMEs). Carried as a boundary object because the two
      accounts predict it differently, not as evidence generated here. NARROWED: the source's design
      features -- mean-reversion controls and family-size instruments -- are recorded in the substrate
      from a secondary synthesis and are NOT checked against the primary text, so prose describes the
      finding and not the specification until they are.
    uniquely_explained_by: >-
      A competitive sector generates exceptions at a higher rate, so the person-carried Tier-5
      residual is drawn on more often and its loss bites harder and sooner; a previously good
      performer is precisely the firm whose performance depended on that residual being present. The
      information-asymmetry account has no reason to predict a gradient in competitive intensity,
      because counterparty verifiability is not a function of it.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Boundary Objects"]
  - id: SF2
    statement: >-
      Under adult adoption, non-consanguineous successors outperform blood heirs.
    aggregates_findings: []
    aggregation_logic: >-
      Single institutional setting. The features that make the natural experiment work -- son-in-law
      adoption, the family registry, the social legitimacy of adopting an adult heir, permissive
      adult-adoption law -- are absent elsewhere, and no replication outside that setting exists.
    uniquely_explained_by: >-
      Selection on the successor's capacity to absorb the residual, rather than on family membership.
      MUST be cited as evidence from one institutional setting and never as a general regularity; the
      transportability limit belongs in the same sentence as the finding.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Boundary Objects"]
  - id: SF3
    statement: >-
      Family successions cause a decline in operating profitability on assets of at least four
      percentage points around the transition, identified by the gender of the departing principal's
      firstborn child.
    aggregates_findings: []
    aggregation_logic: >-
      External causal estimate on Danish limited-liability firms. Carried as the magnitude anchor --
      what a succession costs when it goes badly -- and as the identification precedent for the
      design, not as a test of this paper's mechanism.
    uniquely_explained_by: >-
      Not uniquely explained by this account; the rival predicts a decline too. It anchors magnitude,
      and the paper must say so rather than recruit it as support.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Boundary Objects"]

# ---------------------------------------------------------------------------
# Derivations -- the reasoning bridges.
# ---------------------------------------------------------------------------
derivations:
  - id: D1
    statement: >-
      Decomposing the published transfer column into the three persistence mechanisms (L, A, P) shows
      that the column is exactly the statement that L and A transfer to a buyer and P does not --
      from which a second column, indexed to an event rather than to a counterparty, follows from the
      same primitives.
    from: []
    to: P1
    reasoning_type: "deductive"
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["The Persistence Column"]
  - id: D2
    statement: >-
      Applying P2 tier by tier to Tier-1 replacement with the entity persisting leaves only the
      person-carried residual disturbed; applying it to removal with the entity conveyed leaves L
      disturbed and A priced. The two events therefore bind on different tiers, and the divergence
      result falls out as a corollary rather than standing as a second claim.
    from: [P2]
    to: P3
    reasoning_type: "deductive"
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Which Tier Binds"]
  - id: D3
    statement: >-
      Among the person-carried residuals, draw frequency -- not tacitness -- discriminates. Tier 4's
      tacit residual is drawn at discretion and constrains evolving the product rather than continuing
      to ship it; Tier 2's relational residual arrives on a contract calendar and is re-formable by
      introduction; Tier 6's is not replaced by this event at all; Tier 5's is drawn continuously,
      because production happens every day and every uncovered case must be resolved now or output
      degrades now.
    from: [P3]
    to: P4
    reasoning_type: "deductive"
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Why Tier 5 Binds"]
  - id: D4
    statement: >-
      Capacity to resolve novel exceptions is built by exposure to exceptions, and exceptions arrive
      at a rate the business generates. The successor's acquisition of the residual is therefore
      rate-limited by exception arrival, a property of the business rather than of the preparation
      effort -- so money buys codification but does not buy elapsed operating time, and the bound
      differs in KIND from a codification-rate bound rather than only in parameter.
    from: [P4]
    to: P5
    reasoning_type: "deductive"
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Why Tier 5 Binds"]
  - id: D5
    statement: >-
      Under C1 the person holding the residual is the only one who could document it and the only one
      who could teach it, so the two preparation channels draw on one individual's time. Codification
      and tacit transfer are complements AS KNOWLEDGE and rivals AS INVESTMENTS, and the rivalry is
      structural rather than stipulated.
    from: [P4]
    to: P6
    reasoning_type: "deductive"
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["The Budget Constraint"]
  - id: D6
    statement: >-
      A theory whose two terms are absent from every instrument the field has built is a theory the
      field could not have tested. The measurement negative therefore explains the absence of prior
      empirical work on the trade-off, and converts "this has not been shown" from an objection into a
      prediction the audit confirms.
    from: [P6]
    to: P7
    reasoning_type: "abductive"
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Why the Design Cannot Yet Be Run"]
  - id: D7
    statement: >-
      The two events the paper works with are not primitive. Each is a bundle of two independent
      binary facts -- is the GOING CONCERN conveyed to a counterparty, and must the incoming operating
      principal acquire the person-carried residual -- and the two facts generate a two-by-two rather
      than a dichotomy. Removal as used here is (conveyed, residual not acquired); replacement is
      (not conveyed, residual acquired); the fourth cell, (conveyed, acquired), is an ordinary
      arm's-length sale to a buyer who brings no operating principal, and inherits BOTH disturbances
      at once: legal continuity is disturbed and priced as under removal, and the person-carried
      residual is at risk as under replacement.
      FACT 1 IS ECONOMIC, NOT REGISTRAR-LEVEL, and the distinction decides the population's modal
      case. In owner-operated firms the third-party sale is frequently an ASSET purchase: the buyer
      takes assets, contracts and goodwill into a new vehicle and the seller's registered entity
      persists as a shell. A fact stated as "is the entity conveyed" sorts that transaction with the
      successions, which is backwards -- nothing about the seller's surviving shell keeps the
      business's legal standing intact. Conveyance of the GOING CONCERN is satisfied by a share sale
      and by an asset sale alike, and is what actually fires the legal disturbance: assignment,
      consents, change-of-control, re-registration, licences that do not travel.
      FACT 2 IS NOT THE BARE REPLACEMENT FACT, and the table says so rather than hiding it. What
      person continuity turns on is whether the incoming principal must ACQUIRE the residual, which
      is a judgment about the replacement's relation to the residual and not a registrar fact. A
      platform acquirer that installs its own principal has replaced the principal while writing the
      residual off; a management buy-in successor who already holds the residual has replaced the
      principal without acquiring anything. The bare replacement fact is a separate, record-verifiable
      third fact, and the design carries it as such.
      THE TABLE IS NOT THE WHOLE EVENT SPACE. It crosses two facts over CLEAN CONTROL TRANSFERS.
      Liquidation and dissolution, partial or staged conveyance (minority sale, gradual equity
      release), and management buyouts are not binary on both facts and lie outside it; the frame
      excludes buyouts explicitly, and dissolution is retained as an OUTCOME within an arm rather than
      as a cell.
    from: [P3]
    to: P9
    reasoning_type: "deductive"
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Which Tier Binds"]
  - id: D8
    statement: >-
      In the (conveyed, replaced) cell the buyer must absorb the person-carried residual personally,
      and P5 says that absorption is rate-limited by exception arrival. An instrument that holds the
      incumbent in place for a fixed period therefore supplies the one input no payment structure
      otherwise supplies: elapsed operating time with the incumbent present. The retention window an
      earn-out enforces is thus separable from the contingent payment it is bundled with, and the two
      halves do different work. GROUNDED in the time-compression vocabulary already carrying P5, not
      in a fresh mechanism: an asset accumulable only by elapsed exposure cannot be bought as a STOCK,
      so a buyer who needs it has one remaining instrument -- purchase access to the FLOW that
      produces it. A retention clause conveys a fixed quantity of operating time with the incumbent
      present, which is that flow. Without this step P10 reads as an ad hoc rescue of a
      counterexample.
      RECONCILIATION WITH P5, required because the two read as contradictory on their face. P5 says
      exposure cannot be purchased; P10 says a retention window is a priced purchase of it. Both hold
      once the object of purchase is distinguished from its rate: money cannot COMPRESS elapsed
      exposure time, because the exception-arrival rate is set by the business, but money can buy
      ACCESS to the flow that produces it. A buyer can pay for the incumbent to be present for N
      months; no buyer can pay to make N smaller. P5 denies the second, P10 asserts the first, and
      the pair is consistent.
      P10 IS ADDITIVE TO THE STANDARD READING, NOT A REPLACEMENT FOR IT. The established finance
      treatment reads the earn-out as a response to valuation disagreement under information
      asymmetry, and reads retention within the same instrument. That reading is the rival account's
      home ground and reaches the observation first; P10 adds a second function to the retention half
      rather than displacing the first.
      THE OBSERVATION IS NOT DIAGNOSTIC ON ITS OWN. At least three further accounts predict
      buyer-imposed retention: enforcement of the contingent payment itself (a seller who walks cannot
      be held to an earn-out target, which interlocks the two halves), relationship and customer
      continuity (conceded to the rival at A2), and hold-up prevention over relationship-specific
      investment. Inferring the constraint from the prevalence of retention affirms the consequent,
      and the derivation must say so.
    from: [P5, P9]
    to: P10
    reasoning_type: "deductive"
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["The Rival Account"]

# ---------------------------------------------------------------------------
# Propositions -- the theoretical claims. Two contributions, not three.
# ---------------------------------------------------------------------------
propositions:
  - id: P1
    statement: >-
      The six-tier ontology's published transfer column is indexed to a counterparty, so an event with
      no counterparty requires its own column -- the persistence column -- which is derivable from the
      same primitives rather than posited alongside them.
    type: ontological
    conditions: "C2"
    antecedents: [D1]
    assumptions: [AA1]
    falsifier: >-
      If the transfer column already answers the no-counterparty question -- i.e. if for every tier
      what a buyer would receive coincides with what survives a replacement -- the second column is
      redundant and contribution 1 collapses into redescription.
    evidence:
      - type: analytic
        anchor: "The L/A/P decomposition reproduces the published column exactly, then supports a second reading of it."
    body_sections: ["The Persistence Column"]
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
  - id: P0
    statement: >-
      The entrepreneurial-exit literature establishes that exit is a set of divergent ROUTES with
      different drivers, and asks which route an owner takes. This paper asks the question that
      literature leaves open: given that the routes diverge, what does preparing for one do to
      readiness for the other? Preparation is where the divergence originates, not an undifferentiated
      antecedent to it.
    type: ontological
    conditions: "C1, C2"
    antecedents: []
    assumptions: []
    falsifier: >-
      Existing exit-route work shown to already model preparation as route-specific and rivalrous, in
      which case this paper's question is answered rather than open.
    evidence:
      - type: citation
        anchor: "Exit as a constitutive part of the entrepreneurial process, and exit as divergent routes with different drivers."
        citation_keys: [detienne-2010-entrepreneurial-exit-critical, wennberg-2010-reconceptualizing-entrepreneurial-exit]
        citation_role: theoretical_predecessor
    body_sections: ["Introduction"]
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
  - id: P2
    statement: >-
      A tier whose persistence mechanism is undisturbed by an event cannot be the binding constraint
      on value retained through that event.
    type: ontological
    conditions: ""
    antecedents: []
    assumptions: []
    falsifier: >-
      An event in which value is demonstrably lost at a tier whose persistence mechanism the event
      leaves intact.
    evidence:
      - type: analytic
        anchor: "Near-definitional: a constraint binds only where the event removes something. It does the work of narrowing the field to the person-carried residuals."
    body_sections: ["Which Tier Binds"]
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
  - id: P3
    statement: >-
      RESTRICTED TO TWO CELLS OF P9's PARTITION, and stated over the cells rather than over the event
      names. Where the going concern is conveyed to a buyer who supplies its own operating principal,
      the event disturbs legal continuity and prices artifact continuity; where the going concern is
      not conveyed and the incoming principal must acquire the person-carried residual, the event
      disturbs only person continuity. Those two events therefore bind on different tiers, and
      preparation that raises value under one does not thereby raise value under the other. The claim
      does NOT extend to the cell in which the going concern is conveyed AND the incoming principal
      must acquire the residual: there both disturbances occur together, and the phrase "removal
      prices artifact continuity and nothing else" is false.
    type: ontological
    conditions: "C1, C2"
    antecedents: [P2, D2]
    assumptions: [AA1]
    falsifier: >-
      A demonstration that replacement disturbs legal or artifact continuity materially, or that
      removal-with-a-platform-acquirer leaves the person-carried residual at risk in a way preparation
      could address. A demonstration that the two disturbances co-occur in the fourth cell does NOT
      falsify P3 as restricted; that co-occurrence is P9's own content.
    evidence:
      - type: analytic
        anchor: "Corollary of P2 applied twice, once per event."
    ruled_out_rivals: []
    body_sections: ["Which Tier Binds"]
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
  - id: P4
    statement: >-
      Tier 5 is the unique tier whose person-carried residual is both destroyed by Tier-1 replacement
      in the owner-operated population and exercised at operating frequency, so that its loss cannot be
      absorbed by deferring anything. The discriminating property is draw frequency, not tacitness.
    type: ontological
    conditions: "C1, C2, C3"
    antecedents: [P3, D3]
    assumptions: []
    falsifier: >-
      Another tier's person-carried residual shown to be drawn at operating frequency under
      replacement, or Tier 5's shown to be deferrable without production degrading.
    evidence:
      - type: analytic
        anchor: "Tier-by-tier elimination on draw frequency among the person-carried residuals."
      - type: citation
        anchor: "The succession-specific knowledge-transfer stream, engaged as the nearest prior claimant (A5) rather than as vocabulary: succession read through the transfer of tacit, firm-specific knowledge from predecessor to successor."
        citation_keys: [cabrerasuarez-2001-succession-process-resource]
        citation_role: theoretical_predecessor
    ruled_out_rivals: [A1, A5]
    body_sections: ["Why Tier 5 Binds"]
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
  - id: P5
    statement: >-
      The successor's acquisition of the Tier-5 residual is rate-limited by exception arrival rather
      than by preparation effort, so the transfer-rate bound differs in kind from a codification-rate
      bound: money buys codification, and it does not buy elapsed operating time. A multi-decade
      preparation window is therefore a structural feature, not a planning failure.
    type: ontological
    conditions: "C1, C2, C3"
    antecedents: [P4, D4]
    assumptions: [AA2]
    falsifier: >-
      Transfer duration shown to respond strongly to investment intensity -- contact hours, structured
      rotation, simulated exception exposure -- which would weaken the claim to "differs in parameter".
    evidence:
      - type: analytic
        anchor: "Corollary of P4 via exposure-built capacity. NOT an independent contribution; folded into contribution 2's derivation."
      - type: citation
        anchor: "The mechanism's closest relatives: tacit-to-tacit transfer through shared experience over time, and firm-specific human capital accumulated by learning-by-doing."
        citation_keys: [nonaka-1994-dynamic-theory-organizational, hatch-2004-human-capital-learning]
        citation_role: theoretical_predecessor
    body_sections: ["Why Tier 5 Binds"]
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
  - id: P6
    statement: >-
      Under a finite budget of managerial attention and capital, an owner allocates between converting
      person-carried residual into artifact -- which raises value under removal -- and moving
      person-carried residual into a specific successor, which raises value under replacement. The two
      draw on the same scarce input, the incumbent's own time, and the second is additionally
      rate-limited by exception arrival, which the budget cannot relax.
    type: management_outcome
    conditions: "C1, C2, C3, C5"
    antecedents: [P4, P5, D5]
    assumptions: [AA3]
    falsifier: >-
      Owner-operated firms shown to raise both investments together without trade-off outside the C5
      conditions, or the documenter and the teacher shown to be separable persons within C1.
    evidence:
      - type: analytic
        anchor: "Derived from the owner-managed identity of documenter and teacher, NOT from the codification/personalization literature."
      - type: citation
        anchor: "Vocabulary only -- codification versus personalization as a naming convention. No sample, no measure, no test is inherited with it."
        citation_keys: [hansen-1999-whats-your-strategy]
        citation_role: definitional_source
    ruled_out_rivals: []
    body_sections: ["The Budget Constraint"]
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
  - id: P7
    statement: >-
      The trade-off has gone untested because neither of its terms is measured by any existing
      instrument: the management-practice survey family scores response mode rather than documentation
      coverage, and exception rate is collected by no statistical agency. The absence of prior evidence
      is therefore predicted by the account rather than evidence against it.
    type: ontological
    conditions: ""
    antecedents: [P6, D6, NF1, NF2, NF3]
    assumptions: []
    falsifier: >-
      An existing firm-level instrument containing an item measuring documentation coverage or
      exception rate, which would show the constructs were measurable and the trade-off simply
      untested.
    evidence:
      - type: archival_record
        anchor: "Instrument-level audit of candidate frames with a per-candidate fetch ledger; verdicts recorded per requirement."
      - type: citation
        anchor: "The audited instrument family, named rather than described: the World Management Survey grid and the Management and Organizational Practices Survey re-fielded from it. A reader can check the audit's central negative against these records."
        citation_keys: [bloom-2012-organization-firms-across, bloom-2019-what-drives-differences]
        citation_role: contrast_case
    body_sections: ["Why the Design Cannot Yet Be Run"]
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
  - id: P8
    statement: >-
      RESTRICTED, like P3, to the two cells the derivation runs on. Comparing the
      platform-acquisition cell with the succession cell, the account predicts a crossover:
      documentation coverage predicts realized sale price but not handover disruption, and successor
      exposure predicts handover disruption but not sale price. IN THE FOURTH CELL THE SECOND CLAUSE
      FAILS -- there successor exposure plausibly raises the price too, because the buyer is pricing
      handover risk they are about to bear personally -- so an exit arm that mixes the two cells
      attenuates the contrast (L8), and the confirmatory estimate is the platform-acquisition stratum
      rather than the pooled arm. The
      null it must beat is not "no association" but "one portfolio raises both". ESTIMAND: with the
      non-matching investment carrying no effect within an arm under P3, the four standardised
      coefficients are (beta, 0) in the exit arm and (0, beta) in the succession arm, so the two
      within-arm differences are +beta and -beta and the difference-in-differences delta = 2*beta.
      Under the single-portfolio account the two coefficients are EQUAL within each arm -- whatever
      their common value, and it may differ between arms -- so each difference vanishes and delta = 0.
      The contrast is therefore blind to how well-prepared a firm is and sensitive only to whether
      preparation is route-specific, which is the claim in dispute.
      SYMMETRY ASSUMPTIONS, stated rather than left implicit: delta = 2*beta requires (i) the same
      standardised beta in both arms, (ii) the non-matching investment's true coefficient exactly zero
      within each arm -- already conceded false in the fourth cell -- and (iii) equal per-arm n, which
      no realised frame will deliver, since sales and successions do not arrive in equal numbers. The
      estimand is defined without (i) and (iii); only the "2*beta" shorthand and the per-arm reading
      of the power table depend on them.
    type: ontological
    conditions: "C1, C2, C3, C5"
    antecedents: [P3, P6]
    assumptions: []
    falsifier: >-
      Both investments predicting both outcomes with the same sign and comparable magnitude within the
      C5 scope, which is the single-portfolio account.
    evidence:
      - type: analytic
        anchor: "delta = 2*beta derived from the four standardised within-arm coefficients; delta = 0 under coefficient equality within each arm."
      - type: code_anchor
        anchor: "code/power_divergence_signature.py; seed 20260810"
    ruled_out_rivals: [A3]
    body_sections: ["The Testable Signature"]
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
  - id: P9
    statement: >-
      Over clean control transfers, the event space is generated by two independent binary facts --
      whether the GOING CONCERN is conveyed to a counterparty, and whether the incoming operating
      principal must ACQUIRE the person-carried residual -- rather than by an event name. The
      persistence column is therefore indexed to those two facts. The DERIVATION of P1-P8 runs on two
      of the four cells; the design's exit arm, AS SAMPLED, spans two cells rather than one, because
      the frame excludes buyouts but does not exclude the fourth cell. Those are different statements
      about different objects and the paper states both. The fourth cell -- an arm's-length sale to a
      buyer who supplies no operating principal -- inherits both disturbances at once. It is not a
      corner case in the 10-250-employee owner-operated population; whether it is the MODAL exit there
      is a conjecture this paper does not have the data to settle, and it is labelled as one wherever
      it appears.
    type: ontological
    conditions: ""
    antecedents: [P3, D7]
    assumptions: [AA1]
    falsifier: >-
      A demonstration that the two facts are not independent in this population -- that conveyance of
      the going concern and residual acquisition co-occur or exclude each other by construction --
      which would collapse the two-by-two back to the paper's dichotomy. Alternatively, a
      demonstration that the fourth cell is empty or negligible in the 10-250-employee owner-operated
      population, which would make the refinement correct but idle. A demonstration that clean control
      transfers are a small share of exits would not falsify P9 but would narrow what it covers.
    evidence:
      - type: analytic
        anchor: "Cross-classification of the two facts; the paper's removal and replacement arms are recovered as two of the four cells."
    ruled_out_rivals: []
    body_sections: ["Which Tier Binds"]
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
  - id: P10
    statement: >-
      An earn-out is two instruments bundled: a contingent payment, which moves risk and teaches no
      one anything, and a retention window, which conveys elapsed operating time with the incumbent
      present. In the fourth cell the second half carries a SECOND function alongside the standard
      one -- it is a priced purchase of ACCESS to exposure, not of exposure compressed -- so it is
      consistent with the capacity constraint rather than a counterexample to it. It is not evidence
      FOR the constraint: enforcement of the contingent payment, relationship continuity and hold-up
      prevention each predict buyer-imposed retention as well, so the prevalence of retention does not
      discriminate between the accounts. What would discriminate is a CONTRAST BETWEEN CELLS: holding
      the verifiability of the contingent metric fixed, retention windows should be longer where the
      buyer supplies no operating principal than where the buyer supplies one, because only in the
      first case must the incoming principal absorb the residual personally. Both terms of that
      contrast are carried by transaction records; the SIZE of the uncodified residual is not, and P7
      says no instrument measures it, so the residual-size version of the test is not available and is
      withdrawn.
    type: ontological
    conditions: "C1, C3"
    antecedents: [P5, P9, D8]
    assumptions: [AA2]
    falsifier: >-
      Retention windows of the same length, holding contingent-metric verifiability fixed, in deals
      where the buyer supplies its own operating principal as in deals where it does not -- which
      would leave the exposure reading with no work to do. Or retention obligations systematically
      discounted by buyers rather than sought.
    evidence:
      - type: analytic
        anchor: "Separation of the two components of a single instrument; the retention half supplies access to exactly the input P5 says money cannot compress."
      - type: citation
        anchor: "The established reading of the earn-out, which P10 adds to rather than replaces: a response to valuation disagreement under information asymmetry, with retention carried in the same instrument."
        citation_keys: [kohers-2000-earnouts-mergers-agreeing, ragozzino-2009-contingent-earnouts-acquisitions]
        citation_role: contrast_case
    ruled_out_rivals: []
    body_sections: ["The Rival Account"]
    provenance:
      created_by: "author"
      created_at: "2026-08-10"

# ---------------------------------------------------------------------------
# Alternative explanations.
# ---------------------------------------------------------------------------
alternative_explanations:
  - id: A1
    statement: >-
      Generic information asymmetry, not transfer capacity at a specific layer, is the binding
      constraint: succession is easier than sale because an internal successor and the incumbent know
      more about each other than a stranger and the incumbent do.
    rules_out_required: []
    ruled_out_by: []
    rules_out_status: "open"
    reasoning: >-
      THE STRUCTURAL RIVAL, and it is NOT ruled out empirically here -- the paper distinguishes it
      rather than defeating it, and must say so. Three observable differences are stated instead.
      (a) Zero information asymmetry does not imply zero transfer cost: an internal successor told
      everything tellable still has not ACQUIRED the capacity to resolve exceptions, because capacity
      is built by exposure and not by disclosure; communication closes an information gap, not a
      capacity gap, and the rival has no term for the difference. (b) The two predict different
      remedies: information asymmetry is closable by disclosure, warranty, escrow and contingent
      consideration, none of which teaches anyone anything. Per P10 the earn-out is the instructive
      case rather than a clean example, because it is two instruments bundled and only its contingent
      half belongs on that list; its retention half buys access to exposure and carries a second
      function the list does not cover. NOTE that the rival reaches the earn-out FIRST: the
      established finance reading of the instrument is a response to valuation disagreement under
      information asymmetry, so P10 adds a function rather than recapturing the instrument. A THIRD
      account is also live and was previously unnamed -- hold-up over relationship-specific investment
      predicts retention covenants and staged consideration for reasons independent of both. (c) The
      two have different cross-sectional gradients:
      asymmetry scales with the counterparty's distance from the firm, transfer capacity scales with
      the size of the uncodified residual and is invariant to who the counterparty is. Note the
      rival's own result runs the sharp way: internal handovers carry LOWER asymmetry, so on that
      account succession is the easy case.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["The Rival Account"]
  - id: A2
    statement: >-
      Revenue continuity through founder relationships, not retained productive capability, is what a
      succession puts at risk.
    rules_out_required: []
    ruled_out_by: []
    rules_out_status: "open"
    reasoning: >-
      CONCEDED, NOT CONTESTED. The relational residual is genuinely closer to the rival's territory,
      it is well covered by the information and relational-capital literatures, and the design must
      CONTROL for it rather than claim it. This paper's claim is about retained productive capability;
      saying so in the introduction costs nothing and removes a reviewer's easiest objection.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["The Rival Account -- what this paper concedes"]
  - id: A3
    statement: >-
      One preparation portfolio raises value under both events: well-run firms are simply better
      prepared for everything, and the apparent divergence is an artifact of measuring two outcomes.
    rules_out_required: [F1]
    ruled_out_by: []
    rules_out_status: "candidate"
    reasoning: >-
      This is the null the divergence test is built to beat, and it is the reason the estimand is a
      crossover rather than two main effects. It remains a candidate because the design is unrun.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["The Testable Signature"]
  - id: A4
    statement: >-
      The post-transition decline is mean reversion: firms that performed well before a transition
      would have regressed anyway, and the transition merely marks the point of measurement.
    rules_out_required: []
    ruled_out_by: []
    rules_out_status: "open"
    reasoning: >-
      Live and serious, because SF1's headline conditionality -- the penalty falls on PREVIOUSLY GOOD
      performers -- is exactly the shape mean reversion produces. Handled by design rather than by
      argument: pre-trend controls over t-3 to t-1 are mandatory, not a robustness check, and the
      source result itself carries mean-reversion controls.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["The Pre-Registered Design -- identification"]
  - id: A5
    statement: >-
      The succession-specific knowledge-transfer account: succession is constrained by the transfer of
      tacit, firm-specific knowledge from predecessor to successor, treated in the resource- and
      knowledge-based view of the family firm. On that account what makes a handover hard is the
      TACITNESS of what the incumbent knows.
    rules_out_required: []
    ruled_out_by: []
    rules_out_status: "open"
    reasoning: >-
      NEAREST PRIOR CLAIMANT, and the paper is stronger for engaging it than for engaging the
      information-asymmetry rival alone. It is not ruled out and is not contested; the derivation
      shares its premise that a person-carried residual is what a handover puts at risk. TWO
      DIFFERENTIATORS, both survivable. (i) DRAW FREQUENCY, not tacitness, is what selects the binding
      tier here: tacitness is shared across Tier 2, Tier 4, Tier 5 and Tier 6, so it cannot
      discriminate among them, and P4's elimination runs on how often the residual must be exercised
      for the firm to keep operating. (ii) The knowledge-transfer account has no BUDGET term: it does
      not predict that preparing for a handover and preparing for a sale are rivals, because it is not
      a theory of allocation. P6 is where the two part company.
    provenance:
      created_by: "author"
      created_at: "2026-08-10"
    body_sections: ["Why Tier 5 Binds", "The Rival Account"]

