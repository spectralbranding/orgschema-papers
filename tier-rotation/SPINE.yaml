corpus_precedents:
  - paper_key: 2026ag
    relationship: extends
    spine_nodes: [P1, P4, P6]
    note: >-
      Builds directly on the six-tier ontology of organizational transferability
      (Tier 1 = owner intent … Tier 4 = product specification). Tier-rotation is
      the temporal-dynamics theory of how brand signal migrates Tier-1 → Tier-4
      that the static ontology presupposes.
  - paper_key: 2026ah
    relationship: extends
    spine_nodes: [P1, P2]
    note: >-
      Applies and extends the brand-as-modular-layer result (brand identity binds
      at Tier 4; acquirable value = the Tier-4-projected signal) by adding the
      logistic accumulation dynamic, the separability kink, and the M&A value
      function.
  - paper_key: 2026a
    relationship: applies
    spine_nodes: [P2, P1]
    note: >-
      Uses SBT's eight-dimension specification as the worked dimensional basis
      for the Tier-4 product-specification layer (perception cloud / observer
      spectral profiles); claims are basis-independent for any complete,
      observer-projection-compatible instrument.
  - paper_key: succession-rotation
    relationship: extends
    spine_nodes: [C4, C5]
    note: >-
      Takes up the succession event this paper defers (C4) and derives a persistence column for it.
      Its two-fact partition of the event space supplies the structure of the acquirer-side term this
      paper's value function lacks (C5): whether the entity is conveyed and whether the operating
      principal is replaced by someone who must acquire the person-carried residual are independent
      facts, and the second is the acquirer-side term.
  - paper_key: 2026m
    relationship: applies
    spine_nodes: [P6]
    note: >-
      Invokes the projection-cascade rank-deficiency result (sharp upstream-tier
      specification narrows downstream Π_{4→5}, Π_{5→6} image space) to read the
      Tier-6 absorption / role-count compression as rotation, not reduction.

