- id: P_P1
  type: proposition
  statement: '(Paper P1 — The Convex Kink in M&A Value) V(s) is strictly increasing in s throughout but
    convex-kinked at κ: each increment of Tier-4 share below κ compresses the discount at a lower marginal
    rate than each increment above κ generates premium; the slope is discontinuous at κ. Falsified if
