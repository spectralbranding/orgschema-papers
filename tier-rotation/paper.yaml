propositions:
  - id: "P1"
    name: "Non-Monotonicity of M&A Value"
    statement: >
      V(s) is non-monotonic in s: for s < κ, each increment of Tier-4
      share compresses the acquirer discount at a lower marginal rate than
      the marginal rate at which each increment above κ generates acquirer
      premium. The slope of V(s) is discontinuous at s = κ; deals where
      s < κ at close trade at negative optionality relative to standalone
      operating value; deals where s > κ trade at positive premium.
    falsification: >
      P1 is falsified if V(s) is monotonic in s, or if no slope
      discontinuity is observed at any threshold value of s in a sample of
      M&A deals coded for Tier-4 share.
  - id: "P2"
    name: "Within-Founder Longitudinal Divergence"
    statement: >
      For a founder of fixed quality, M&A multiple at exit varies with s
      at deal time. A founder who exits before crossing κ commands a
      multiple below V_0; the same founder exiting after crossing κ
      commands a multiple above V_0. Within-founder variation in multiple
      is predicted by tier rotation but not by human-capital quality
      accounts, which predict no multiple variation for a fixed-quality
      founder across exit timing.
    falsification: >
      P2 is falsified if within-founder longitudinal variation in M&A
      multiple is statistically independent of rotation-proxy score after
      controlling for human-capital characteristics.
  - id: "P3"
    name: "Sector-Substitutability Moderation"
    statement: >
      The premium V(s)/V_0 for s > κ is higher in credence-goods sectors
      (Darby and Karni 1973) than in search-goods sectors (Nelson 1970).
      In credence-goods sectors, separable Tier-4 brand specification is
      more valuable because rebuilding brand trust from a new
      specification is costly and slow.
    falsification: >
      P3 is falsified if sector classification on the search-experience-
      credence axis fails to moderate the s > κ premium coefficient in
      a regression of deal premium on rotation-proxy score × sector type.
  - id: "P4"
    name: "Post-Deal Goodwill Impairment"
    statement: >
      Post-deal goodwill impairment frequency is highest for deals closed
      at s < κ, specifically in cases where founder-flight risk was priced
      into deal structure but the founder departed earlier than
      contracted. Deals below κ systematically overestimate the
      transferability of brand equity to the acquiring entity.
    falsification: >
      P4 is falsified if rotation-proxy score fails to predict goodwill
      impairment hazard in a Cox proportional hazard model with standard
      M&A controls.
  - id: "P5"
    name: "Knowledge-Externalization Observables"
    statement: >
      As a brand progresses from s = s_0 toward s → 1, four firm-level
      observables shift in coordinated and directionally predictable
      ways: (1) 10-K founder-language salience declines; (2) marketing-
      spend allocation shifts from founder-attribute to product-attribute
      advertising; (3) founder-media share of total brand impressions
      declines; (4) trademark-portfolio composition shifts from founder-
      name marks to product-attribute marks.
    falsification: >
      P5 is falsified if the four observables fail to load on a single
      principal component, or if the principal component fails to track
      M&A-multiple variation in the predicted direction.

