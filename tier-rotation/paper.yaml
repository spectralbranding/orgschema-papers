meta:
  title: 'The Tier-Rotation Curve: A Theory of Brand-Substrate Decoupling and Its M&A-Value Geometry'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.20069605
  date: '2026-05-01'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - brand assets
  - founder exit
  - intangible-asset separability
  - M&A valuation
  - organizational architecture
  - resource separability
  - tier rotation
  abstract: 'When founders exit branded firms, deal outcomes diverge sharply even among principals of
    comparable quality and brand strength. This paper attributes that variation to the proportion of brand
    conviction (the factual beliefs observers hold about the brand''s performance claims, distinct from
    evaluative attitude) that has been externalized from the founder''s personal judgment into organizational
    routines, guidelines, decision rights, and trademarks that an acquirer can own independently. Brand
    signal is modeled as accumulating in an organizational substrate according to a logistic trajectory
    whose rate is governed by sustained knowledge-externalization effort, a cold-start offset, and sector
    substitutability. Acquirer willingness-to-pay is a piecewise function of organizational-brand share
    featuring a separability threshold (the threshold above which brand assets become acquirable independent
    of the originating principal): below the threshold, founder-flight risk produces discounts and earnout
    structures; above it, the brand commands a premium increasing with sector substitutability. The model
    yields three contributions. First, it derives a non-monotonic value geometry with a discontinuous
    slope at the separability threshold — generating within-founder longitudinal predictions unavailable
    to cross-sectional human-capital or succession-discount theories, and constituting a sharp empirical
    wedge against them. Second, it grounds the accumulation process in Nonaka and Takeuchi''s [-@nonaka-1995-knowledgecreating-company-how]
    SECI externalization mechanism and identifies four observable proxies — shifts in 10-K language, advertising
    allocation, media salience, and trademark composition — that allow empirical distinction from quality-based
    accounts. Third, it endogenizes the RBV''s assumption of differential resource mobility for brand
    assets, extending the dynamic capabilities tradition [@teece-1997-dynamic-capabilities-strategic;
    @eisenhardt-2000-dynamic-capabilities-what] by specifying the mechanism, threshold, and sector moderator
    that determine when initially sticky brand resources become separable. The theory is illustrated with
    four boundary objects and yields five falsifiable propositions.'
claims:
- id: P1
  type: proposition
  statement: Brand assets are Tier-4 projections of Tier-1 owner intent. The value a buyer can acquire
    is precisely and only the brand signal projected from Tier-1 into a Tier-4 specification layer (documented
    guidelines, trained team decision rights, algorithmic brand rules, formal trademark portfolios) that
    persists independent of any individual. The core construct is s, the fraction of brand signal residing
    at Tier 4 rather than Tier 1 at deal time.
  testable: false
  tested_in_paper: false
  status: not_tested
- id: P2
  type: proposition
  statement: The perception cloud (the aggregate of observer spectral profiles across cohorts) forms at
    the Tier-4 specification level; when the product layer is insufficiently differentiated from the founder's
    personal projection, the perception cloud is implicitly Tier-1-dependent and re-collapses toward Tier-1
    quality if the founder is removed. Structural (substantive) rotation versus apparent (symbolic) rotation
    is diagnosed by whether the four P-OBS observables shift in COORDINATED versus partial fashion.
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
- id: AA1
  type: proposition
  statement: 'Rotation effort intensity e is not exogenous to the founder: founder identity type (Darwinian
    / Communitarian / Missionary) sets the psychic cost of externalization, so a complete empirical specification
    must condition rotation rate on founder-identity type as a covariate.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
- id: P3
  type: proposition
  statement: The generative mechanism converting Tier-1 brand signal into Tier-4 brand signal is knowledge
    externalization — the Externalization phase of the SECI cycle — by which tacit founder brand decision
    rules become explicit organizational artifacts (brand guidelines, creative briefs, decision frameworks,
    team review protocols, algorithmic substitutes), carried by organizational routines as the firm-level
    vehicle for tacit-knowledge integration.
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
- id: D1
  type: proposition
  statement: 'Tier-4 share accumulates by the smallest-sufficient logistic dynamic ds/dt = α·e·(1 − s)·(s
    + φ)·g(σ): rotation effort converts remaining Tier-1 signal (the 1 − s growth-room term) amplified
    by the current Tier-4 base plus cold-start offset (s + φ) and moderated by a monotone increasing g(σ).
    The form is chosen to capture bounded accumulation, non-linear (S-curve) dynamics, and the no-absorbing-zero
    cold-start property; results hold for any monotone g with g(0) = ε_min > 0 and g(σ) → ∞.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P3
- id: D2
  type: proposition
  statement: Separating variables in D1 yields the closed-form trajectory s(t) (Equation 2), continuous
    and strictly increasing in t for e > 0, approaching 1 − φ/(1+φ) asymptotically (full rotation is an
    asymptotic limit, never a finite endpoint), with inflection at s* = (1 − φ)/2 and a minimum-rotation-time
    T_min (Equation 3) that decreases in e and σ and diverges as the target approaches full rotation.
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - D1
- id: D3
  type: proposition
  statement: 'Acquirer willingness-to-pay is V(s) = V_0·h(s) with h(s) piecewise (Equation 4): below the
    separability kink κ, h = 1 − β·max(0, κ − s)/κ (discount, liquidation floor 1 − β at s = 0); above
    κ, h = 1 + γ·g(σ)·(s − κ)/(1 − κ) (premium, amplified by sector substitutability). h is CONTINUOUS
    in level at κ but has a DISCONTINUOUS first derivative there for any σ > 0 — this slope discontinuity,
    not a level jump, is the geometric content of the non-monotonic value function.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
  - D1
- id: D4
  type: proposition
  statement: 'Comparative statics (Table 2): ∂V/∂s > 0 everywhere but with a discontinuous marginal effect
    at κ; ∂V/∂σ > 0 for s > κ and ≈ 0 for s < κ (substitutability amplifies the premium but does not reduce
    the discount); ∂V/∂e = 0 at deal time (effort matters only through its effect on s before close);
    ∂T_min/∂e < 0 and ∂T_min/∂σ < 0.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - D1
  - D2
  - D3
- id: C_phi
  type: proposition
  statement: 'Boundary limit φ → 0 (Sub-Stage 0): with φ = 0 and s_0 = 0 the accumulation equation has
    ds/dt = 0 regardless of effort — no organizational substrate exists to codify onto — and V collapses
    to the liquidation floor. The cold-start transition to Stage 1 requires first establishing a separate
    legal vehicle (a substrate transition, outside the model''s rotation domain).'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - D1
  - D3
- id: C_sigma
  type: proposition
  statement: 'Boundary limit σ → 0 (commodity sector): g(σ) = ε_min and V(s) ≡ V_0; Tier-4 share is irrelevant
    to acquirer willingness-to-pay and the framework is non-predictive. (Formalizes boundary condition
    C2.)'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - D3
- id: P_P1
  type: proposition
  statement: '(Paper P1 — Non-Monotonicity of M&A Value) V(s) is non-monotonic: each increment of Tier-4
    share below κ compresses the discount at a lower marginal rate than each increment above κ generates
    premium; the slope is discontinuous at κ. Falsified if the rotation-proxy / deal-price-to- standalone
    relationship is monotonic with no structural break (a linear or power-law fit matching a piecewise-kink
    fit).'
  testable: true
  tested_in_paper: false
  status: not_tested
  depends_on:
  - D3
  - D4
- id: P_P2
  type: proposition
  statement: '(Paper P2 — Within-Founder Longitudinal Divergence; THE EMPIRICAL WEDGE) For a fixed-quality
    founder, M&A multiple varies with s at deal time: the same founder exiting below κ commands a multiple
    below V_0 and above κ a multiple above V_0 — variation predicted by tier rotation but NOT by the human-capital
    quality account. Falsified if, after controlling for founder human-capital metrics, the rotation-proxy
