  - P_P1
- id: P_P3
  type: proposition
  statement: (Paper P3 — Sector-Substitutability Moderation) The above-κ premium V(s)/V_0 is higher in
    credence-goods sectors than in search-goods sectors, because rebuilding brand trust from a new specification
    is costlier where quality is not directly verifiable; moderation is concentrated in the s > κ subsample.
    Falsified if the substitutability interaction is non-significant after controlling for sector brand
    intensity, deal size, and year.
  testable: true
  tested_in_paper: false
  status: not_tested
  depends_on:
  - D3
  - D4
- id: P_P4
  type: proposition
  statement: '(Paper P4 — Post-Deal Goodwill Impairment) Goodwill-impairment frequency is highest for
    deals closed below κ where founder-flight risk was priced but the founder departed early: such deals
    overestimate brand-equity transferability, so rotation-proxy score predicts impairment with a negative
    sign. Falsified if impairment rates do not differ between below-κ and above-κ deals after controlling
    for deal size, sector, and year.'
  testable: true
  tested_in_paper: false
  status: not_tested
  depends_on:
  - D3
- id: P_P5
  type: proposition
  statement: (Paper P5 — Knowledge-Externalization Observables) As s rises, four firm-level observables
    shift in a coordinated, directionally predictable way — declining 10-K founder-language salience,
    marketing-spend allocation shifting to product-attribute, declining founder-media share, and trademark-portfolio
    migration to product-attribute marks — loading on a single latent rotation factor that predicts exit
    multiple. Falsified if the four move in uncorrelated/contradictory directions or are uncorrelated
    with exit multiple after controlling for the rotation-proxy score.
  testable: true
  tested_in_paper: false
  status: not_tested
  depends_on:
