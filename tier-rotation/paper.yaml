    … Tier 4 = product specification). Tier-rotation is the temporal-dynamics theory of how brand signal
    migrates Tier-1 → Tier-4 that the static ontology presupposes.
  critical: false
  doi: 10.5281/zenodo.19895813
- relationship: extends
  claim: Applies and extends the brand-as-modular-layer result (brand identity binds at Tier 4; acquirable
    value = the Tier-4-projected signal) by adding the logistic accumulation dynamic, the separability
    kink, and the M&A value function.
  critical: false
  doi: 10.5281/zenodo.19930157
