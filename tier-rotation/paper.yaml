  - P2
- id: P4
  type: proposition
  statement: 'The model endogenizes the resource-based view''s exogenous resource-mobility assumption
    for brand assets specifically: it supplies the mechanism (knowledge externalization), the threshold
    (the separability kink κ), and the time path (the logistic curve) for the transition from sticky to
    separable — addressing the mechanism-specification gap that systematic reviews identify as dynamic-capabilities
    research''s central challenge.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P3
  - D1
  - D3
- id: P5
  type: proposition
  statement: 'The Tier-Rotation Curve supplies the projection geometry that the two-bodied-brand construct
    lacks: it formalizes how the body politic (Tier-4) is constructed from the body natural (Tier-1),
    its transition path, feasibility, duration, and the path of acquirer willingness-to-pay. All four
    two-bodied-brand risk vectors (mortality, hubris, unpredictability, social embeddedness) are suppressed
    as s increases.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
  - D2
- id: P6
  type: proposition
  statement: M&A exit, succession, and tier-allocation are three geometrically distinct decision margins
    over the same six-tier substrate (Table 5). The present model addresses M&A exit (Tier-1 removed);
    succession (Tier-1 replaced, Tier-5 transfer bottleneck) and tier-allocation (spatial portfolio of
    new investment across tiers) are distinct events deferred to future work. The cross-sectional succession-discount
    findings (≈4pp ROA / ≈14% operating- return decline) are benchmarks against which tier rotation offers
    longitudinal refinement, not the signature of M&A substrate failure.
  testable: false
  tested_in_paper: false
  status: not_tested
