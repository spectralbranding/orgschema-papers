  criterion: Holds if (Paper P3 — Sector-Substitutability Moderation) The above-κ premium V(s)/V_0 is
    higher in credence-goods sectors than in search-goods sectors, because rebuilding brand trust from
    a new specification is costlier where quality is not directly verifiable; moderation is concentrated
    in the s > κ subsample.
  falsification: Non-significant substitutability × rotation interaction with controls.
- claim_id: P_P4
  criterion: 'Holds if (Paper P4 — Post-Deal Goodwill Impairment) Goodwill-impairment frequency is highest
    for deals closed below κ where founder-flight risk was priced but the founder departed early: such
    deals overestimate brand-equity transferability, so rotation-proxy score predicts impairment with
    a negative sign.'
  falsification: No below-κ vs above-κ impairment difference with controls.
- claim_id: P_P5
  criterion: Holds if (Paper P5 — Knowledge-Externalization Observables) As s rises, four firm-level observables
    shift in a coordinated, directionally predictable way — declining 10-K founder-language salience,
