meta:
  title: 'The Tier-Rotation Curve: A Theory of Brand-Substrate Decoupling and Its M&A-Value Geometry'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.20069605
  date: '2026-06-27'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - brand assets
  - founder exit
  - intangible-asset separability
  - M&A valuation
  - organizational architecture
  - resource separability
  - tier rotation
  abstract: 'When founders exit branded firms, outcomes diverge even among comparable principals. This
    paper attributes that variation to the share of brand conviction (factual, not evaluative) externalized
    from the founder into organizational routines, guidelines, decision rights, and trademarks an acquirer
    can own independently. Brand signal accumulates in this organizational substrate along a logistic
    trajectory governed by knowledge-externalization effort, a cold-start offset, and sector substitutability.
    Acquirer willingness-to-pay is piecewise in this share around a separability threshold: below it,
    founder-flight risk produces discounts and earnouts; above it, the brand commands a premium increasing
    with sector substitutability. First, the model derives a convex-kinked value geometry with a slope
    discontinuity at the threshold, yielding within-founder longitudinal predictions unavailable to cross-sectional
    human-capital or succession-discount theories — a sharp empirical wedge. Second, it grounds accumulation
    in Nonaka and Takeuchi''s [-@nonaka-1995-knowledgecreating-company-how] SECI externalization mechanism
    and derives four observable proxies — 10-K language, advertising allocation, media salience, and trademark
    composition — distinguishing it from quality-based accounts. Third, it endogenizes the RBV''s differential-mobility
    assumption for brand assets, extending the dynamic capabilities tradition [@teece-1997-dynamic-capabilities-strategic;
    @eisenhardt-2000-dynamic-capabilities-what] by specifying the mechanism, threshold, and sector moderator
    governing when sticky brand resources become separable. Four illustrative cases exercise the theory,
    yielding five falsifiable propositions.'
claims:
- id: P1
  type: proposition
  statement: Brand assets are Tier-4 projections of Tier-1 owner intent. The value a buyer can acquire
    is precisely and only the brand signal projected from Tier-1 into a Tier-4 specification layer (documented
    guidelines, trained team decision rights, algorithmic brand rules, formal trademark portfolios) that
    persists independent of any individual. The core construct is s, the fraction of brand signal residing
    at Tier 4 rather than Tier 1 at deal time.
  testable: false
  tested_in_paper: false
  status: not_tested
- id: P2
  type: proposition
  statement: The perception cloud (the aggregate of observer spectral profiles across cohorts) forms at
    the Tier-4 specification level; when the product layer is insufficiently differentiated from the founder's
    personal projection, the perception cloud is implicitly Tier-1-dependent and re-collapses toward Tier-1
    quality if the founder is removed. Structural (substantive) rotation versus apparent (symbolic) rotation
    is diagnosed by whether the four P-OBS observables shift in COORDINATED versus partial fashion.
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
- id: AA1
  type: proposition
  statement: 'Rotation effort intensity e is not exogenous to the founder: founder identity type (Darwinian
    / Communitarian / Missionary) sets the psychic cost of externalization, so a complete empirical specification
    must condition rotation rate on founder-identity type as a covariate.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
- id: AA2
  type: proposition
  statement: 's is a SCALAR collapse of a construct the specification basis treats as eight-dimensional,
    and treating it as scalar is an assumption rather than a result. A brand''s substrate composition
    is in principle a vector — a Tier-4 share per dimension — so rotation may be dimension-heterogeneous:
    Semiotic and Narrative signal plausibly codify into guidelines and marks more readily than Experiential
    or Cultural signal does, in which case two brands at the same scalar s differ in WHICH dimensions
    have rotated. The model assumes the collapse is admissible — that position on the separability path
    is adequately summarized by one number — and maintains the assumption rather than defending it. It
    interacts with the sector moderator, since the dimensions that resist codification are plausibly the
    ones carrying credence signal.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
- id: P3
  type: proposition
  statement: The generative mechanism converting Tier-1 brand signal into Tier-4 brand signal is knowledge
    externalization — the Externalization phase of the SECI cycle — by which tacit founder brand decision
    rules become explicit organizational artifacts (brand guidelines, creative briefs, decision frameworks,
    team review protocols, algorithmic substitutes), carried by organizational routines as the firm-level
    vehicle for tacit-knowledge integration.
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
- id: D1
  type: proposition
  statement: 'Tier-4 share accumulates by the smallest-sufficient logistic dynamic ds/dt = α·e·(1 − s)·(s
    + φ)·g(σ): rotation effort converts remaining Tier-1 signal (the 1 − s growth-room term) amplified
    by the current Tier-4 base plus cold-start offset (s + φ) and moderated by a monotone increasing g(σ).
    The form is chosen to capture bounded accumulation, non-linear (S-curve) dynamics, and the no-absorbing-zero
    cold-start property; results hold for any monotone g with g(0) = ε_min > 0 and g(σ) → ∞.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P3
- id: D2
  type: proposition
  statement: Separating variables in D1 yields the closed-form trajectory s(t) (Equation 2), continuous
    and strictly increasing in t for e > 0, approaching 1 − φ/(1+φ) asymptotically (full rotation is an
    asymptotic limit, never a finite endpoint), with inflection at s* = (1 − φ)/2 and a minimum-rotation-time
    T_min (Equation 3) that decreases in e and σ and diverges as the target approaches full rotation.
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - D1
- id: D3
  type: proposition
  statement: 'Acquirer willingness-to-pay is V(s) = V_0·h(s) with h(s) piecewise (Equation 4): below the
    separability kink κ, h = 1 − β·max(0, κ − s)/κ (discount, liquidation floor 1 − β at s = 0); above
    κ, h = 1 + γ·g(σ)·(s − κ)/(1 − κ) (premium, amplified by sector substitutability). h is CONTINUOUS
    in level at κ but has a DISCONTINUOUS first derivative there for any σ > 0 — this slope discontinuity,
    not a level jump and not a turning point, is the geometric content of the CONVEX-KINKED value function:
    V rises monotonically throughout and what jumps at κ is the rate.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
  - D1
- id: D4
  type: proposition
  statement: 'Comparative statics (Table 2): ∂V/∂s > 0 everywhere but with a discontinuous marginal effect
    at κ; ∂V/∂σ > 0 for s > κ and ≈ 0 for s < κ (substitutability amplifies the premium but does not reduce
    the discount); ∂V/∂e = 0 at deal time (effort matters only through its effect on s before close);
    ∂T_min/∂e < 0 and ∂T_min/∂σ < 0.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - D1
  - D2
  - D3
- id: C_phi
  type: proposition
  statement: 'Boundary limit φ → 0 (Sub-Stage 0): with φ = 0 and s_0 = 0 the accumulation equation has
    ds/dt = 0 regardless of effort — no organizational substrate exists to codify onto — and V collapses
    to the liquidation floor. The cold-start transition to Stage 1 requires first establishing a separate
    legal vehicle (a substrate transition, outside the model''s rotation domain).'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
