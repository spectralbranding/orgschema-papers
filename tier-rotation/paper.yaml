- id: P_P2
  type: proposition
  statement: '(Paper P2 — Rotation-Stage Divergence Orthogonal to Founder Quality; THE EMPIRICAL WEDGE)
    Holding founder human capital fixed, M&A multiple varies with s at deal time: an exit below κ commands
    a multiple below V_0 and an exit above κ a multiple above V_0. What tier rotation predicts and the
    human-capital quality account does not is ROTATION-STAGE VARIANCE IN THE MULTIPLE THAT IS ORTHOGONAL
    TO HUMAN-CAPITAL OBSERVABLES. The within-founder longitudinal case — one founder, two exits, two rotation
    stages — is the sharpest instance of that prediction because it holds founder quality fixed by construction
    rather than by covariate; it is not the whole of it. The three designs that can supply the evidence
    are NOT equivalent: founder fixed effects identify it under the weakest assumptions, an instrument
    identifies it under an exclusion restriction, and matching on observable human-capital characteristics
    identifies it only under selection on observables — the assumption the tier-rotation critique of cross-sectional
    work says is usually violated here — so a matched result confirms or disconfirms conditionally and
    must be reported as such.'
  testable: true
