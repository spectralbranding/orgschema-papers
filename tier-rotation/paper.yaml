- claim_id: P_P1
  criterion: 'Holds if (Paper P1 — The Convex Kink in M&A Value) V(s) is strictly increasing in s throughout
    but convex-kinked at κ: each increment of Tier-4 share below κ compresses the discount at a lower
    marginal rate than each increment above κ generates premium; the slope is discontinuous at κ.'
  falsification: Single-slope rotation-proxy → deal-price relationship with no kink.
- claim_id: P_P2
  criterion: 'Holds if (Paper P2 — Rotation-Stage Divergence Orthogonal to Founder Quality; THE EMPIRICAL
    WEDGE) Holding founder human capital fixed, M&A multiple varies with s at deal time: an exit below
    κ commands a multiple below V_0 and an exit above κ a multiple above V_0.'
  falsification: Rotation-proxy score insignificant after human-capital controls; a null under the within-founder
    design (the strongest form — a null under matching is weaker, being also consistent with failed matching
    on unobserved quality).
