methodology:
  type: mixed
  design: Sample organizational states as unit-normalized 6-D Gaussian vectors; form observed state x_obs
    = x_true + noise with noise ~ N(0, sigma^2 * I); apply P_audit (rank-1 projection onto the first /
    compliance axis) and P_cascade (full-rank projection across all six dimensions independently); measure
    undetected deviation as ||d - P(d)|| where d = x_obs - x_true; average over N = 1,000 trials per noise
    level.
  analysis:
    software: projection_simulation.py
    method: Python 3.12 + uv + NumPy; uv run --with numpy python3 projection_simulation.py
acceptance:
- claim_id: P1
  criterion: Holds if organizational verification is a projection operator P on the organizational state
    space, idempotent (P^2 = P) and self-adjoint (P* = P); a state s passes verification iff P(s) = s,
    i.
  falsification: If acceptance cannot be stated as a closed linear constraint admitting an idempotent
    self-adjoint operator, the identity fails.
- claim_id: P3
  criterion: Holds if single-loop learning is state correction within a fixed specification eigenspace;
    double-loop learning is a basis change B that redefines the eigenspace (L0 revision).
  falsification: If an organizational change cannot be classified as eigenspace-preserving vs eigenspace-redefining,
    the formalization adds nothing testable.
- claim_id: P4
  criterion: 'Holds if (Proposition 1) Conventional audit, formalized as the projection P_audit onto the
    compliance/non-compliance axis, is a RANK-1 operator: range(P_audit) = span{c}, so rank = 1, and its
    null space contains every performance dimension not expressible as a linear function of the single
    compliance criterion.'
  falsification: An audit that independently detects failures in two non-collinear specification dimensions
    would have rank >= 2 and refute the rank-1 characterization.
- claim_id: P5
  criterion: Holds if (Proposition 2) An OST cascade with k >= 2 levels satisfying the cascade-consistency
    condition (range(P_j) not subset of kernel(P_{j+1}) for all j) defines an invariant subspace T_0 ∩.
  falsification: A cascade in which every P_k has rank 1, or range(P_j) subset of kernel(P_{j+1}) for
    some j, collapses to effective rank 1.
- claim_id: P6
  criterion: Holds if (Proposition 3 — bandwidth bound) The dimension of the invariant subspace an organization
    can maintain at steady state is bounded above by its verification bandwidth budget beta_v, the maximum
    number of independent specification conditions it can evaluate per cycle.
  falsification: A cascade with rank strictly greater than beta_v sustained at steady state over an extended
    period would refute the bandwidth bound.
