results:
- claim_id: P4
  status: supported
  notes: Rank-1 audit leaves approximately 90% of total organizational deviation undetected in a 6-dimensional
    specification space (mean undetected deviation 2.12 at sigma = 1.0), while the full-rank cascade detects
    all deviation (.00 missed) by construction. The ~90% miss rate is a geometric property of the rank-1
    architecture — invariant across noise levels — not an artifact of parameter choice; it confirms the
    analytic (5/6) residual prediction of Proposition 1.
limitations:
- description: The organizational state space is treated as a real inner product space with a well-defined
    inner product; real organizational performance dimensions are neither complete nor canonically commensurable.
    Projections are definable in any normed vector space (Luenberger 1969), but self-adjointness needs
    the inner product.
  severity: moderate
  addressable: true
- description: The paper provides no procedure for estimating the projection matrices P_k empirically;
    a latent-variable / factor-analytic estimation of effective projection rank from audit-score covariance
    is left to future work (Pearce-Hall attentional gating, Thurstone factor tradition).
  severity: moderate
  addressable: true
- description: The Appendix B simulation uses a simplified state space with isotropic noise and orthonormal
    specification dimensions; real spaces have correlated dimensions and non-isotropic noise. Future simulation
    should add realistic inter-level coupling and empirically estimated noise covariance.
  severity: moderate
  addressable: true
