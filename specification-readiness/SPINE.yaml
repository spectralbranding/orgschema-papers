measurements:
  - id: m_numerical_coherence
    statement: >-
      Monte Carlo + regression-identification simulation outputs (summary CSVs,
      twelve diagnostic plots, verbatim date-stamped logs) demonstrate the
      rendering-operator and friction-tax derivations are numerically coherent
      under the fixed seed; results are machine-readable and reproducible from
