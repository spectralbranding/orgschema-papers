    inputs: ["rendering operator R_i(S, w_i)", "friction-tax T(g,c)", "perception-weight vectors w_1..w_6"]
    outputs: ["monte_carlo_summary.csv", "regression_simulation_summary.csv", "twelve diagnostic plots", "date-stamped logs"]
