    source_observations: []
    generating_method: M1
    value: "numerical coherence established (see monte_carlo_summary.csv + regression_simulation_summary.csv)"
    units: "simulation summary statistics + diagnostic plots"

findings:
  - id: F1
    statement: >-
      The rendering-operator and friction-tax derivations are numerically
      coherent: the friction-tax Monte Carlo reproduces the dT/dc < 0 comparative
      static (P2) and the regression-identification simulation confirms the
      identification power for the push-pull asymmetry (P3) under the model's
      structure. The repository does NOT constitute empirical confirmation;
      real-firm confirmation requires the archival panel study of the companion
      empirical paper 2026an.
    type: numerical_coherence_demonstration
    source_measurements: [m_numerical_coherence]
    generating_method: M1
    antecedents: [D1, D2]
    falsifier: "If the published simulation does not reproduce the signed comparative statics under the fixed seed, F1 fails."
    citation_role_in_paper: "numerical_coherence_support_for_P2_P3"
    body_sections: ["Formalization of Push-Pull Asymmetry: Implications for AI ROI (companion computation footnote)"]

# ============================================================================
# Alternative explanations / rivals the theory must clear
# ============================================================================
alternative_explanations:
  - id: A1
    statement: >-
      Rival: inter-interface contradictions are communication or attention
      failures (the stakeholder-salience reading) remediable by functional
      effort.
    rules_out_required: [P1]
    ruled_out_by: [P1]
    rules_out_status: "rejected"
    reasoning: >-
      The model recasts incoherence as a specification-LEVEL contradiction (a
      property of S) propagated across structurally distinct projections;
      communication interventions cannot resolve a specification-level
      contradiction. Zavyalova et al. (2016) show the same firm signal yields
      structurally distinct audience outcomes — inter-interface divergence as a
      spec property, not a communication artifact.
    body_sections: ["Discussion: Implications for Stakeholder Theory"]
  - id: A2
    statement: >-
      Rival: the substrate/rendering separation requires ontological
      separability of artifact and practice, which sociomateriality
      (Orlikowski & Scott 2008; Leonardi 2013) denies.
    rules_out_required: [P0, P6]
    ruled_out_by: [P0]
    rules_out_status: "rejected"
    reasoning: >-
      The substrate/rendering distinction is ANALYTIC, not ontological: at
      execution time substrate, operator, and recipient class are constitutively
      entangled (the theory does not deny this). The claim is only that the
      DESIGN problem of what to codify is logically separable from the PRACTICE
      problem of how rendering occurs — which is what makes codification c a
      tractable variable. The two positions coexist.
    body_sections: ["Theoretical Lacunae: Sociomateriality and the substrate-rendering separation"]
  - id: A3
    statement: >-
      Rival: Open Strategy (Hautz, Seidl & Whittington 2017; Whittington 2019)
      solves the multi-audience problem through inclusion/transparency/process,
      so inclusion intensity, not codification, should dominate AI ROI.
    rules_out_required: [P5]
    ruled_out_by: [P5]
    rules_out_status: "discriminated"
    reasoning: >-
      Complementary, not competitive: Open Strategy specifies the PROCESS by
      which a spec gains legitimacy; this theory specifies the ARTIFACT whose
      codification mediates AI-substitutability. They make discriminating
      predictions — under this theory, inclusion-high/codification-low firms
      realize LOWER AI ROI than inclusion-low/codification-high firms; under Open
      Strategy the reverse. Posed as a falsifiable test (developed in 2026an).
    body_sections: ["Theoretical Lacunae: Open Strategy", "Discussion: Falsifiability and Future Research"]

# ============================================================================
# Negative findings — gaps in the prior art that motivate the contribution
# ============================================================================
negative_findings:
  - id: NF1
    statement: >-
      No prior tradition predicts the SIGN of the relationship between
      specification investment and interface-maintaining functional headcount.
      TCE optimizes governance given friction G_i but generates no prediction
      about the functional-headcount consequences of reducing G_i; the present
      theory predicts a NEGATIVE relationship, observationally distinct from TCE.
    expected_observation: "A prior framework predicting functional-headcount consequences of codification investment."
    source_method: M1
    affects_nodes: [P2, P0b]
    motivates: [P2]
    body_sections: ["Theoretical Lacunae: Transaction-cost economics", "Discussion: Falsifiability and Future Research"]

# ============================================================================
# Limitations — honest scope of the theory paper
# ============================================================================
limitations:
  - id: L1
    statement: >-
      The propositions are THEORETICAL predictions derived from the model's
      structure, not empirical propositions with identification strategies. Their
      falsifiable empirical form (H1-H5 with pre-registered identification) and
      archival-panel testing are developed in the companion empirical paper
      2026an. The companion computation repository establishes numerical
      coherence only, NOT real-firm confirmation.
    severity: "scope-bounding"
    affects: [P1, P2, P3, P4, P5, F1]
    body_sections: ["The Multi-Interface Specification Model: Formal Propositions", "Discussion: Falsifiability and Future Research"]
  - id: L2
    statement: >-
      The class-homogeneity assumption (AA2) is maintained: w_i is the class-
      expectation weight and within-class perception dispersion is bounded by
      recipient-class construction rather than modeled. Relaxing it (mixed and
      stochastic recipient perception vectors, optimal specification-investment
      path under uncertainty) is reserved for future work building on Levinthal
      & Wu (2024).
    severity: "future-work"
    affects: [P1]
    body_sections: ["The Multi-Interface Specification Model: The Interface Layer", "Discussion: Falsifiability and Future Research"]
  - id: L3
    statement: >-
      alpha* (the AI-penetration phase-shift threshold) is treated as a
      domain-specific parameter for future empirical estimation; only an
      order-of-magnitude anchor (Brynjolfsson et al. 2017) is supplied, not a
      calibrated value.
    severity: "scope-bounding"
    affects: [P4]
    body_sections: ["The Multi-Interface Specification Model: Formal Propositions"]

