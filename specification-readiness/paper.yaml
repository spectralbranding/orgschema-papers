meta:
  title: 'Specification Readiness and Endogenous Friction: An Information-Theoretic Model of Multi-Interface
    Organizational Architecture'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.20379981
  date: '2026-06-01'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - organizational coupling
  - multi-interface architecture
  - specification readiness
  - recipient-class perception geometry
  - endogenous friction
  - push-pull asymmetry
  - AI-mediated pull
  abstract: 'Organizations incur substantial friction when guessing recipients'' need profiles and pushing
    outputs toward those guesses. This paper develops an information-theoretic theory treating alignment
    friction as endogenous to specification codification. Architecture decomposes into three layers: a
    codified specification substrate encoding commitments across six ontological tiers, an interface layer
    defined by recipient-class perception-weight vectors, and a function layer whose headcount and spend
    constitute a measurable tax on specification gaps. In push regimes, energy loss scales with cross-entropy
    between guessed and actual need profiles. In pull regimes, consumption-layer AI lets recipients query
    the specification directly, collapsing misalignment toward zero as codification completeness rises.
    Recipient classes are architectural primitives whose distinct perception geometries impose coherence
    conditions across interfaces. Four contributions follow. First, push-pull cost asymmetry is formalized
    as a structural analog to Shannon''s cross-entropy. Second, geometric machinery links specification
    to interface rendering. Third, functional friction is a consequence of specification investment rather
    than governance choice. Fourth, specification readiness is the critical moderator of AI returns, distinguishing
    Substrate-Operator execution (specification-constrained, coherent across interfaces) from Surface-Operator
    execution (locally fluent, globally inconsistent). Specification codification is architecturally prior
    to governance and capability deployment; the theory generates predictions distinct from transaction-cost
    economics, stakeholder theory, and existing AI-augmentation scholarship.'
claims:
- id: P0
  type: proposition
  statement: Architectural decomposition. Organizational output architecture decomposes into three layers
    — a specification substrate (what the firm actually is, across six tiers), an interface layer (N renderings
    of the substrate to distinct recipient classes), and a function layer (capabilities that maintain
    spec-to-interface alignment). The strategic variable is how completely to codify the substrate and
    how to design the emission policy for each recipient class, not governance form.
  testable: false
  tested_in_paper: true
  status: not_tested
- id: P0b
  type: proposition
  statement: Sequential priority. Specification codification is the sequentially prior variable that endogenizes
    the friction level which downstream governance structures (TCE), salience allocations (stakeholder
    theory), and capability deployments (dynamic capabilities) then manage; each prior tradition treats
    friction as an input and none asks how that level is set.
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P0
- id: P1
  type: proposition
  statement: '(Proposition 1 — Interface Coherence) Inter-interface coherence, measured as the minimum
    cosine similarity between normalized renderings across pairs of recipient classes, is non-decreasing
    in specification consistency across tiers: if S is consistent across tiers then min_{i,j} cos(R_i,
    R_j) >= theta for some theta > 0; if inconsistent, coherence is unbounded below. Comparative static:
    d(min cos)/dc >= 0. Interface incoherence is a specification-level contradiction (a property of S),
    not a communication failure.'
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P0
- id: P2
  type: proposition
  statement: '(Proposition 2 — Friction-Tax Scaling) The functional friction tax T scales positively with
    the specification gap g and inversely with codification investment c: T(g, c) = alpha * g(c)/c + beta,
    with g(c) non-increasing in c. Comparative static: dT/dc < 0 at all interior points. Increasing specification
    investment reduces the aggregate friction tax across all N interfaces. Lineage: Radner (1993) information-processing-cost
    framework extended to multi-audience interface rendering.'
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P0
- id: P3
  type: proposition
  statement: '(Proposition 3 — Push-Pull Cost Asymmetry) Under the cross-entropy structural analog, push-regime
    alignment cost C_push = H(p, q) between the recipient''s actual need profile p and the firm''s guessed
    profile q; pull- regime cost C_pull = H(p, S|p) -> 0 as codification completeness -> 1 and recipient
    query capability -> 1. Comparative static: d(C_push - C_pull)/dc > 0 — the cost asymmetry grows strictly
    with codification investment, and at full codification pull dominates push at every interior point.'
  testable: false
  tested_in_paper: true
  status: not_tested
- id: P4
  type: proposition
  statement: '(Proposition 4 — AI Phase-Shift Boundary) The fraction of firms operating in a viable pull
    regime is monotonically increasing in alpha, the consumption-layer AI penetration parameter: at alpha=0
    only pre-AI codified domains (financial accounting, manufacturing parts catalogs) are in pull; at
    alpha >= alpha* (~ .6-.9, domain-dependent) nearly all coupling domains become pull-viable. alpha*
    is a domain-specific parameter for future empirical estimation; Brynjolfsson, Rock & Syverson (2017)
    provide an order-of-magnitude anchor.'
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P3
- id: P5
  type: proposition
  statement: '(Proposition 5 — Specification Readiness Moderates AI ROI) AI return on investment, holding
    AI spend constant, is monotonically increasing in pre-AI specification codification c: d(ROI_AI)/dc|_spend
    > 0, while d(ROI_AI)/d(spend)|_c is bounded above by a function of c. Specification readiness sets
    the AI-substitutable share of operator roles: firms with codified specifications realize higher AI
    returns because more operator roles can be executed as AI Substrate-Operators rather than Surface-
    Operator substitutions. Operationalizes the Brynjolfsson et al. (2017) complementarity by naming the
    required complementary investment.'
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P6
  - P7
- id: P6
  type: proposition
  statement: Substrate-Operator vs Surface-Operator distinction. Organizations render output through operators
    (human OR artificial) that execute R_i. A Substrate-Operator queries the codified specification and
    renders output constrained by it (auditable provenance; coherent across interfaces by construction;
    returns a specification gap rather than confabulating when the spec is incomplete). A Surface-Operator
    renders without specification grounding (locally fluent, globally inconsistent). Only Substrate-Operators
    satisfy the cross-class coherence condition globally.
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P1
- id: P7
  type: proposition
  statement: Operator-level substitution mechanism. AI does not replace humans qua humans but qua operators
    in any rendering task where AI can execute the same operator role at lower cost or higher fidelity;
    the substitution is gated by whether AI can read the specification, render against it, and hold fidelity.
    Substrate-Operator roles substitute from human to AI faster than Surface-Operator roles because the
    specification is machine-readable by construction. A Surface-Operator role defended as requiring tacit
    judgment is a claim that the specification is incomplete — exactly the condition that generates excess
    friction tax.
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P6
