limitations:
- description: This is an observational necessary-condition design; it warrants a necessity-and-safe-harbor
    reading, not an average causal effect. The independent variable is fixed at closing and the dependent
    variable realizes over three-to-five years, so reverse causation is minimal, but no randomization
    identifies a treatment effect.
  severity: moderate
  addressable: true
- description: 'Residual threats scope the estimate: coder-model bias despite rotation and blinding, deal-type
    and outcome measurement error, and survivorship in the post-deal record. The weakened necessity means
    the theory''s strong safe-harbor claim is revised to a bounded one, and the discriminating structural
    tail is partly concentrated in the strata the algebra was developed against, so external validity
    beyond the sampled strata is not established.'
  severity: moderate
  addressable: true
