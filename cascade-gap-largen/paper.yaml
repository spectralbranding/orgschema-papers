meta:
  title: A Large-N Confirmatory Necessary-Condition Test of Closing-Time Structural Gaps in Acquisition
    Integration Failure
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.21755969
  date: '2026-08-02'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - mergers and acquisitions
  - post-merger integration
  - necessary condition analysis
  - case-control design
  - inter-rater reliability
  - structural gap
  - safe harbor
  - large language model coding
  abstract: 'Post-acquisition integration outcomes remain hard to predict at signing: meta-analysis attributes
    their variance to unidentified moderators, yet the field lacks a structural, pre-close, checkable
    predictor. This study tests, confirmatorily and at large N, whether a closing-time *cascade gap* —
    a product–process or process–organization mismatch created when an asset or process crosses the ownership
    boundary without its adjacent producing or governing tier transferring alongside it — is a *necessary*
    condition for a cascade-type integration failure realized over three to five years. On a case-control
    sample of 350 completed transactions drawn on deal structure and coded from disjoint evidence by rotated
    raters, the necessary-condition relationship is supported only in a bounded form: conditional on no
    detected gap, the cascade-type failure rate is low (.073, exact upper 95% bound .112) yet not zero,
    and only about half of failures carried a gap (necessity consistency .517). Structural conformance
    therefore functions as a bounded safe harbor and a pre-close negative screen for one failure mode,
    not as a strong necessary condition or a general predictor of deal success. The separated-measurement
    and structure-based sampling design is a contribution alongside the estimate, and the sampling frame''s
    rate of announced-but-unconsummated bids is a reportable methodological finding.'
claims:
- id: P1
  type: proposition
  statement: 'Pre-registered confirmatory hypothesis: a closing-time cascade gap is a necessary condition
    for a cascade-type integration failure, and cascade-conformance is a structural safe harbor against
    that failure mode. On this sample the hypothesis is partially supported — the necessary- condition
    direction is real (a low conditional failure rate given no gap) but bounded rather than absolute (a
    non-empty safe-harbor cell and roughly even-odds necessity consistency), so the strong safe-harbor
    claim is revised to a bounded one.'
  testable: true
  tested_in_paper: true
  status: not_tested
- id: P2
  type: proposition
  statement: 'Because the safe harbor is bounded rather than absolute, the practical deliverable is a
    probabilistic pre-close negative screen: the absence of a structural gap at closing marks a deal as
    low-risk for this specific failure mode (about a 7% residual rate with a tight upper bound), not risk-free,
    and the screen operates on a fact known at signing — the deal''s structural transfer content — rather
    than on a post-hoc integration judgment.'
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P1
methodology:
  type: empirical
  design: 'Construct-validity separation: the structural gap and the realized outcome were coded in two
    disjoint passes, each from its own sub-dossier only, by rotated raters, so that the model coding the
    gap for a case was not the model coding that case''s outcome, removing same-source and same-rater
    shared-method variance. Case-control sampling on deal structure: the sample was stratified by a closing-time
    structural property (the deal type) and never by the outcome, over-sampling four gap-prone structural
    strata against matched going-concern controls of the same industry, size band, and era, so the at-risk
    structural tail is populated without selecting on the dependent variable. The primary test is Necessary
    Condition Analysis for the dichotomous case: the conditional failure rate in the no-gap cell with
    an exact binomial upper bound (the safe-harbor / empty-cell criterion), necessity consistency, and
    the ceiling effect size, computed only on cases with a determinable outcome.'
  analysis:
    software: full_draw_code.py
    method: Four frontier reasoning models as blinded raters
acceptance:
- claim_id: P1
  criterion: 'Holds if pre-registered confirmatory hypothesis: a closing-time cascade gap is a necessary
    condition for a cascade-type integration failure, and cascade-conformance is a structural safe harbor
    against that failure mode.'
  falsification: A cascade-type failure occurring with no cascade gap present would weaken necessity;
    a materially non-trivial no-gap failure rate weakens the safe harbor. Both are observed at a bounded,
    non-disqualifying level.
- claim_id: P2
  criterion: 'Holds if because the safe harbor is bounded rather than absolute, the practical deliverable
    is a probabilistic pre-close negative screen: the absence of a structural gap at closing marks a deal
    as low-risk for this specific failure mode (about a 7% residual rate with a tight upper bound), not
    risk-free, and the screen operates on a fact known at signing — the deal''s structural transfer content
    — rather than on a post-hoc integration judgment.'
  falsification: If the no-gap residual failure rate were high or its upper bound wide, the absence of
    a gap would carry no decision-relevant information and no screen would be warranted.
