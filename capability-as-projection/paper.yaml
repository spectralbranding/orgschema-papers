  abstract: 'This paper specifies an event-sourced substrate beneath organizational capability rather
    than treating capability as a stored stock of resources or routines. Capabilities are computed from
    the cumulative trace of what a firm has actually done, evaluated at the moment a strategic question
    is asked. The paper specifies three formal objects: a partially ordered log of immutable events, a
    projection operator that reads the log under a query and a render time, and a compatibility function
    that scores log-merge events such as acquisitions. Four propositions follow: clean log merges preserve
    projection continuity; snapshot imports without the underlying log diverge within three years; writedown
    magnitude in failed M&A is jointly determined by raw log incompatibility and acquirer integration-policy
    choice; imitators who observe only the projection cannot replicate capability responses to novel queries.
    The framework is illustrated by three honestly coded process-traced cases — Disney''s 2006 acquisition
    of Pixar, Microsoft''s 2014 acquisition of Nokia''s handset assets, and persistent imitation failure
    of the Toyota Production System — under a single-coder pass of a pre-registered protocol. A worked
    Monte Carlo simulation reproduces the predicted comparative statics. The substrate-projection distinction
    reframes the long-running tautology critique of dynamic capabilities as a category error and generates
    falsifiable predictions about transfer failure.'
claims:
- id: P0
  type: proposition
  statement: 'Three transfer-failure phenomena (Toyota Production System imitation failure, executive-star
    transfer failure, and the Microsoft+Nokia vs Disney+Pixar acquisition contrast) resist clean explanation
    under resource-based or dynamic-capabilities theory: the resources were preserved but the result was
    not; the artifacts were copied but the competence did not transfer. The missing object in all three
    is the same — the operational event log.'
  testable: false
  tested_in_paper: true
  status: not_tested
- id: P_LOG
  type: proposition
  statement: An organization's operational history is a partially ordered set of typed immutable events
    L = (E, <=); each event carries (id, timestamp, actor, type from a fixed five-type taxonomy DECISION/FAILURE/POLICY/PERSONNEL/
    ARTIFACT, payload, caused_by). Events are never edited, only superseded by later events that both
    remain on the log.
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P0
- id: P_PROJ
  type: proposition
  statement: 'Capability is a projection pi : L x Q x t -> C reading a query-relevant subset L_q of the
    log at render time t to produce an observable claim. pi obeys prefix monotonicity (capabilities are
    never erased, only superseded), determinism conditional on the log (same L, q, t -> same claim — the
    strict-replay property), and locality (pi depends only on the q-relevant subset, ruling out spurious
    cross-firm halo effects). The weighted prefix sum with exponential decay pi_lambda is one calibratable
    instance, not the only operator.'
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P_LOG
- id: P_KAPPA
  type: proposition
  statement: For two logs (typically the parties to an acquisition) compatibility kappa(L_A, L_B) = 1
    - |conflicts|/(|L_A|+|L_B|) in [0,1], where conflicts are event pairs that cannot be co-incorporated
    into a merged log without contradicting determinism (incompatible policies, artifacts, or identifiers).
    Conflict-resolution semantics are borrowed from the conflict-free replicated data type literature;
    three canonical M&A merge policies recur (last-write-wins, acquirer-supreme, subsidiary-preserved).
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P_LOG
- id: P_SNAP
  type: proposition
  statement: A snapshot S = pi(L, q, t_0) is a projection frozen and detached from its substrate; it can
    be passed to another party but loses the log behind it, so subsequent projections on the snapshot
    alone can only re-render existing claims and cannot answer new queries that require log access. A
    rendering is a live projection refreshable as L grows; a capability in use is a rendering, a capability
    in a slide deck is a snapshot.
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P_PROJ
- id: P_TAUT
  type: proposition
  statement: 'The persistent tautology critique of dynamic capabilities is a category error arising from
    collapsing substrate and projection: constructs defined only at the projection layer appear tautological
    when the substrate is unobserved, because two projections of the same log correlate regardless of
    mechanism. Once the log is named separately, capability is the projection at t and performance is
    a different projection at a later t, both governed by the common log; predictions about their relationship
    become identification problems rather than definitional ones.'
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P_PROJ
- id: P_MICRO
  type: proposition
  statement: 'The microfoundations critique is answered structurally rather than rhetorically: the log
    is the micro-level (individual decisions, named-actor hires, dated artifacts) and the projection is
    the collective-level competence that emerges when the log is read under a strategic query, so the
    relation between substrate and capability is a function rather than a hand-wave. Knowledge-integration
    and knowledge-transfer theories are projection-layer theories whose presumed substrate the log supplies.'
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P_LOG
  - P_PROJ
- id: P1
  type: proposition
  statement: (Paper Proposition P1 — Log-compatible merge preserves projection.) If kappa(L_A, L_B) >
    theta_high, post-merge projection continuity is at least .90 for t <= 5 years following the merge
