meta:
  title: 'Capability as Projection of an Append-Only Organizational Log: An Event-Sourced Substrate Theory
    of Organizational Capability and Transfer Failure'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.20367459
  date: '2026-06-01'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - capability as projection
  - append-only organizational log
  - event sourcing
  - dynamic capabilities
  - organizational capability
  - substrate theory
  - M&A integration
