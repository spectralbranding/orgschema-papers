- id: P2
  type: proposition
  statement: (Paper Proposition P2 — Snapshot import diverges.) If the acquirer imports a snapshot S_B
    without merging L_B (acquirer-supreme resolution discarding the target log), then for t > t_0 + 3
    years the projection diverges from the log-merged counterfactual on any substrate-dependent query.
