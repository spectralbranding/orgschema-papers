methodology:
  type: mixed
  design: 'The ex-ante pre-registered event-coding protocol: a fixed five-type taxonomy committed before
    coding, >=10-year minimum log depth, an identifier discipline targeting Cohen''s kappa > .80 on event
    identity, a source hierarchy privileging primary records, confidence ratings, a conflict-resolution
    policy taxonomy for kappa, and pre-registered robustness checks (granularity variation, placebo cases,
    blind-coder variation). The reported cases use an honest single-coder pass; the two-blind-coder gold
    standard is reserved for the companion empirical paper. A 20,000-trial Monte Carlo (monte_carlo_simulation.py)
    sweeps a five-cell conflict-density grid (0.0, 0.1, 0.5, 0.7, 0.9) and a four-cell decay grid (lambda
    = 0.0, 0.1, 0.5, 1.0) under two integration policies (acquirer-supreme, negotiated), 500 trials per
    cell, random seed 42; a companion projection demo (projection_demo.py) computes pi_lambda and kappa
    on sample/synthetic logs. The worked projection operator pi_lambda (weighted prefix sum with exponential
    decay, signed per-event weights) applied to the coded Toyota and imitator logs at several decay rates,
    and the kappa compatibility function applied pairwise to each M&A case''s coded logs under the conflict-counting
    policy taxonomy with honest uncertainty bands.'
  analysis:
    software: github.com/spectralbranding/orgschema-papers/.../METHODS_APPENDIX_event_coding_protocol.md
    method: Python 3.12 + uv (public mirror code/)
