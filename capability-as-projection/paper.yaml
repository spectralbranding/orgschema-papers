abstract: >
  Organizational capability is commonly treated as a stock of resources or a
  bundle of routines. This paper argues that this conceptualization obscures
  a more fundamental object: an append-only, partially ordered organizational
  log that serves as the immutable substrate from which capabilities are
  computed. Capability itself is a render-time projection — π(L, q, t) —
  evaluated against a query-relevant subset of that log at the moment a
  strategic question is asked. The paper formalizes the log as a poset of
  typed immutable events, defines a projection operator satisfying prefix
  monotonicity, conditional determinism, and locality, and introduces a
  compatibility function κ measuring conflict density between logs to be
  merged. Three mechanistic predictions follow about post-acquisition
  projection continuity, snapshot-import divergence, and the conjunction of
  conflict density and integration policy in predicting writedown magnitude.
  The framework is anchored in three process-traced cases — Disney's
  preservation of Pixar's creative log, Microsoft's snapshot import of
  Nokia's handset capability, and persistent imitation failure of the
  Toyota Production System — coded under a pre-registered protocol. An
  open-source contemporaneous event-sourced runtime (Nakajima 2026 —
  ActiveGraph) supplies an existence proof that the proposed substrate is
  computationally tractable. The framework relocates the persistent
  tautology critique of dynamic capabilities from the projection to the
  unobserved substrate layer.

claims:
  - id: P1
    type: proposition
    description: >
      Log-Compatible Merge Preserves Projection Continuity: when log
      compatibility κ(L_A, L_B) exceeds a calibrated threshold θ_high,
      post-merge projection continuity is at least 90% for t ≤ 5 years
      following the merge, holding deal size and industry constant.
    status: proposed
    falsification: >
      P1 is falsified if a sample of high-κ merger pairs shows no
      significant difference in post-merge projection continuity outcomes
      versus low-κ pairs after controlling for deal size, industry, and
      pre-close resource similarity.

  - id: P2
    type: proposition
    description: >
      Snapshot Import Divergence: when the acquirer imports a snapshot
      S_B = π(L_B, q, t_0) without merging the underlying log L_B (the
      acquirer-supreme conflict-resolution policy in which κ approaches 0
      by construction because L_B is discarded), then for t > t_0 + 3 years,
      π(L_A ∪ {S_B}, q, t) diverges from π(L_A ⊕ L_B, q, t) for any query q
      that depends on capability-substrate (as opposed to identity-substrate
      such as brand names that can be imported without their log).
    status: proposed
    falsification: >
      P2 is falsified if post-snapshot-import projection divergence is
      statistically independent of operational novelty density across a
      sample of acquisitions in which the acquirer chose acquirer-supreme
      integration, tracked 3-7 years post-close.

  - id: P3
    type: proposition
    description: >
      Joint Dependence of Writedown on (1−κ) and Integration Policy: the
      magnitude of post-acquisition writedown is jointly determined by raw
      log incompatibility (1−κ) AND by the acquirer's chosen
      conflict-resolution policy. Acquirer-supreme policies amplify the
      effect of low compatibility into large writedowns; negotiated or
      target-preserving policies attenuate it. Honest event-coding of
      Microsoft+Nokia demonstrates this — raw κ was moderate (.79-.85),
      but the acquirer-supreme integration choice (70% layoff in 2014)
      drove the $7.6B writedown rather than raw log incompatibility alone.
      P3 (v1.0.0) corrects the simpler "conflict-density predicts
      writedown" framing of earlier drafts.
    status: proposed
    falsification: >
      P3 is falsified if writedown magnitude in failed M&A deals is
      independent of either (1−κ) or integration policy, OR if the
      interaction term between (1−κ) and integration policy is not
      significant in a coded panel of M&A integrations.

  - id: P4
    type: proposition
    description: >
      Imitation Bound (formerly P3 in pre-coding draft): imitators who
      observe only the capability projection π(L, q, t) — without access
      to the originating log L — cannot replicate capability responses to
      novel queries q' outside the imitated projection's training
      distribution. Honest event-coding of Toyota TPS versus stylized
      imitator log demonstrates sign-inverted projections at all λ:
      Toyota positive, imitator negative across the cumulative-learning
      query.
    status: proposed
    falsification: >
      P4 is falsified if imitating firms (demonstrably lacking the
      target's operational log) show equivalent capability responses to
      novel-condition stimuli as the original log-holding firm in a
      matched-pair test across a capability domain.

