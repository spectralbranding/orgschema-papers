results:
- claim_id: P1
  status: supported
  notes: 'Disney+Pixar is consistent in direction with P1 and P3: high kappa plus a target-preserving
    last-write-wins policy preserved the Pixar log as a live rendering; all five HIGH-confidence Pixar
    POLICY events remained in force through 2011 and the decade writedown was zero; Toy Story 3, Inside
    Out, and Coco are projections of the post-merge log under new queries.'
- claim_id: P3
  status: supported
  notes: 'Disney+Pixar is consistent in direction with P1 and P3: high kappa plus a target-preserving
    last-write-wins policy preserved the Pixar log as a live rendering; all five HIGH-confidence Pixar
    POLICY events remained in force through 2011 and the decade writedown was zero; Toy Story 3, Inside
    Out, and Coco are projections of the post-merge log under new queries.'
- claim_id: P2
  status: supported
  notes: 'Honest coding sharpened rather than weakened the contribution: the Microsoft+Nokia failure was
    driven NOT by raw log incompatibility (moderate kappa) but by the acquirer-supreme integration policy
    that discarded L_Nokia, isolating the integration-policy variable from the log-structure variable.
    P2 (15-month divergence) and the revised joint-form P3 are both consistent with the case; the Disney/Microsoft
    contrast is now a contrast in integration policy at comparable log compatibility.'
- claim_id: P4
  status: supported
  notes: 'The TPS sign-inverted pi_lambda is the empirical fingerprint of P4: the imitator does not merely
    have a smaller-magnitude projection but a structurally negative one, because documented failures unattended
    by kaizen response accumulate to negative weight under the canonical query. Imitators copy the snapshot
    S = pi(L_Toyota, "production capability", t) but not the seventy-year log, so the kanban card has
    no information content without the log that generated it; this restates Spear and Bowen''s DNA argument
    in substrate-projection terms.'
limitations:
- description: The three process-traced cases are anchors coded under an honest single-coder pass, not
    a representative test under the gold-standard two-blind-coder-plus-adjudicator protocol; a fifty-event
    coded M&A panel is in preparation as a companion empirical paper.
  severity: moderate
  addressable: true
- description: The pre-registered Monte Carlo check C2 (continuity gap >= .10 at density .9) failed honestly
    at .073 under the pre-registered POLICY-weighting — reported as written, not tuned away; the mechanism
    is present in the right direction and monotonicity but below the synthetic threshold by ~.03, identifying
    a calibration question for the empirical companion rather than a contradiction of the formalism.
  severity: moderate
  addressable: true
- description: The illustrative cases skew Anglo-Japanese and product-firm; generalizability to Chinese
    SOEs, non-Western family SMEs, services firms whose log lives in client-relationship history, and
    pre-2000 sparse-trace firms is not established. The theory is substrate-agnostic but empirical-test
    feasibility is documentation-constrained.
  severity: moderate
  addressable: true
- description: 'Named failure modes (after Nakajima 2026 §9): schema evolution (process-documentation
    drift across decades), concurrent writers (matrix/ distributed organizations with no global clock
    making conflict identification and tie-breaking harder), and replay cost (querying decades of log
    is expensive; the lambda decay parameter is one response but introduces a free parameter that must
    be calibrated).'
  severity: moderate
  addressable: true
