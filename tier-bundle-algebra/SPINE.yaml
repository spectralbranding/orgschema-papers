spine_version: "0.1"
spine_doc_version: "0.4.0"
paper_key: "tier-bundle-algebra"
provenance: generative
title: >-
  Tier-Bundle Algebra in Inter-Organizational Resource Transfer: A
  Fork-Operation Formalism Over the Six-Tier Acquisition-Target Ontology
status: >-
  Draft; publication held pending the user's un-hold decision. Merge and
  venue provenance are recorded in the changelog (internal record only).

thesis: >-
  The six-tier ontology of the acquisition target (Zharnikov 2026ag)
  specifies what an acquisition target IS; it does not specify what
  compositions over the tier stack are admissible when an ownership boundary
  is crossed. This paper supplies that compositional grammar: a typed
  fork-operation algebra in which each named M&A transaction type decomposes
  into a signature bundle of fork operations across the seller's tier graph,
  a cascade rule specifying which fork-forces-fork entailments hold along the
  service hierarchy, and an admissibility predicate — derived from the six-
  tier ontology's own tier-collapse states — that rejects bundles a target's
  actual fusion structure cannot support. Unlike the named-deal-type
  taxonomy's fourteen enumerated categories, the algebra also classifies
  hybrid and unnamed structures the taxonomy has no name for, converting
  deal-type classification and admissibility assessment from enumerated
  judgment into a generative, checkable structure.

# ============================================================================
# Propositions — the argument backbone
#   SF-prefix: motivating stylized fact. P1-P4: definitional propositions
#   (tier graph + 3 critical imported premises; fork operator; tier-bundle +
#   signature + composition table). P5: cascade rule (κ, π). P6: admissibility
#   predicate (α) + multi-tier collapse generalizations. P7: the non-self
#   the old memo's 5 worked examples, all of which recover already-named
#   types). P8: soundness/completeness (proof-sketch, scoped down; full
#   argument to Appendix A). C-prefix: boundary conditions. A-prefix: rival
#   ruled out. L-prefix: limitations.
# ============================================================================
