      acqui-hire, roll-up, spin-out, franchise, redomiciliation, merger of
      equals, reverse merger, joint venture, asset swap, intra-business
      pivot, sole-proprietor wind-down) is enumerated by the transfer
      instrument, inductively from observed deal practice, not derived from
      any generative rule about what a transaction IS. A hybrid or unnamed
      transaction has no principled place in the table, and whether a
      proposed deal shape is structurally sound is assessed by practitioner
      judgment rather than a checkable predicate.
