  - id: P1
    statement: >-
      Definition 1 (tier graph G): a typed directed graph G = (T, E) with
      vertex set T = the six tiers of the acquisition-target ontology and
      edge set E partitioned into a downward constraint hierarchy and an
      upward service hierarchy (the same relationships viewed from opposite
      directions). The algebra rests on three structural assumptions, stated
      explicitly as axioms of this paper and taken as given (not established
      here): (A) the Tier-1 attribution refinement — Tier 1 attaches to the
      controlling-principal substrate, not the asset substrate, and is
      replaced rather than transferred under any ownership-changing
      transaction; (B) Tier-3 jurisdictional mutability — the legal vehicle
      can swap while Tiers 2, 4, 5, 6 continue undisrupted; (C) the
      tier-collapse states (T1≡T4 Domain Craftsman/Family Steward/Mission
      Founder; T1≡T3 sole-proprietor) at which the fused tier inherits
      Tier 1's non-conveyability. The three are developed and empirically
      motivated in the six-tier ontology, cited as their provenance rather
      than as an authority on which the algebra's results depend; a reader
      who grants Assumptions A–C can verify every subsequent proposition
      independently of that work.
    conditions: >-
      Adopts the six-tier ontology's tier index and dual hierarchy as object
      language; the three specializing premises (A, B, C) are stated as
      explicit assumptions of THIS paper (taken as given), not imported on
      external authority.
    antecedents: []
    evidence:
      - type: citation
        anchor: >-
          Provenance of the tier vocabulary and of Assumptions A, B, C: the
          six tiers, governors, specification surfaces, transferability modes,
          and dual hierarchy this definition adopts, and the source where the
          three assumptions are developed and empirically motivated — cited as
          where they originate, not as the ground of their truth in this paper.
        citation_keys: [zharnikov-2026-dual-hierarchies-organizational-transferability-six]
        citation_role: theoretical_predecessor
      - type: citation
        anchor: >-
          Base typed-DAG-transformation formalism this graph specializes
          (organizations as discrete typed specification graphs, not
          continuous spaces).
        citation_keys: [zharnikov-2026-organizational-schema-theory-test-driven]
        citation_role: theoretical_predecessor
    body_sections: ["Preliminaries (Definition 1; Premises A, B, C)"]

  - id: P2
    statement: >-
      Definition 2 (tier-fork operation φ_n): a typed transfer of the
      Tier-n record from a vertex in the seller's tier graph to a vertex in
      the buyer's tier graph under a direction tag drawn from {transfer
      (1-to-1), merge (N-to-1), split (1-to-N), read-only (licence-style
      use-rights without governance transfer), swap (substitution at fixed
      identity — the only well-typed lateral operation, reserved for Tier
      3), split-time (fork across a discrete time boundary within one
      continuing principal, no ownership-boundary crossing)}. φ_n is
      well-typed only when source and target share the tier index; Tier 1
      admits no well-typed fork under any direction other than replace,
      because its transferability mode is imprint-only.
    conditions: "Depends on P1 (the tier graph and its three imported premises)."
    antecedents: [P1]
    evidence:
      - type: citation
        anchor: >-
          Direct mathematical precedent: double-pushout (DPO) graph
          transformation over hierarchical organizational structure requires
          node-type preservation across a rewrite — precisely the
          well-typedness condition imposed here.
        citation_keys: [wang-2009-dynamic-reorganization-mechanisms]
        citation_role: methodological_source
      - type: citation
        anchor: >-
          Closest existing precedent for modeling M&A as formal structural
          integration (Petri nets + predicate calculus over discovered
          business processes) rather than a purely financial event — richer
          post-close descriptively, but supplies no a priori typed structure
          for classifying a transaction before it closes, which this
          definition supplies.
        citation_keys: [chanda-2021-artificial-intelligence-data]
        citation_role: contrast_case
    body_sections: ["Fork Operations and Tier-Bundles (Definition 2)"]

  - id: P3
    statement: >-
      Definition 3 (tier-bundle B and signature σ): a tier-bundle is an
      ordered set of tier-fork operations executed under one transaction
      envelope. Its signature σ(B) is the per-tier projection onto direction
      (or composite Tier-1 token, or ∅) for each of the six tiers; a
      composition table resolves the composite direction when two operations
      in B target the same tier index (handling symmetric/multi-party cases:
      asset swap, symmetric merger, three-way restructuring, franchise-
      system extension). The signature individuates a named deal type: every
      one of fourteen named M&A deal types recovers as a signature instance
      — not an independently enumerated category — modulo cardinality
      refinement.
    conditions: "Depends on P1, P2."
    antecedents: [P1, P2]
    evidence:
      - type: analytic
        anchor: >-
          Table 1 (going-concern transfers) + Table 2 (special/multi-party
          structures) construct, for each of fourteen named deal types, a
          canonical signature directly from that type's own operative
          definition — asset deal = {T4,T5,T6-partial} transfer; carve-out =
          subset of same; acqui-hire = {T6} alone; roll-up = {T4,T5} N-to-1
          merge; spin-out = 1-to-N split; franchise = read-only {T4}; intra-
          business pivot = T4 split-time; redomiciliation = T3 swap alone;
          sole-proprietor wind-down = terminate+reconstruct; merger of
          equals / reverse merger / joint venture / asset swap = the
          composition-table cases.
    body_sections: ["Fork Operations and Tier-Bundles (Definitions 3-4); Bundle-Signature Taxonomy (Tables 1-2)"]

