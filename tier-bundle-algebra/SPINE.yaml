  - id: P5
    statement: >-
      Cascade rule (κ, total function from a fork operation to the set of
      forks it structurally implies under the service hierarchy) and its
      conformance predicate π (whether a bundle contains every fork κ
      implies). κ is upward-implying along the service hierarchy and
      downward-non-implying: forking a served tier (e.g., Product) entails
      forking the tier that serves it (Process), because the served tier
      loses its productive substrate otherwise; the reverse does not hold,
      because substrate is replaceable from below (the franchise case: a
      Tier-4 read-only fork does not cascade to a Tier-5 fork). Cascade gaps
      — forks in κ(B) absent from B — are the operationally consequential
      omissions: a gap at φ_4→φ_5 is a Product-Process disruption surfaced
      compositionally; a gap at φ_5→φ_6 is a Process-Organization fracture.
    conditions: "Single transaction envelope (C1); depends on P1-P3."
    antecedents: [P1, P2, P3]
    falsifier: >-
      A documented roll-up (or other N-to-1 merge) in which a lower-tier
      fork produces no upward propagation despite a fused separability
      profile, holding target separability and integration approach
      comparable to cases that do exhibit it.
    evidence:
      - type: citation
        anchor: >-
          Empirical precedent for integration failure concentrating at the
          process/organization boundary in roll-ups — the case-survey
          finding this cascade rule formalizes as a directional structural
          implication.
        citation_keys: [larsson-1999-integrating-strategic-organizational]
        citation_role: motivating_problem
      - type: citation
        anchor: Foundational modularity-theory anchor the cascade rule extends to the transaction-event case.
        citation_keys: [schilling-2000-toward-general-modular]
        citation_role: theoretical_predecessor
      - type: citation
        anchor: Episodic threshold-based boundary-transition theory, structurally analogous to the cascade's directional threshold trigger.
        citation_keys: [mcclean-2025-dynamic-boundary-permeability]
        citation_role: theoretical_predecessor
      - type: citation
        anchor: Boundary-permeability-as-designed-property precedent, consistent with admissibility being target-specific rather than universal.
        citation_keys: [asencio-2024-boundary-transitions-dynamic]
