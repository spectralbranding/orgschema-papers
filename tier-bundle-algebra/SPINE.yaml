  - id: P6
    statement: >-
      Admissibility predicate α(B, κ): a tier-bundle is inadmissible if it
      forks a tier that is Fused to another tier (per the six-tier
      ontology's own tier-collapse states) without also forking the fused
      partner, because the fused tier inherits Tier 1's non-conveyability by
      identification. The two canonical collapse states (T1≡T4 Domain
      Craftsman/Family Steward/Mission Founder; T1≡T3 sole-proprietor)
      generate two admissibility rules; multi-tier collapse generalizations
      (T1≡T3≡T4 sole-proprietor craftsman; T1≡T2, T1≡T6 as candidate
      extensions) extend the same mechanism to compound fusions.
    conditions: "C1; depends on P1-P3 and the separability diagnostic (2026ag)."
    antecedents: [P1, P2, P3]
    falsifier: >-
      A structurally coherent, sustained transaction in which a Fused pair
      is split (one tier forked, its partner retained by a different
      principal) without measurable integration failure at that boundary.
    evidence:
      - type: citation
        anchor: >-
          The six-tier ontology's own separability diagnostic and
          tier-collapse states (T1≡T4, T1≡T3) are the direct antecedent this
          predicate operationalizes for the transaction case.
        citation_keys: [zharnikov-2026-dual-hierarchies-organizational-transferability-six]
        citation_role: theoretical_predecessor
      - type: citation
        anchor: >-
          Closest existing formal precedent: explicit structural constraints
          under which two organizational process graphs can be merged
          without introducing faults at the seams.
        citation_keys: [wagner-2013-consolidation-interacting-bpel]
        citation_role: methodological_source
      - type: citation
        anchor: >-
