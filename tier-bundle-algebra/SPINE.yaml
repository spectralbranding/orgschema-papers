  - id: L1
    statement: >-
      This is a theoretical contribution; the cascade rule and admissibility
      predicate had no end-to-end empirical support when the theory was
      developed — the same limitation disposition as 2026ag's own P1-P7. The
      pre-registered case-coding program (n=30 documented deals; three blinded
      AI coders with majority-vote-or-flag, Fleiss' κ = .838; Fisher's exact on
      cascade-conformance-vs-failure-pathway cells) has now been executed and
      returns PRELIMINARY confirmatory support: across
      the 26 H6-eligible cases the φ4→φ5 cell rejects independence (Fisher's
      exact p = .009, Cramér's V = .799) and the aggregate cell likewise
      (p = .009), meeting the pre-registered confirmation threshold, while the
      φ5→φ6 cell rests on a single gap case and does not clear its corrected
      threshold. The support is preliminary and fragile — three gap cases only,
      wide confidence intervals, a single-case φ5→φ6 cell, a secondary
      unmanaged-gap stratification that does not reject, and sensitivity to how
      a cascade gap is operationalized — not settled evidence.
    affects: [P5, P6, P7, P8]
    body_sections: ["Discussion — Limitations"]

  - id: L2
    statement: >-
      EXPLORATORY re-scoping of the n=26 empirical result to the reading the
      data actually support (POST-HOC, NOT pre-registered — the registered test
      in L1 tested sufficiency): a cascade gap is a NECESSARY condition for a
      cascade-type integration failure, and cascade-conformance is a structural
      safe harbor against it. In the H6-eligible corpus every failure carried a
      cascade gap (necessity consistency P(gap | fail) = 1.00, 2/2) and every
      conformant case avoided failure (safe harbor P(fail | no gap) = 0, 0/23;
      exact binomial 95% upper bound .148), whereas a gap predicted failure only
      two times in three (P(fail | gap) = .667) — so the SUFFICIENCY direction is
      weak, and the significance reported in L1 is driven by specificity (23/23),
      not sensitivity. Framed as Necessary Condition Analysis (Dul 2016) for the
      dichotomous case, the CE-FDH ceiling reduces to the empty low-gap/high-
      failure cell, giving an effect size d = .25 (medium band). Two honesty
      constraints scope the claim: (a) all three gap cases were anchor deals the
      algebra was developed against, and the blinded extension contributed zero
      gap cases and zero failures, so the discriminating phenomenon is a
      structural tail that a random large-deal frame under-samples; and (b) the
      necessary-condition claim itself rests on only two failures — mitigated
      because its evidence is the well-populated 23/23 safe-harbor cell rather
      than the sparse gap cells. This necessary-condition reading becomes the
      PRE-REGISTERED confirmatory hypothesis only for a future large-N
      replication; on this corpus it is a data-motivated lens on the same data,
      not settled evidence, and it ADDS to rather than replaces the registered
      sufficiency result in L1.
    conditions: >-
      EXPLORATORY / post-hoc on the n=26 H6-eligible corpus; depends on the
      cascade rule (P5), the admissibility predicate (P6), and the executed
      case-coding program (L1).
    antecedents: [P5, P6, L1]
    falsifier: >-
      A documented cascade-type integration failure (a Product-Process
      disruption at φ_4→φ_5 or a Process-Organization fracture at φ_5→φ_6) that
      occurred with NO cascade gap present — i.e., a failure at that boundary in
      a cascade-conformant bundle.
    evidence:
      - type: citation
        anchor: >-
          Necessary Condition Analysis — the venue-legible method purpose-built
          for an "X is necessary for Y" structure, with its own ceiling-zone
          effect size, a better statistical fit for this result than
          Fisher's-exact-for-sufficiency.
        citation_keys: [dul-2016-necessary-condition-analysis]
        citation_role: methodological_source
      - type: analytic
        anchor: >-
          The necessary-condition + safe-harbor statistics (empty-cell binomial
          safe-harbor test, necessity consistency, weak sufficiency, dichotomous
          NCA ceiling) are computed by the committed analysis pipeline and
          reproduce P(fail | no gap) = 0/23 (95% upper .148),
          P(gap | fail) = 2/2, P(fail | gap) = 2/3, and d = .25; the pipeline's
          fixture self-check asserts these on the study's own 2×2 shape.
    body_sections: ["Discussion — Limitations"]

