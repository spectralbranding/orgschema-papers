acceptance:
- claim_id: P5
  criterion: Holds if cascade rule (κ, total function from a fork operation to the set of forks it structurally
    implies under the service hierarchy) and its conformance predicate π (whether a bundle contains every
    fork κ implies).
  falsification: A documented roll-up (or other N-to-1 merge) in which a lower-tier fork produces no upward
    propagation despite a fused separability profile, holding target separability and integration approach
    comparable to cases that do exhibit it.
- claim_id: P6
  criterion: 'Holds if admissibility predicate α(B, κ): a tier-bundle is inadmissible if it forks a tier
    that is Fused to another tier (per the six-tier ontology''s own tier-collapse states) without also
    forking the fused partner, because the fused tier inherits Tier 1''s non-conveyability by identification.'
  falsification: A structurally coherent, sustained transaction in which a Fused pair is split (one tier
    forked, its partner retained by a different principal) without measurable integration failure at that
    boundary.
- claim_id: P7
  criterion: 'Holds if worked non-self example (the distinct-contribution demonstration none of the old
    memo''s five illustrative examples — asset deal, franchise, intra-business pivot, acqui-hire, redomiciliation,
    all recoveries of already-named types — ever supplied): a partial sub-tier fork at Tier 4 that preserves
    the Tier-1 imprint attached to a different Tier-4 sub-record is a hybrid bundle signature absent from
    Tables 1-2; the algebra classifies it at a grain the bare six-tier signature does not resolve, and
    predicts three falsifiable outcomes a flat taxonomy does not generate: (i) carve-outs of Fused Tier-1-Tier-4
    pairs systematically violate integration expectations; (ii) acqui-hires succeed only when Tier-5/Tier-6
    fork independently of Tier-3; (iii) roll-up failure concentrates at the Process-Organization boundary
    (the same claim as P5''s falsifier, cross-referenced not restated).'
  falsification: Any of the three predictions failing systematically across matched cases (see P5's falsifier
    for the roll-up-specific case).
- claim_id: L2
  criterion: 'Holds if eXPLORATORY re-scoping of the n=26 empirical result to the reading the data actually
    support (POST-HOC, NOT pre-registered — the registered test in L1 tested sufficiency): a cascade gap
    is a NECESSARY condition for a cascade-type integration failure, and cascade-conformance is a structural
    safe harbor against it.'
  falsification: A documented cascade-type integration failure (a Product-Process disruption at φ_4→φ_5
    or a Process-Organization fracture at φ_5→φ_6) that occurred with NO cascade gap present — i.e., a
    failure at that boundary in a cascade-conformant bundle.
