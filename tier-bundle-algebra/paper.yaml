- id: A1
  type: proposition
  statement: 'A continuous kinematic or manifold treatment of the transaction (a rival to the discrete
    typed-algebra approach) was tested and rejected on structural grounds: discrete institutional facts
    have no derivative, and ordinal/ipsative tier instruments do not support Euclidean kinematics.'
  testable: false
  tested_in_paper: false
  status: not_tested
- id: C1
  type: proposition
  statement: 'Boundary condition: the algebra applies to single-transaction envelopes only (the intra-business
    pivot sits at, but does not cross, this boundary — one bounded time-axis fork event, not an open-ended
    iterative reallocation). It explicitly does not apply to repeated within-firm resource reallocation
    over time.'
  testable: false
  tested_in_paper: false
  status: not_tested
- id: C2
  type: proposition
  statement: 'Boundary condition: the predicate is defined over a target whose tier records exist. A tier
    whose record is constituted by intention or forecast rather than by realized events supports no separability
    reading, so the predicate has no input rather than a permissive one, and a bundle forking that tier
    is not admissible but UNEVALUATED. The distinction is one of kind, not degree: identity fusion is
    a failure of the transaction''s structure that no evidence could repair, whereas non-realization is
    a failure of the record that time repairs on its own. Because the predicate is total and two-valued,
    the second case is presently returned as the complement of the first, so its error runs in one direction
    only — it can admit a bundle it should not, never the reverse — and that error concentrates in the
    population where the predicate is most likely to be consulted and least able to answer.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P6
- id: L1
  type: proposition
  statement: 'This is a theoretical contribution; the cascade rule and admissibility predicate had no
    end-to-end empirical support when the theory was developed — the same limitation disposition as 2026ag''s
    own P1-P7. The pre-registered case-coding program (n=30 documented deals; three blinded AI coders
    with majority-vote-or-flag, Fleiss'' κ = .838; Fisher''s exact on cascade-conformance-vs-failure-pathway
    cells) has now been executed and returns PRELIMINARY confirmatory support: across the 26 H6-eligible
    cases the φ4→φ5 cell rejects independence (Fisher''s exact p = .009, Cramér''s V = .799) and the aggregate
    cell likewise (p = .009), meeting the pre-registered confirmation threshold, while the φ5→φ6 cell
    rests on a single gap case and does not clear its corrected threshold. The support is preliminary
    and fragile — three gap cases only, wide confidence intervals, a single-case φ5→φ6 cell, a secondary
    unmanaged-gap stratification that does not reject, and sensitivity to how a cascade gap is operationalized
    — not settled evidence.'
  testable: false
  tested_in_paper: false
  status: not_tested
- id: L2
  type: proposition
  statement: 'EXPLORATORY re-scoping of the n=26 empirical result to the reading the data actually support
    (POST-HOC, NOT pre-registered — the registered test in L1 tested sufficiency): a cascade gap is a
    NECESSARY condition for a cascade-type integration failure, and cascade-conformance is a structural
    safe harbor against it. In the H6-eligible corpus every failure carried a cascade gap (necessity consistency
    P(gap | fail) = 1.00, 2/2) and every conformant case avoided failure (safe harbor P(fail | no gap)
    = 0, 0/23; exact binomial 95% upper bound .148), whereas a gap predicted failure only two times in
    three (P(fail | gap) = .667) — so the SUFFICIENCY direction is weak, and the significance reported
    in L1 is driven by specificity (23/23), not sensitivity. Framed as Necessary Condition Analysis (Dul
    2016) for the dichotomous case, the CE-FDH ceiling reduces to the empty low-gap/high- failure cell,
    giving an effect size d = .25 (medium band). Two honesty constraints scope the claim: (a) all three
    gap cases were anchor deals the algebra was developed against, and the blinded extension contributed
    zero gap cases and zero failures, so the discriminating phenomenon is a structural tail that a random
    large-deal frame under-samples; and (b) the necessary-condition claim itself rests on only two failures
    — mitigated because its evidence is the well-populated 23/23 safe-harbor cell rather than the sparse
    gap cells. This necessary-condition reading becomes the PRE-REGISTERED confirmatory hypothesis only
    for a future large-N replication; on this corpus it is a data-motivated lens on the same data, not
    settled evidence, and it ADDS to rather than replaces the registered sufficiency result in L1.'
  testable: true
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P5
  - P6
  - L1
- id: L3
  type: proposition
  statement: The paper does not supply the third verdict that C2's scope condition implies. The predicate
    stays total and two-valued, no realization-state variable is introduced, and no new term is created;
    naming the gap is honest and cheap, and filling it is a separate question this paper does not take
    up. The parallel item for the six-tier separability diagnostic — that its per-tier cell on an unrealized
    tier returns an intention reading in the same type as an evidence reading — belongs to the paper that
    owns that instrument, not here.
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - C2
