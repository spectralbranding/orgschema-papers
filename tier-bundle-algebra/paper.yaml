meta:
  title: 'Tier-Bundle Algebra in Inter-Organizational Resource Transfer: A Fork-Operation Formalism Over
    the Six-Tier Acquisition-Target Ontology'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.21756077
  date: '2026-08-09'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - mergers and acquisitions
  - tier-bundle algebra
  - fork operation
  - bundle signature
  - cascade propagation
  - structural admissibility
  - modularity theory
  - deal-type taxonomy
  abstract: 'Theories of the firm recognize that resources are interconnected in ways that limit transferability
    [@dierickx-1989-asset-stock-accumulation], yet no account specifies when a component becomes so identity-fused
    to a firm that decomposing the two destroys its value. Mergers-and-acquisitions practice meets this
    gap: transactions are classified by an enumerated table of named deal types (asset deal, carve-out,
    acqui-hire, roll-up, and others) arrived at inductively rather than derived from a generative rule,
    leaving hybrid or unnamed transactions with no principled place in the table. This paper reframes
    an acquisition as a typed bundle of fork operations over a target''s six-tier structure, from Owner
    Intent through Organization: a tier-fork operation, a tier-bundle, and a bundle signature recover
    all fourteen named deal types as signature instances rather than hand-enumerated categories. A directional
    cascade rule specifies which tier-forks structurally require forks at adjacent tiers; an admissibility
    predicate, derived from the ontology''s own tier-collapse states, formalizes when identity-fusion
    renders a component non-transferable. A worked hybrid example demonstrates a signature absent from
    existing taxonomies and yields three falsifiable predictions a flat taxonomy does not produce. Beyond
    this contribution to the theory of the firm, the structure is also checkable at term-sheet stage,
    before a deal''s definitive agreements are drafted.'
claims:
- id: SF1
  type: proposition
  statement: The named M&A deal-type taxonomy (asset deal, share sale, carve-out, acqui-hire, roll-up,
    spin-out, franchise, redomiciliation, merger of equals, reverse merger, joint venture, asset swap,
    intra-business pivot, sole-proprietor wind-down) is enumerated by the transfer instrument, inductively
    from observed deal practice, not derived from any generative rule about what a transaction IS. A hybrid
    or unnamed transaction has no principled place in the table, and whether a proposed deal shape is
    structurally sound is assessed by practitioner judgment rather than a checkable predicate.
  testable: false
  tested_in_paper: false
  status: not_tested
- id: P1
  type: proposition
  statement: 'Definition 1 (tier graph G): a typed directed graph G = (T, E) with vertex set T = the six
    tiers of the acquisition-target ontology and edge set E partitioned into a downward constraint hierarchy
    and an upward service hierarchy (the same relationships viewed from opposite directions). The algebra
    rests on three structural assumptions, stated explicitly as axioms of this paper and taken as given
    (not established here): (A) the Tier-1 attribution refinement — Tier 1 attaches to the controlling-principal
    substrate, not the asset substrate, and is replaced rather than transferred under any ownership-changing
    transaction; (B) Tier-3 jurisdictional mutability — the legal vehicle can swap while Tiers 2, 4, 5,
    6 continue undisrupted; (C) the tier-collapse states (T1≡T4 Domain Craftsman/Family Steward/Mission
    Founder; T1≡T3 sole-proprietor) at which the fused tier inherits Tier 1''s non-conveyability. The
    three are developed and empirically motivated in the six-tier ontology, cited as their provenance
    rather than as an authority on which the algebra''s results depend; a reader who grants Assumptions
    A–C can verify every subsequent proposition independently of that work.'
  testable: false
  tested_in_paper: false
  status: not_tested
- id: P2
  type: proposition
  statement: 'Definition 2 (tier-fork operation φ_n): a typed transfer of the Tier-n record from a vertex
    in the seller''s tier graph to a vertex in the buyer''s tier graph under a direction tag drawn from
    {transfer (1-to-1), merge (N-to-1), split (1-to-N), read-only (licence-style use-rights without governance
    transfer), swap (substitution at fixed identity — the only well-typed lateral operation, reserved
    for Tier 3), split-time (fork across a discrete time boundary within one continuing principal, no
    ownership-boundary crossing)}. φ_n is well-typed only when source and target share the tier index;
    Tier 1 admits no well-typed fork under any direction other than replace, because its transferability
    mode is imprint-only.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
- id: P3
  type: proposition
  statement: 'Definition 3 (tier-bundle B and signature σ): a tier-bundle is an ordered set of tier-fork
    operations executed under one transaction envelope. Its signature σ(B) is the per-tier projection
    onto direction (or composite Tier-1 token, or ∅) for each of the six tiers; a composition table resolves
    the composite direction when two operations in B target the same tier index (handling symmetric/multi-party
    cases: asset swap, symmetric merger, three-way restructuring, franchise- system extension). The signature
    individuates a named deal type: every one of fourteen named M&A deal types recovers as a signature
    instance — not an independently enumerated category — modulo cardinality refinement.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
  - P2
- id: P4
  type: proposition
  statement: 'Firm-as-bundle framing: casting the firm as a bundle of tier-records (rather than a single
    undifferentiated entity) is thematically adjacent to, and extends in a specific direction, the classic
    resource-based and knowledge-based views of the firm, and is a special case of general modular-systems
    theory applied to a fixed six-tier substrate and one class of recombination event (the acquisition
    transaction). The distinctive contribution relative to those traditions is the cascade-asymmetry claim
    (P5) and the admissibility predicate (P6), neither of which those traditions themselves derive.'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
  - P2
  - P3
- id: P5
  type: proposition
  statement: 'Cascade rule (κ, total function from a fork operation to the set of forks it structurally
    implies under the service hierarchy) and its conformance predicate π (whether a bundle contains every
    fork κ implies). κ is upward-implying along the service hierarchy and downward-non-implying: forking
    a served tier (e.g., Product) entails forking the tier that serves it (Process), because the served
    tier loses its productive substrate otherwise; the reverse does not hold, because substrate is replaceable
    from below (the franchise case: a Tier-4 read-only fork does not cascade to a Tier-5 fork). Cascade
    gaps — forks in κ(B) absent from B — are the operationally consequential omissions: a gap at φ_4→φ_5
    is a Product-Process disruption surfaced compositionally; a gap at φ_5→φ_6 is a Process-Organization
    fracture.'
  testable: true
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
  - P2
  - P3
- id: P6
  type: proposition
  statement: 'Admissibility predicate α(B, κ): a tier-bundle is inadmissible if it forks a tier that is
    Fused to another tier (per the six-tier ontology''s own tier-collapse states) without also forking
    the fused partner, because the fused tier inherits Tier 1''s non-conveyability by identification.
    The two canonical collapse states (T1≡T4 Domain Craftsman/Family Steward/Mission Founder; T1≡T3 sole-proprietor)
    generate two admissibility rules; multi-tier collapse generalizations (T1≡T3≡T4 sole-proprietor craftsman;
    T1≡T2, T1≡T6 as candidate extensions) extend the same mechanism to compound fusions.'
  testable: true
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P1
  - P2
  - P3
- id: P7
  type: proposition
  statement: 'Worked non-self example (the distinct-contribution demonstration none of the old memo''s
    five illustrative examples — asset deal, franchise, intra-business pivot, acqui-hire, redomiciliation,
    all recoveries of already-named types — ever supplied): a partial sub-tier fork at Tier 4 that preserves
    the Tier-1 imprint attached to a different Tier-4 sub-record is a hybrid bundle signature absent from
    Tables 1-2; the algebra classifies it at a grain the bare six-tier signature does not resolve, and
    predicts three falsifiable outcomes a flat taxonomy does not generate: (i) carve-outs of Fused Tier-1-Tier-4
    pairs systematically violate integration expectations; (ii) acqui-hires succeed only when Tier-5/Tier-6
    fork independently of Tier-3; (iii) roll-up failure concentrates at the Process-Organization boundary
    (the same claim as P5''s falsifier, cross-referenced not restated).'
  testable: true
