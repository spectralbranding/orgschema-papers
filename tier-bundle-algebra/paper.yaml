- id: P8
  type: proposition
  statement: 'Soundness/completeness (proof sketch, scoped to the smallest adequate structure — a typed
    partial order with a fork morphism and composition operator, NOT full category-theory axioms; category-theoretic
    closure on closure/identity/inverse is deferred to follow-on work): every named deal type corresponds
    to exactly one bundle signature under Definitions 3-4, and every admissible bundle signature under
    P6 corresponds to a structurally coherent transaction, even when that signature has no existing name
