[project]
name = "orgschema-papers-hub"
version = "0.1.0"
description = "Hub index for OST research papers"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Dmitry Zharnikov", email = "fermeradar@gmail.com" },
]
keywords = [
    "organizational schema theory",
    "six-tier ontology",
    "specification readiness",
]

[project.urls]
"Homepage" = "https://github.com/spectralbranding/orgschema-papers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

# Hub-root mypy scopes to src/ only; per-paper-slug Python is handled under
# each paper's own pyproject.toml during Phase 2 PUBLIC_MIRROR_STANDARD backfill.

# Hub-root linters scope only top-level orchestration; each paper-slug
# subdirectory carries its own formatting context and is handled in Phase 2
# per-paper-slug backfill of PUBLIC_MIRROR_STANDARD v1.0.0.
[tool.black]
extend-exclude = '''
/(
    brand-as-tier4
  | capability-as-projection
  | org-as-metadata
  | orgschema-audit
  | organizational-schema-theory
  | projection-paper
  | six-tier-ontology
  | specification-readiness
  | specification-readiness-empirical
  | tier-allocation
  | tier-penetration
  | tier-rotation
  | verification-as-operator
)/
'''
