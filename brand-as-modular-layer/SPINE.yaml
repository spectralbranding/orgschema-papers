# Schema v0.1 ([internal path removed] §"Schema v0.1"):
# this is a PURE-THEORY paper in the Eisenhardt & Graebner (2007) theory-building
# tradition — seven falsifiable propositions plus two diagnostic instruments,
# with NO author-produced data, simulations, Monte Carlo, or computed empirical
# table values. The companion scripts (v_parameter.py, mbcd_scorer.py) implement
# the instruments with illustrative defaults but report no derived findings; the
# numbered tables are conceptual/decomposition tables, not measurements. Hence
