propositions:
  - id: "P1"
    name: "Multi-Brand Capacity"
    statement: >
      Portfolio capacity (number of brands hostable on one business substrate
      without performance degradation) scales with Tier-3, Tier-5, and Tier-6
      Independence in the firm's separability profile, NOT with Tier-2
      Business Model diversification.
    falsification: >
      P1 is falsified if a systematic comparison of multi-brand firms shows
      portfolio capacity scaling with Tier-2 Business Model diversification
      independent of Tier-3 / Tier-5 / Tier-6 separability, or if separability
      shows no relationship to capacity at constant Tier-2 diversification.
  - id: "P2"
    name: "Recovery Substrate"
    statement: >
      Failed-brand recovery success (probability the new brand on the salvaged
      substrate reaches the predecessor's revenue band within 36 months) scales
      with the proportion of brand-agnostic infrastructure preserved through
      the failure event.
    falsification: >
      P2 is falsified if recovery success rate is statistically independent of
      preserved brand-agnostic infrastructure proportion in a population of
      post-failure recoveries with comparable Tier-1 Owner Intent profiles.
  - id: "P3"
    name: "Architecture Risk-Return"
    statement: >
      Branded-house architectures expose all Tier-4 instances to Tier-1 / Tier-2
      shocks; house-of-brands architectures isolate them. Risk-return profiles
      documented in Rao (2004) and Hsu, Fournier and Srinivasan (2016) are
      derivable from this isolation parameter.
    falsification: >
      P3 is falsified if the cross-architecture variance in risk-return
      profile shows no monotonic relationship to the Tier-3-visibility-in-Tier-4
      parameter when controlling for industry and firm size.
  - id: "P4"
    name: "Cross-Brand Marketing Effectiveness"
    statement: >
      Cross-brand marketing-function effectiveness is a function of Tier-4
      governance separation: shared services for brand-agnostic functions
      (media buying, analytics, platform tooling); per-brand teams for
      brand-bound functions (creative, brand management, customer service tone).
    falsification: >
      P4 is falsified if firms that pool brand-bound functions across brands
      show effectiveness equal to or greater than firms that segregate them,
      controlling for portfolio breadth.
  - id: "P5"
    name: "Brand Extension SBT-Overlap"
    statement: >
      Brand extension success is predicted to scale with SBT-dimensional
      overlap between parent and extension on the Cultural and Ideological
      dimensions specifically; mismatch on those axes is reliably predicted to
      forecast extension failure (extending Aaker and Keller 1990 with the
      SBT eight-dimension machinery, supported by Torelli and Ahluwalia 2012
      cultural-schema transfer evidence and Spiggle, Nguyen and Caravella
      2012 authenticity transfer evidence).
    falsification: >
      P5 is falsified if axis-specific dimensional overlap on Cultural and
      Ideological dimensions shows no greater predictive power than other
      SBT axes, or no greater than aggregate fit measures, in a re-coded
      meta-analytic sample.
  - id: "P6"
    name: "Recovery Tier-1 Constraint"
    statement: >
      Brand recovery is more constrained by Tier-1 (Owner Intent) compatibility
      with the new Tier-4 configuration than by Tier-5 / Tier-6 capacity
      availability. Owners with Tier-1 misalignment to the new brand-face fail
      recovery even when substrate is fully preserved.
    falsification: >
      P6 is falsified if Tier-1 Owner Intent compatibility fails to predict
      recovery success at higher conditional rate than Tier-5 / Tier-6
      capacity measures in a sample of post-failure recoveries.
  - id: "P7"
    name: "Aaker Spectrum Operationalization"
    statement: >
      The Aaker and Joachimsthaler (2000) Brand Relationship Spectrum is
      operationalizable as a single Tier-3-visibility-in-Tier-4 parameter
      projecting onto SBT Social and Economic dimensions, making it
      measurable rather than only typological.
    falsification: >
      P7 is falsified if Tier-3-visibility coding fails to recover the four
      canonical spectrum positions (branded house / sub-brand / endorsed /
      house of brands) in a coding study, or if the parameter fails to
      project monotonically onto SBT Social and Economic dimensions.

