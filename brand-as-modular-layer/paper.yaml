contradictions: []
limitations:
- description: The framework has no empirical tests; it is a theory-building contribution (Eisenhardt
    & Graebner 2007) offering new constructs, relationships, and predictions against existing data. The
    four-priority validation roadmap requires new measurement work the framework predicts but does not
    supply (V-coded multi-firm panel, brand-failure salvage corpus, SBT-axis-recoded brand-extension dataset).
  severity: moderate
  addressable: true
- description: The framework was developed with B2C consumer-goods and hospitality anchors. B2B, platform/two-sided,
    NGO, cooperative, and state-owned extensions are deferred; the platform-stack boundary case (stacked
    framework instances) is a sketch, not a developed theory.
  severity: moderate
  addressable: true
- description: 'Disconfirming case (Apple): a persistent branded-house architecture with V ~ 1 across
    a diverse Tier-4 portfolio that has delivered exceptional risk-adjusted returns for decades. This
    does not falsify P3 (Tier-1 strength is a recognized parameter) but shows V alone is insufficient
    — the strength and coherence of the Tier-1 constraint interacts with V in ways the propositions do
    not yet fully formalize.'
  severity: moderate
  addressable: true
- description: The framework does not address brand senescence (natural decline of a Tier-4 specification
    as cohort composition shifts); longitudinal architecture transitions are deferred.
  severity: moderate
  addressable: true
