meta:
  title: 'Brand as a Modular Layer: Tiered Organizational Architecture, Separability, and Firm Performance
    in Multi-Brand Strategies'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.19930157
  date: '2026-06-01'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - brand portfolio architecture
  - multi-brand strategy
  - corporate rebranding
  - brand failure recovery
  - tier-level decomposition
  - brand-business separability
  - marketing organization
  - cross-brand function
  abstract: Firms differ dramatically in their ability to manage multiple brands, recover from brand failure,
    and organize marketing activities — yet no theory specifies which organizational layers carry the
    brand boundary. This paper proposes a six-tier architecture of the firm in which brand is strictly
    the Tier-4 product specification surface, while the remaining five tiers are largely brand-agnostic.
    Three strategic outcomes follow. Multi-brand capacity scales with Tier-3, Tier-5, and Tier-6 independence
    rather than Business Model diversification (P1). Recovery success after brand failure scales with
    preserved brand-agnostic substrate (P2), providing a mechanism for the equity-transfer-without-creation
    regularity of Marques et al. [-@marques-2020-role-brand-equity]. Marketing, advertising, and branding
    are Tier-6 functions that create, operate, and retire Tier-4 instances; centralization choices are
    therefore separability choices (P4). The Aaker–Joachimsthaler Brand Relationship Spectrum is operationalized
    as a continuous Tier-3-visibility-in-Tier-4 parameter V (P7), and axis-specific brand-extension predictions
    follow on the Cultural and Ideological dimensions (P5). Two diagnostic instruments — a Multi-Brand
    Capacity Diagnostic and a Recovery Salvage Matrix — translate the framework for practice. Seven falsifiable
    propositions unify brand-portfolio, corporate-rebranding, and marketing-organization literatures under
    a common modularity logic, reframe documented empirical asymmetries as predictable consequences of
    layered architecture, and connect to competitive advantage, M&A value creation, and dynamic capabilities.
claims:
- id: P0
  type: proposition
  statement: 'Brand IS Tier 4: brand is the specification of the customer-facing Tier-4 product surface
    (a choice of positions on the SBT Semiotic, Narrative, Ideological, Experiential, Social, Economic,
    Cultural, and Temporal axes, or any equivalent complete observer-projection-compatible basis). Brand
    is NOT the perception (which lives downstream in the perception cloud after projection through the
    observer perceptual filter), NOT the legal trademark (a Tier-3 entity artifact), and NOT the marketing
    communications (a Tier-6 function operating on Tier 4). This is the single structural claim from which
    all seven propositions follow.'
  testable: false
  tested_in_paper: false
  status: not_tested
- id: P0b
  type: proposition
  statement: Each of the six tiers contains a mix of brand-agnostic and brand-bound subcomponents; the
    mix determines how separable that tier is across multiple Tier-4 brand instances. Tier 4 alone has
    zero separability by construction (it IS the brand instance); the other five tiers admit both shared
    (brand-agnostic) and brand-specific (brand-bound) subcomponents. Multi-brand capacity is therefore
    a property of how separable the other five tiers are.
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P0
- id: P0c
  type: proposition
  statement: A Tier-4 specification is realized in customer perception only after passing through an observer
    perceptual filter; the same specification produces different perceived brand instances (different
    perception clouds) in different cohorts. The firm controls the Tier-4 specification (the input); the
    cohort spectral profile controls the perception cloud (the output); diagnostics that conflate the
    two diagnose the wrong tier. This is consistent with — and bounded by — the specification-impossibility
    result.
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P0
- id: P1
  type: proposition
  statement: 'Multi-Brand Capacity. Portfolio capacity — the number of Tier-4 brand instances a firm can
    host on its existing substrate without performance degradation — scales with Tier-3, Tier-5, and Tier-6
    independence in the firm''s separability profile, and NOT with Tier-2 Business-Model diversification.
    (Confirming: capacity correlates r > .40 with a Tier-3/5/6 separability index and |r| < .15 with a
    Business-Model diversification index. Falsifying: capacity is independent of Tier-3/5/6 separability,
    or primarily explained by Business-Model diversification.)'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P0
  - P0b
- id: P2
  type: proposition
  statement: 'Recovery Substrate. Failed-brand recovery success — the probability that the new Tier-4
    instance on the salvaged substrate reaches the predecessor''s revenue band within ~36 months — scales
    with the proportion of brand-agnostic infrastructure (Tier 1/2/3/5/6 components untouched by the failure)
    preserved through the failure. Mechanism: equity transfers along persisting substrate (Marques et
    al. 2020), but net-new equity creation requires changes at Tier 1 or Tier 2. (Confirming: 36-month
    recovery rate correlates r > .35 with a preserved-substrate-proportion score. Falsifying: recovery
    rate independent of preserved substrate, or primarily explained by post-failure marketing investment.)'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P0
  - P0b
- id: P3
  type: proposition
  statement: 'Architecture Risk-Return. Branded-house architectures expose all Tier-4 instances to Tier-1/Tier-2
    shocks; house-of-brands architectures isolate Tier-4 instances from them. The risk-return profiles
    documented by Rao, Agarwal & Dahlhoff (2004) and Hsu, Fournier & Srinivasan (2016) are derivable from
    the Tier-3-visibility parameter V (high V = high propagation; low V = isolation). (Falsifying: V is
    uncorrelated with risk concentration at Tier 1/Tier 2.)'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P0
  - P0b
  - P7
- id: P4
  type: proposition
  statement: 'Cross-Brand Marketing Effectiveness. Cross-brand marketing-function effectiveness is a function
    of Tier-6 governance separation: shared services for brand-agnostic functions (media buying, analytics,
    marketing-mix modeling, platform tooling) and per-brand teams for brand-bound functions (creative,
    brand management, customer-service tone). Centralization-versus-decentralization is therefore a tier-level
    separability choice. (Confirming: aligned organizations outperform misaligned ones by Cohen''s d >=
    .30 on a validated marketing-effectiveness composite, controlling for size and sector. Falsifying:
    no effect of partition alignment on effectiveness.)'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P0
  - P0b
- id: P5
  type: proposition
  statement: 'Brand Extension SBT-Overlap. Brand-extension success scales with SBT-dimensional overlap
    between parent and extension on the Cultural and Ideological dimensions (the highest-transfer axes);
    failure is reliably predicted by mismatch on those axes. Experiential and Economic are the lowest-transfer
    axes (context-specific, volatile, evaluated independently of the parent). The ranking derives from
    the temporal-stability and observer-schema-persistence properties of the dimensions. (Confirming:
    Cultural + Ideological alignment predicts extension success above and beyond standard fit and parent-equity
    controls. Falsifying: that alignment adds no predictive power, or Experiential/Economic dominate transfer.)'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P0
- id: P6
  type: proposition
  statement: 'Recovery Tier-1 Constraint. Brand recovery is more constrained by Tier-1 (Owner Intent)
    compatibility with the new Tier-4 configuration than by Tier-5/Tier-6 capacity availability. Owners
    whose Tier-1 commitments are bound to the failed brand-face fail recovery even when substrate is fully
    preserved, because Tier 1 sits atop the constraint hierarchy and bounds admissible Tier-4 specifications.
    (Confirming: Tier-1 misalignment predicts failure independent of preserved Tier-5/6 substrate. Falsifying:
    Tier-1 alignment uncorrelated with outcome once Tier-5/6 is controlled.)'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P0
  - P2
- id: P7
  type: proposition
  statement: 'Aaker Spectrum Operationalization. The Aaker-Joachimsthaler (2000) Brand Relationship Spectrum
    is operationalizable as a single Tier-3-visibility-in-Tier-4 parameter V in [0, 1] — V = w1*v_name
    + w2*v_visual + w3*v_endorse — projecting onto the SBT Social and Economic dimensions, making the
    spectrum measurable rather than only typological (V ~ 1 Virgin branded house; V ~ 0 P&G house of brands;
    intermediate sub-brand/endorsed). (Confirming: inter-rater agreement > .80; V correlates with the
    Hsu et al. five-class taxonomy at r > .75; V predicts firm-value outcomes above and beyond discrete-class
    assignment. Falsifying: V cannot be reliably coded, adds no predictive power, or the Social/Economic
    projection does not carry the propagation effect.)'
  testable: false
  tested_in_paper: false
  status: not_tested
  depends_on:
  - P0
  - P0b
