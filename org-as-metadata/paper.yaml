limitations:
- description: The framework applies most cleanly to economic organizations producing measurable outputs;
    extension to identity-laden / highly institutionalized settings requires explicitly modeling legitimacy
    observers whose evaluation functions weight form independently of output.
  severity: moderate
  addressable: true
- description: The paper derives propositions but does not empirically demonstrate them; they are a starting
    point for empirical research programs, in the Organization Science tradition of testable theoretical
    contributions, not established empirical facts. The companion simulation produces ordinal, uncalibrated
    predictions only.
  severity: moderate
  addressable: true
- description: Whether advancing AI capabilities erode the tacit-knowledge boundary is an empirical question
    the theory is designed to inform rather than prejudge; if AI progressively codifies previously-tacit
    coordination, the tacit bound (P8/D4) could weaken as a constraint.
  severity: moderate
  addressable: true
