meta:
  title: 'Organizational Metamerism: Observer-Relative State Equivalence in Organizational Configurations'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.19869871
  date: '2026-06-01'
  venue: Organization Science
  license: CC-BY-4.0
  keywords:
  - organizational metamerism
  - equifinality
  - organizational routines
  - temporal hierarchy
  - coordination costs
  - organizational form
  - AI and organizations
  - observer-relativity
  abstract: Why do structurally distinct organizations produce indistinguishable value outputs for a given
    evaluative observer? Equifinality explains convergence along different paths to the same performance
    outcome but cannot account for simultaneous state equivalence among permanently different configurations.
    This paper introduces organizational metamerism, an observer-relative condition in which two configurations
    executing the same process map to identical value outputs for a specific evaluator. Drawing on color
    science, the paper locates metamerism within a temporal stability hierarchy — value outputs change
    more slowly than processes, which change more slowly than organizational configurations — and explains
    this ordering through an organization-as-metadata mechanism. As coordination costs fall, coordination
    logic is progressively absorbed into process specifications, expanding the metamerism set. Tacit knowledge
    intensity bounds this expansion. The framework generates four propositions with explicit confirmation
    and falsification criteria. It predicts that AI-mediated coordination will decouple organizational
    restructuring frequency from process change frequency and that stakeholder classes will systematically
    disagree about configuration equivalence because their evaluative sensitivities differ. By reframing
    organizational form as revisable metadata and change as schema migration, the theory complements equifinality,
    routine, and pace-layering perspectives while offering methodological prescriptions for configurational
    research and practical guidance for AI-era restructuring. Boundary conditions and directions for empirical
    testing are discussed.
claims:
- id: P1
  type: proposition
  statement: '(Phenomenon) Organizational metamerism exists and is distinct from equifinality: two structurally
    distinct configurations, both currently executing the same process, can produce value outputs that
    a given observer cannot discern — a STATE equivalence (simultaneous, structural) rather than a PATH
    equivalence (retrospective, historical).'
  testable: false
  tested_in_paper: true
  status: not_tested
- id: P2
  type: proposition
  statement: (Definition / observer-relativity) Two configurations A and B are metamers with respect to
    process P and observer O iff (i) they are structurally distinct configurations both executing P and
    (ii) O detects no difference between their value outputs. The relation is process-relative AND observer-relative;
    the metamerism set M(P,O) is the equivalence class of a reference configuration under O's evaluation
    function. The structure is the tripartite color-science one (two stimuli, observer cone sensitivities,
    illuminant) lifted to (two configurations, observer evaluation function, process).
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P1
- id: P3
  type: proposition
  statement: (Temporal stability hierarchy — Proposition 1 in the paper) Value outputs change less frequently
    than the processes that produce them, which change less frequently than the organizational configurations
    that execute them. The ordering holds across industries, technological eras, and national contexts,
    and is a consequence of each layer's differential sensitivity to different kinds of technological
    change (value anchored in slow-changing needs/institutional logics; process in physical/cognitive
    technology; configuration in fast-changing coordination technology).
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P1
- id: P4
  type: proposition
  statement: '(Organization-as-metadata mechanism) Organizational form is the configuration layer for
    a set of processes — it specifies how process steps are instantiated, coordinated, and resourced without
    containing the productive logic itself, analogous to a database schema or container config relative
    to the data/application. This grounds the hierarchy: form is the most revision-tolerant layer, so
    a configuration can be re-specified without changing what the process produces, PROVIDED the revision
    maps all process responsibilities to the new configuration.'
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P3
- id: P5
  type: proposition
  statement: (Restructuring as schema migration; Corollary 1) Because form is metadata, organizational
    change is a schema migration with correctness criteria. Reconfigurations that preserve process integrity
    produce no detectable change in value output; reconfigurations that drop coordination responsibilities,
    ambiguate role assignments, or break information flows produce value loss regardless of how elegant
    the new configuration is. The primary failure mode of restructuring is therefore LOSSY MIGRATION,
    not resistance, culture clash, or leadership failure.
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P4
- id: P6
  type: proposition
  statement: (Metamerism Set Expansion — Proposition 2) M(P,O) grows as the proportion of P's coordination
    logic embedded in the process specification increases (codifiability up, coordination cost down) and
    shrinks as the tacit knowledge intensity of P rises. Codifiability and tacit intensity enter as independent,
    additive, separable variables. Schematically |M(P,O)| = f(codifiability(P), 1/c(P), 1/tau(P)).
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P3
  - P4
- id: P7
  type: proposition
  statement: (Coordination compression -> organizational volatility — Proposition 3) As AI reduces the
    marginal cost of coordination, the rate of change of organizational form rises while the rate of change
    of process stays stable; the ratio of organizational-change frequency to process-change frequency
    increases with AI coordination adoption. Falling coordination costs make restructuring continuous
    rather than episodic, extending and partially revising the punctuated-equilibrium model.
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P3
  - P6
- id: P8
  type: proposition
  statement: (Tacit Knowledge Constraint — Proposition 4) The expansion of M(P,O) as coordination costs
    fall is bounded by the tacit knowledge intensity of P. Firms in high-tacit-knowledge industries show
    smaller reductions in coordination overhead than firms in high-codification industries at equivalent
    AI-coordination adoption. Tacit intensity is a lower bound on configuration substitutability that
    coordination-cost reductions cannot eliminate.
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P6
  - P7
- id: P9
  type: proposition
  statement: '(Complementarity, not rivalry) Organizational metamerism complements rather than competes
    with the three nearest literatures: equifinality (path vs state equivalence; observer-relative; derived
    rather than catalogued set), organizational routines / ostensive-performative (observer-relativity
    lifted from routine to organizational level), and pace layering (rate-of-change heterogeneity vs simultaneous
    state equivalence; metamerism adds the observer-relative set with no pace-layering counterpart). It
    also reframes institutional decoupling positively as structural flexibility for technically oriented
    observers.'
  testable: false
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P1
  - P2
  - P3
methodology:
  type: mixed
  design: 'Companion computation script (metamerism_set_simulation.py): a self-contained, fixed-seed (42)
    Python simulation implementing the continuous set-size approximation |M(P,O)| ~ S * kappa(P) / [c(P)
    * (1 + tau(P))], sweeping coordination cost c(P), tacit intensity tau(P), codifiability kappa(P),
    and two observer profiles to reproduce the directional predictions of Tables A1-A3 and Table 2.'
  analysis:
    software: orgschema-papers/org-as-metadata/code/metamerism_set_simulation.py
    method: uv run --with numpy,matplotlib python metamerism_set_simulation.py
acceptance:
- claim_id: P3
  criterion: Holds if (Temporal stability hierarchy — Proposition 1 in the paper) Value outputs change
    less frequently than the processes that produce them, which change less frequently than the organizational
    configurations that execute them.
  falsification: A systematic finding that organizational form is more stable than process across industries,
    or a class of organizations (e.g. ideologically driven, frequent value redefinition) in which the
    ordering inverts.
- claim_id: P5
  criterion: Holds if (Restructuring as schema migration; Corollary 1) Because form is metadata, organizational
    change is a schema migration with correctness criteria.
  falsification: Evidence that process-preserving reconfigurations routinely change value output, or that
    restructuring failure is dominated by sociological rather than coordination-loss causes even when
    migration is verified lossless.
- claim_id: P6
  criterion: Holds if (Metamerism Set Expansion — Proposition 2) M(P,O) grows as the proportion of P's
    coordination logic embedded in the process specification increases (codifiability up, coordination
    cost down) and shrinks as the tacit knowledge intensity of P rises.
  falsification: Evidence that value-output quality is systematically tied to specific organizational
    forms regardless of codification level, or that codification/automation do not predict increased variance
    in viable forms.
- claim_id: P7
  criterion: Holds if (Coordination compression -> organizational volatility — Proposition 3) As AI reduces
    the marginal cost of coordination, the rate of change of organizational form rises while the rate
    of change of process stays stable; the ratio of organizational-change frequency to process-change
    frequency increases with AI coordination adoption.
  falsification: Evidence that AI adoption raises organizational-restructuring and process-change frequency
    equally, or that restructuring frequency has not risen in AI-adopting firms (AI not acting as a coordination-cost
    reducer).
- claim_id: P8
  criterion: Holds if (Tacit Knowledge Constraint — Proposition 4) The expansion of M(P,O) as coordination
    costs fall is bounded by the tacit knowledge intensity of P.
  falsification: Evidence that AI adoption expands the set at equal rates regardless of tacit intensity,
    or that AI is codifying previously-tacit coordination fast enough to dissolve the tacit boundary.
