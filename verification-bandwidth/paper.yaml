contradictions: []
limitations:
- description: There is no false-alarm arm. A real acceptance cascade has both error types and they need
    not share a correlation structure.
  severity: moderate
  addressable: true
- description: The dimensional ceiling's exact constant is derived for one-dimensional inspection subspaces.
    The bound should generalize with the trace of the frame operator replaced by the summed ranks, but
    the corresponding definition of mean correlation has not been worked out.
  severity: moderate
  addressable: true
- description: Anisotropic deviation distributions are untested, and organizations plausibly fail in preferred
    directions. This is the most likely place for the clean mapping result to degrade.
  severity: major
  addressable: true
- description: The executor-invariance ceiling has no mathematical content beyond the dimensional ceiling;
    its work is interpretive.
  severity: minor
  addressable: true
- description: The empirical spine is a re-analysis of one preprint's published summary statistics plus
    simulation. No new evaluator panel was run, and the corpus instrument available for demonstration
    has adjudicated values only for cells conditioned on disagreement.
  severity: major
  addressable: true
- description: The evidence base is machine evaluators on classification and pairwise preference. Human
    acceptance panels in organizations are neither, and the transfer of the empirical claim to them is
    argued rather than demonstrated.
  severity: major
  addressable: true
- description: Evaluation of this work is single-author.
  severity: moderate
  addressable: true
