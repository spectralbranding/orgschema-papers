spec_version: 0.1.0
meta:
  title: 'Verification Bandwidth Under Correlated Evaluators: What an Effective-Sample-Size Statistic
    Measures in an Acceptance Cascade'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.21891435
  date: '2026-08-11'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - verification
  - effective sample size
  - design effect
  - evaluator panels
  - correlated errors
  - acceptance testing
  - organizational design
  - projection rank.
  abstract: 'Organizational verification is representable as an orthogonal projection whose rank bounds
    what an organization detects about itself, but that formalization assumes one evaluator per acceptance
    test and supplies no procedure for estimating the projection. This paper establishes what a panel
    buys. Every aggregation rule that neither flags what no member flagged nor clears what every member
    flagged has a detection probability lying between the unanimous and the disjunctive rule, and the
    width of that bracket is the probability the panel disagrees, which vanishes as evaluator errors become
    correlated. Above a correlation level, therefore, no aggregation rule recovers detection the evaluator
    set does not collectively possess, however well designed. For evaluators whose inspection directions
    carry a geometric correlation, a closed-form folded dichotomization maps that geometry to the correlation
    of their errors and lies strictly below the identity, so the effective-sample-size statistic already
    used to audit evaluator panels is an upper bound on the rank of the acceptance projection. The statistic
    is borrowed and cited; what is new is that it measures a rank. Two consequences follow: randomly constituted
    panels saturate near the square root of the state-space dimension, and the independently verifiable
    share of a transferred specification is capped accordingly.'
claims:
- id: P1
  type: proposition
  statement: 'For every aggregation rule that neither flags what no member flagged nor clears what every
    member flagged, the unanimous detection region is contained in the rule''s detection region, which
    is contained in the disjunctive detection region, for every deviation distribution. Monotonicity of
    the rule is not required; only the two boundary values are. The content is the asymmetry of the ends:
    the disjunctive blind spot is a subspace that shrinks as evaluators diversify, while the unanimous
    blind spot is a union of subspaces that grows.'
  testable: true
  tested_in_paper: true
  status: not_tested
- id: P2
  type: proposition
  statement: The width of that bracket equals the probability that the panel disagrees. It admits an assumption-free
    union bound in the pairwise disagreement probabilities, an exchangeable corollary linear in one minus
    the mean error correlation, and -- under a single-factor panel with Gaussian deviations -- an exact
    one-dimensional expression. The width is exactly zero at perfect error correlation. Above a correlation
    level, therefore, no aggregation mechanism can be effective however well designed, because every admissible
    rule is trapped in a bracket that has already closed.
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P1
- id: P3
  type: proposition
  statement: For rank-one evaluators the effective rank is at most the smaller of the panel size and the
    state-space dimension, by a first-order coherence bound on the frame operator. More usefully, independently
    and uniformly oriented evaluators saturate at approximately 1.25 times the square root of the state-space
    dimension, not at the dimension itself. Evaluator diversity must therefore be ENGINEERED by deliberately
    spreading inspection directions, not sampled by hiring more reviewers.
  testable: true
  tested_in_paper: true
  status: not_tested
- id: P4
  type: proposition
  statement: 'If a contract specifies r independent acceptance conditions and the receiving executor verifies
    with a panel of effective rank n, the share of the contract that executor can independently verify
    is at most the smaller of n and r, divided by r. Executor-invariance of the acceptance criteria AS
    STATED does not confer executor-invariance of their VERIFICATION: a specification transfers its contract
    but not the capacity to check it, and the gap is what an accountable signatory underwrites.'
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P3
  - P6
- id: P5
  type: proposition
  statement: For isotropic Gaussian deviations the geometric correlation between two inspection directions
    IS the correlation of the inspected components, so the induced correlation of their binary error indicators
    is a folded dichotomization of a bivariate normal, available in closed form, strictly increasing,
    endpoint-fixing, and strictly below the identity.
  testable: true
  tested_in_paper: true
  status: not_tested
- id: P6
  type: proposition
  statement: The effective-sample-size statistic already computed on evaluator error vectors is an UPPER
    BOUND on the rank of the acceptance projection -- that is, on verification bandwidth -- and is exactly
    invertible to it given the panel's marginal error rate and a shared-difficulty correction. The statistic
    is borrowed; what is new is that it measures a rank, and therefore that a quantity computed to audit
    a panel bounds a quantity defined to characterize an organization's capacity to detect its own deviations.
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P5
methodology:
  type: mixed
  design: 'Panel simulation: k evaluators with unit inspection directions carrying a shared-factor geometric
    correlation, each flagging a deviation when the absolute inspected component exceeds a threshold;
    detection rates computed for the unanimous rule, the disjunctive rule, a single evaluator, and randomly
    generated aggregation rules. Closed-form derivation of the induced error correlation as a folded dichotomization
    of a bivariate normal, with an analytic sign proof of monotonicity via the reduction formula for the
    derivative of the bivariate normal integral, checked against quadrature and Monte Carlo. Exact single-factor
    reduction of the bracket width: an equiangular panel makes the inspected components conditionally
    independent given a common factor, collapsing a k-dimensional orthant probability to a one-dimensional
    integral, evaluated by dense fixed-grid quadrature and validated against direct Monte Carlo.'
  analysis:
    software: code/threat1_kill_test.py; code/formal_model_checks.py
    method: Python 3.12, numpy; 200,000 deviations per condition
acceptance:
- claim_id: P1
  criterion: Holds if for every aggregation rule that neither flags what no member flagged nor clears
    what every member flagged, the unanimous detection region is contained in the rule's detection region,
    which is contained in the disjunctive detection region, for every deviation distribution.
  falsification: A cascade whose panel flags a deviation no member flagged, or clears one every member
    flagged.
- claim_id: P2
  criterion: Holds if the width of that bracket equals the probability that the panel disagrees.
  falsification: A panel whose measured error correlation is high and whose choice of aggregation rule
    nonetheless changes detection by more than the bracket permits.
- claim_id: P3
  criterion: Holds if for rank-one evaluators the effective rank is at most the smaller of the panel size
    and the state-space dimension, by a first-order coherence bound on the frame operator.
  falsification: A panel whose independently measured effective rank exceeds the dimensionality of its
    state space, or a large randomly constituted panel materially exceeding the square-root ceiling.
- claim_id: P4
  criterion: Holds if if a contract specifies r independent acceptance conditions and the receiving executor
    verifies with a panel of effective rank n, the share of the contract that executor can independently
    verify is at most the smaller of n and r, divided by r.
  falsification: An executor swap after which the receiving unit demonstrably verifies more independent
    acceptance conditions than its panel's measured effective rank.
- claim_id: P5
  criterion: Holds if for isotropic Gaussian deviations the geometric correlation between two inspection
    directions IS the correlation of the inspected components, so the induced correlation of their binary
    error indicators is a folded dichotomization of a bivariate normal, available in closed form, strictly
    increasing, endpoint-fixing, and strictly below the identity.
  falsification: A panel whose directly measured geometric effective rank exceeds the value computed on
    its error vectors.
- claim_id: P6
  criterion: Holds if the effective-sample-size statistic already computed on evaluator error vectors
    is an UPPER BOUND on the rank of the acceptance projection -- that is, on verification bandwidth --
    and is exactly invertible to it given the panel's marginal error rate and a shared-difficulty correction.
  falsification: A panel whose geometric effective rank, measured directly from its inspection directions,
    exceeds the value computed from its error vectors.
