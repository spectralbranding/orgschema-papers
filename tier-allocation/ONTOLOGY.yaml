    label: "Tier-independence overestimation problem"
    canonical_form: "tier-independence overestimation problem"
    definition: "The error of attributing durable-stock value to a target whose revenue-generating assets are constitutively flow-dependent (high Tier-6), producing goodwill premiums that exceed the substrate that actually transfers."
    first_section: "Six-Tier Architectural Scaffold"

