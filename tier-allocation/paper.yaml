propositions:
  - id: "P1"
    name: "Pre-Deal Surface-Tier Intensity Predicts Post-Acquisition Goodwill Impairment"
    statement: >
      Pre-deal w_6 share predicts elevated post-acquisition goodwill-
      impairment hazard. High-w_6 acquisitions face elevated impairment
      hazard because the acquirer realizes post-deal that what was
      acquired is a flow conduit rather than an accumulating substrate;
      goodwill impairment is the accounting recognition of that mismatch.
    falsification: >
      P1 is falsified if pre-deal advertising-to-total-investment ratio
      fails to predict goodwill-impairment hazard in a Cox proportional
      hazard model with standard M&A controls.
  - id: "P2"
    name: "Long-Horizon Governance Lowers Equilibrium Surface-Tier Share"
    statement: >
      Firms governed by long-horizon principals (founder-CEOs, family-
      firm boards, patient-capital LPs with low effective discount rate
      r_P) exhibit equilibrium w_6 share below otherwise-comparable
      firms governed by short-tenure agents (high effective r_A). The
      comparative static d(w_6*)/dr > 0 implies a one-to-one mapping
      from principal discount rate to optimal surface-tier allocation.
    falsification: >
      P2 is falsified if matched-pair comparisons of founder-CEO firms
      vs professional-CEO firms in the same sector fail to show
      significantly lower w_6 share for founder-CEO governance after
      controlling for size, age, and sector-cohort composition.
  - id: "P3"
    name: "Cost-of-Capital Shocks Shift Allocation Predictably"
    statement: >
      Exogenous shocks to firm-level cost of capital r induce
      directionally predicted shifts in w_6 share. Under the maintained
      Cobb-Douglas (sigma = 1) and gross-substitutes (sigma > 1)
      regimes, d(w_6*)/dr > 0 holds; under sufficiently strong gross
      complementarity (sigma << 1; documented at sigma = .5 in the
      Online Supplement S4), the comparative static can reverse.
    falsification: >
      P3 is falsified if firm-level cost-of-capital shocks (e.g., post-
      ZLB monetary tightening, sector-specific risk-premium shifts)
      fail to predict subsequent shifts in advertising-to-total-
      investment ratio in a difference-in-differences estimation with
      sector-by-time fixed effects.
  - id: "P4"
    name: "Capability-Rotation Stage Moderates Returns to Codification Investment"
    statement: >
      The marginal return to Tier-4 codification investment is moderated
      by the capability-rotation stage of the focal capability, with
      higher returns at advanced rotation stages where prior
      codification has accumulated transferable substrate. The
      Tier-Rotation Curve (Zharnikov 2026ai) supplies the empirical
      proxy for capability-rotation stage; the theoretical mechanism is
      derived locally from the per-tier accumulation model.
    falsification: >
      P4 is falsified if cross-sectional regression of post-codification
      Tier-4 stock returns on rotation-stage proxy (trademark-
      composition ratio) shows no positive interaction effect with
      Tier-4 investment intensity.

