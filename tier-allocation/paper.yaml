abstract: >
  Why do two firms with identical revenues, margins, and aggregate
  investment generate exit multiples of 2x versus 9x revenue and divergent
  post-acquisition performance? Capital allocation theory, dynamic
  capabilities, and marketing-finance literatures have each left the
  direction of investment within a business implicit. This paper
  formalizes the cross-tier allocation problem using a vector w spanning
  five operating tiers that differ in asset durability. Each tier
  accumulates stock according to a differential equation with tier-
  specific decay rates delta_t ranging from .50/year at the organizational
  surface (Tier 6: advertising, paid media) to .05-.10/year at
  foundational layers (Tiers 2-3: business-model architecture, legal
  position). Long-run value is a discounted Cobb-Douglas aggregator
  incorporating Jorgensonian user costs (delta_t + r) and ownership-
  separability weights. Optimizing subject to the per-tier rental-rate
  budget constraint yields the closed-form rule w_t*(r) = alpha_t /
  (delta_t + r) and the comparative static d(w_6*)/dr > 0: higher
  discount rates increase optimal allocation to the high-decay surface
  tier at the expense of durable substrate. Four propositions follow:
  pre-deal surface-tier intensity predicts post-acquisition goodwill
  impairment; long-horizon governance lowers equilibrium surface-tier
  share; cost-of-capital shocks shift allocation predictably; and
  capability-rotation stage moderates returns to codification investment.
  The framework supplies a missing architectural mechanism that integrates
  resource-based, dynamic-capability, and internal-capital-market streams,
  making investment direction --- not merely intensity --- a consequential
  strategic choice.

