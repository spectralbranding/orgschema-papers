methodology:
  type: mixed
  design: 'Calibrate the per-tier decay vector delta_t (Table 1) from independent empirical depreciation
    literatures: delta_6 = .50/year (Belo-Lin-Vitorino 2014, Naik 1999); delta_5 = .15-.20 (Eisfeldt-Papanikolaou
    2013); delta_4 = .12-.20 (Lev-Sougiannis 1996); delta_2/3 = .05-.10 (extrapolated from Wiggins-Ruefli
    2002 persistence, no direct estimate exists). Solve the planner''s interior optimum by Lagrangian
    maximization of ln V_LR(w; r) subject to the Jorgensonian budget constraint Sum_t (delta_t + r) *
    w_t = 1, yielding the closed-form share rule w_t*(r) = alpha_t / (delta_t + r) (lambda = 1 under constant
    returns) and its dollar-weighted observable form; compute the comparative static via the deterministic
    companion script back_of_envelope.py. Extend the share rule with two AI shocks per tier — cost shock
    gamma_t in (0,1] scaling the rental price and durability shock Delta_t lowering the effective decay
    rate (delta_t^eff = delta_t^0 - Delta_t) — re-derive the generalized optimum w_t*(r; gamma, Delta)
    = alpha_t / [gamma_t * (delta_t^eff + r)], and verify comparative statics for P5-P7 via tier_penetration_simulation.py
    (fixed seed numpy.random.seed(42)).'
  analysis:
    software: paper §The delta_t Calibration Table (Table 1)
    method: n/a
