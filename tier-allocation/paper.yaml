- id: P5
  type: proposition
  statement: 'Tier-6 Over-Allocation Paradox (AI). When AI is concentrated at Tier 6 (gamma_6 in (0,1),
    gamma_t = 1 for t<=5, all Delta_t = 0), the optimal Tier-6 share rises monotonically as gamma_6 falls
    (∂dollar-share_6*/∂gamma_6 < 0). Total V_LR rises but the composition shifts toward the lowest-substrate
    tier: short-run EBIT rises while the long-run M&A multiple falls, because delta_6 = .50 is the largest
    decay rate and the multiple prices substrate.'
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
  - P_core
- id: P6
  type: proposition
  statement: Substrate-Building Threshold at Tier 4 (AI). When gamma_4 in (0,1) is paired with Delta_4
    > 0, the long-run Tier-4 stock S_4* = w_4*I/delta_4^eff responds super-linearly to (gamma_4^{-1} *
    Delta_4). The first-positive-Delta_4 threshold — API-rented capacity crossing to proprietary fine-tune
    or owned-weights — produces a discrete LEVEL SHIFT in M&A multiples, not a continuous slope shift;
