meta:
  title: 'Where to Invest Within the Firm: Organizational Tiers, Discount Rates, and AI Penetration'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.20072288
  date: '2026-06-01'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - capital allocation
  - dynamic capabilities
  - brand capital
  - goodwill impairment
  - portfolio choice
  - organizational architecture
  - artificial intelligence
  - AI strategy
  - substrate accumulation
  abstract: 'Why do two firms with identical revenues, margins, and aggregate investment generate exit
    multiples of 2× versus 9× — and why do identical AI investments produce divergent M&A multiples despite
    comparable short-run gains? This paper formalizes the cross-tier allocation problem using a vector
    w spanning operating tiers that differ in asset durability, with tier-specific decay rates δ_t ranging
    from .50/year at the organizational surface (advertising) to .05–.10/year at foundational layers.
    Long-run value is a discounted Cobb-Douglas aggregator incorporating Jorgensonian user costs (δ_t
    + r); optimizing subject to the per-tier rental-rate budget constraint yields the closed-form rule
    w_t*(r) = α_t / (δ_t + r) and the comparative static ∂w₆*/∂r > 0. Four allocation propositions link
    pre-deal surface-tier intensity, governance horizon, cost-of-capital shocks, and capability-rotation
    stage to M&A outcomes. The framework is then extended with two AI-specific shocks per tier — a cost
    shock γ_t and a durability shock Δ_t — yielding the generalized rule w_t*(r; γ, Δ) = α_t / [γ_t ·
    (δ_t^eff + r)] and three further propositions: surface-tier AI raises short-run earnings yet lowers
    long-run multiples; a discrete substrate-building threshold exists at Tier 4; and AI''s net value
    effect flips sign with the principal''s effective discount rate. Investment direction — not merely
    intensity — is the consequential strategic choice.'
