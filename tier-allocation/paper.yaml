results:
- claim_id: P_core
  status: supported
  notes: The tier-allocation mechanism reproduces the ORDINAL structure of observed M&A multiple gaps
    from first principles (Profile B >> C >> A, B/A = 1.93x) without closing the full empirical gap (4-6x
    for specialty B2B vs Tier-6 D2C); the 1.93x is a frictionless-planner benchmark, and the residual
    is the agency-amplified equilibrium (long-horizon principal vs short-tenure agent).
- claim_id: P5
  status: supported
  notes: The penetration-depth ordering of long-run firm-value gain from AI is Tier 2 > Tier 4 > Tier-5-with-substrate
    > Tier-5-API-only ~= Tier 6 ~= Tier 3, following from joint movement of gamma_t < 1 (cost cheapening,
    available everywhere) and Delta_t > 0 (durability gain, available only where substrate accumulation
    is feasible). Tier-2 data-flywheel firms can differ 2x-5x in M&A multiples at identical aggregate
    AI spend.
- claim_id: P6
  status: supported
  notes: The penetration-depth ordering of long-run firm-value gain from AI is Tier 2 > Tier 4 > Tier-5-with-substrate
    > Tier-5-API-only ~= Tier 6 ~= Tier 3, following from joint movement of gamma_t < 1 (cost cheapening,
    available everywhere) and Delta_t > 0 (durability gain, available only where substrate accumulation
    is feasible). Tier-2 data-flywheel firms can differ 2x-5x in M&A multiples at identical aggregate
    AI spend.
limitations:
- description: The back-of-envelope calibration reproduces only the ORDINAL multiple-gap structure; the
    model's 1.93x falls short of the empirical 4-6x gap, closing only once alpha_t is estimated from panel
    data rather than calibrated from m_t separability priors. The cases illustrate the theory's logic;
    they are not statistical tests.
  severity: moderate
  addressable: true
- description: Tier-2/Tier-3 decay rates have no direct empirical estimates and are extrapolated from
    competitive-advantage duration evidence (Wiggins-Ruefli 2002); establishing calibrated delta_2/delta_3
    is a priority for the validation roadmap.
  severity: moderate
  addressable: true
- description: Clean separate identification of gamma_t and Delta_t from public disclosure data may be
    infeasible; empirical implementation may reduce to JOINT identification. P5 and P6 survive joint identification;
    P7 survives in SIGN (the founder-horizon channel operates through r, not through gamma/Delta separately)
    but loses magnitude attribution.
  severity: moderate
  addressable: true
