  type: proposition
  statement: Horizon-Conditional Sign Flip (AI). Deep-tier AI (Tier 4 / Tier 2) extends the principal's
    effective horizon (lowers r); surface-tier AI compressed by algorithmic-feedback / quarterly logic
    raises r. Via the inherited ∂w_6*/∂r > 0, when AI lowers r its value effect is positive in both horizons;
    when AI raises r the effect is positive short-run (margin) but negative long-run (substrate erosion).
    Same aggregate AI spend, opposite long-run value effect. Primary scope sigma >= 1.
  testable: true
  tested_in_paper: true
  status: not_tested
  depends_on:
