  type: proposition
  statement: Organizational tier is a new unit of analysis for resource allocation — distinct from the
    division (internal capital markets), the capability (dynamic capabilities), and the resource (RBV).
    The tier supplies the missing architectural primitive that converts capability DIRECTION into a portfolio
    variable whose optimization depends on principal discount rates.
  testable: false
  tested_in_paper: true
  status: not_tested
- id: P_core
  type: proposition
  statement: 'The frictionless planner''s interior optimum is the closed-form share rule w_t*(r) = alpha_t
    / (delta_t + r), and the comparative static d(dollar-share_6*)/dr > 0 follows directly from the decay-rate
    differential (sign of delta_6 - delta_S > 0): higher-discount-rate principals optimally hold lower
    stock-tier shares and higher surface-tier shares.'
  testable: true
  tested_in_paper: true
  status: not_tested
- id: P1
