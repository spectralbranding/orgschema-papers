        rendered PDF rather than the source: literal underscores on the page
        fell from 120 to 20, and all 20 that remain are file names inside URLs,
        which must keep them. Currency dollar signs are now escaped. They had
        been inert -- pandoc will not open math on `$1.2 billion to $`, whose
        span ends in a space -- but the new delimiters changed the pairing, one
        currency sign found a valid closer, and half a page of the
        illustrative-cases section set as one math-italic run. Caught on the
        page by the author; the PDF render gate now carries a MATH-SWALLOW check
        for the class, which no source-level gate can see.
      outcome: >
