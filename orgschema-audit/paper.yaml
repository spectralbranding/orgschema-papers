methodology:
  type: empirical
  design: 'The six-step audit: proceed one level per step from the top (L0→L5). At each level examine
    the specifications, classify the result as healthy or failing against explicit criteria, and prescribe
    a fix with an estimated duration. Top-down ordering operationalizes Proposition 1 — there is no value
    auditing procedures (L3) if experience contracts (L0) are absent. Cascade-position prioritization
    of findings: order remediation by the level at which each gap originates (closer to L0 = higher priority),
    rather than by symptom severity or financial exposure. AI-assisted execution (optional): an LLM ingests
    scattered documentation to draft a six-level specification (characterization testing of an unspecified
    organization), traverses the cascade to validate bidirectional traceability, and flags lower-level
    specs lacking upward justification as waste candidates. Human validation of extracted specs is mandatory.'
acceptance:
- claim_id: P5
  criterion: Holds if (Proposition 1 — Cascade-Position Prioritization) Specification failures at higher
    cascade levels (closer to L0) predict greater operational dysfunction than failures at lower levels,
    because higher-level failures invalidate the justification for all dependent levels; an absent or
    incoherent L0 experience contract renders all downstream specifications unjustified.
  falsification: Falsified if field studies show L4 or L5 failures predict operational outcomes more strongly
    than L0 or L1 failures, after controlling for organization size and sector.
- claim_id: P6
  criterion: Holds if (Proposition 2 — Bidirectional Traceability Completeness) Organizations in which
    every operational parameter traces upward to an experience contract AND every experience contract
    traces downward to an implementing procedure exhibit lower operational-failure rates, faster expansion,
    and more successful automation initiatives than organizations with partial or unidirectional traceability.
  falsification: Falsified if organizations with complete bidirectional traceability show no operational-outcome
    difference vs partial-traceability organizations over a 12-month period.
