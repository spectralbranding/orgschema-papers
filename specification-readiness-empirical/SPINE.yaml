    relationship: tests
    spine_nodes: [P1, P3, P4, P5, P6, P7, O1]
    note: >-
      EMPIRICAL COMPANION. This paper operationalizes 2026am's theoretical
      propositions P1–P5 (the information-theoretic multi-interface specification
      model) as testable archival hypotheses H1–H5, restating its constructs (the
      substrate S, the perception-weight vectors w_i, the rendering operator, the
      coherence condition, the function-as-friction-tax mechanism) and its
      boundary table. SHARED-SEED relationship: both papers draw on the SAME
      pre-registered Monte Carlo simulation infrastructure at the SAME fixed seed
      (np.random.seed(20260525)) and cite the SAME code companion (concept DOI
      10.5281/zenodo.20379981); the phase-shift mechanism test reported here (O1,
      F1, m_phase_shift) is the same simulation 2026am rests on. This paper
      "tests" 2026am in the spine sense (turns its propositions into falsifiable
      empirical predictions); it does not contradict it.

