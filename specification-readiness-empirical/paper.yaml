abstract: >
  This paper introduces specification readiness — the degree to which a
  firm's commitments are codified in versioned, machine-readable, queryable
  form — as a new strategic construct and supplies a scalable archival
  operationalization. Drawing on an information-theoretic model of
  multi-interface architecture (Zharnikov 2026am), the construct is argued
  to substitute query-based alignment for costly interface-maintenance
  functions, reducing a structural friction tax, accelerating brand-capital
  accumulation, lowering cross-stakeholder valuation dispersion, and raising
  returns to artificial-intelligence deployment. The primary measure is a
  continuous Specification Coherence Index built from year-over-year cosine
  similarity of 10-K narrative embeddings; a four-event sharp index supplies
  robustness. Five hypotheses (H1-H5) link the construct to these outcomes
  for US public firms 2010-2025, identified by within-firm continuous
  treatment, staggered difference-in-differences (Callaway and Sant'Anna
  2021; Goodman-Bacon 2021), regulatory-compliance instruments, and
  advertising-cessation event studies, with Oster (2019) bounds.
  Pre-registered Monte Carlo mechanism tests confirm the friction-tax phase
  shift. Three contributions follow: a first scalable archival measure of
  specification readiness, a reusable identification template pairing
  continuous textual treatment with sharp codification events, and formal
  evidence that specification readiness moderates the AI augmentation
  paradox.

claims:
  - id: H1
    type: hypothesis
    description: >
      Specification Readiness Reduces Functional Friction Tax. Within firms,
      a one-standard-deviation increase in SCI is associated with
      approximately one percentage point reduction in the functional
      friction-tax ratio (interface-maintaining SG&A composition / total
      revenue); Cohen's d approximately .5; pre-registered coefficient
      magnitude beta approximately -.08.
    status: proposed
    falsification: >
      H1 is falsified if SCI shows no significant negative relationship with
      functional friction-tax ratio after firm and industry-year fixed
      effects, under the pre-registered specification.

  - id: H2
    type: hypothesis
    description: >
      Specification Readiness Accelerates Brand-Capital Accumulation.
      Within firms, higher SCI predicts faster Belo-Lin-Vitorino
      brand-capital stock accumulation per dollar of advertising spend;
      Cohen's d approximately .3; pre-registered coefficient magnitude
      approximately 12 percent acceleration per standard deviation.
    status: proposed
    falsification: >
      H2 is falsified if SCI shows no significant positive relationship
      with brand-capital accumulation rate after firm fixed effects and
      controls, under the pre-registered specification.

  - id: H3
    type: hypothesis
    description: >
      Multi-Interface Incoherence Raises Cross-Stakeholder Valuation
      Dispersion. Within firms, higher cross-interface linguistic
      contradiction (10-K vs Glassdoor vs analyst notes) predicts greater
      cross-stakeholder valuation dispersion; Cohen's d approximately .4;
      pre-registered coefficient magnitude approximately 10 percent
      dispersion increase per standard deviation of contradiction.
    status: proposed
    falsification: >
      H3 is falsified if cross-interface contradiction shows no significant
      positive relationship with valuation dispersion after firm and
      industry-year fixed effects.

  - id: H4
    type: hypothesis
    description: >
      Substrate Readiness Conditions AI Deployment ROI. Within firms,
      pre-deployment SCI moderates the effect of AI deployment on firm
      productivity; Cohen's d approximately .5; pre-registered coefficient
      magnitude approximately 15 percent AI-ROI increase per standard
      deviation of pre-deployment SCI.
    status: proposed
    falsification: >
      H4 is falsified if the interaction term between pre-deployment SCI
      and AI deployment shows no significant positive coefficient on
      productivity outcomes after firm fixed effects.

  - id: H5
    type: hypothesis
    description: >
      Pull Architecture Shrinks Function-as-Friction-Tax. Event-study
      analysis of advertising-spend cessation events shows sharper negative
      cumulative abnormal returns for low-SCI firms than high-SCI firms;
      pre-registered CAR differential approximately -15 percentage points;
      Cohen's d approximately .7.
    status: proposed
    falsification: >
      H5 is falsified if the CAR differential between high-SCI and low-SCI
      firms around advertising-cessation events is not statistically
      significant or shows the opposite sign.

