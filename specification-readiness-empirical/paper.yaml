companion_code:
  repository: "https://github.com/spectralbranding/orgschema-papers/tree/main/specification-readiness/code/"
  description: >
    Companion computation repository SHARED with Paper A (Zharnikov 2026am).
    Monte Carlo friction-tax simulation and regression-identification power
    simulation are executed under fixed seed 20260525 against the rendering
    operator and friction-tax derivations in 2026am. Outputs cited as the
    mechanism-test evidence in this paper. The five hypotheses H1-H5 share
    the underlying theoretical mechanism with the five propositions P1-P5
    in 2026am, so the simulation infrastructure is reused without
    duplication. Run command: cd specification-readiness/code &&
    bws run -- uv run python friction_tax_montecarlo.py &&
    bws run -- uv run python push_pull_regression_sim.py

