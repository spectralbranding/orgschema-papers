methodology:
  type: mixed
  design: 'The continuous-SCI primary measure: parse each firm''s 10-K Item 1 (Business) and Item 7 (MD&A)
    via SEC EDGAR XBRL, strip non-narrative content, compute contextual transformer embeddings (BERT-base-uncased
    primary; Loughran-McDonald dictionary cosine secondary), and take cosine similarity between the t
    and t−1 section embeddings as the within-firm year-over-year SCI ∈ [−1,1] rescaled to [0,1] — a substrate-stability
    signal isolated from cross-sectional disclosure-strategy confounds. The primary identification arm:
    continuous SCI (one-year-lagged) as a within-firm continuous treatment in a panel regression with
    firm, year, and Fama-French-48-industry×year fixed effects, firm-year controls, and firm-clustered
    standard errors; complemented by a staggered-DiD robustness arm (Callaway-Sant''Anna ATT(g,t) + Goodman-Bacon
    decomposition + Sun-Abraham) on the four sharp SCI codification events, regulatory-compliance IV supplements
    (SOX §404, EEOC mandates; CEO-transition IV for H4), and Oster (2019) δ-bound threats diagnostics.
    The Monte Carlo mechanism test: simulate push friction-tax μ_push and pull friction-tax μ_pull across
    the parameter grid at fixed seed 20260525, evaluate the qualitative ordering μ_push ≫ μ_pull, the
    phase-shift threshold α*, and six pre-registered falsification checks (directional monotonicity, dimensionality,
    pull-floor, functional-form, N-scaling), logging PASS/FAIL to POST_EXPERIMENT_REPORT.md.'
  analysis:
    software: design specified in §Data and Measurement — Specification Coherence Index (SCI)
    method: Python 3.12 + uv (numpy 2.2.2, scipy 1.14.0, statsmodels 0.14.4)
