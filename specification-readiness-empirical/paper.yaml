limitations:
- description: 'The mechanism tests are simulations, not archival evidence: they establish that the design
    CAN detect the pre-registered effects if present, not that the effects are present in real firms.
    Archival panel confirmation requires the companion empirical study (Paper B v2.0), in execution.'
  severity: moderate
  addressable: true
- description: Partial coverage of Compustat XAD (non-missing for ~25–50% of firm-years, concentrated
    in consumer-facing sectors) restricts H2 and H5 to the XAD-observed subsample and requires Heckman-style
    sample-selection correction.
  severity: moderate
  addressable: true
- description: The four-event sharp SCI is cross-sectionally sparse (~20–50 firms with verifiable codification
    events); the continuous and sharp arms estimate somewhat different parameters (average within-firm
    coherence shift vs ATT of a sharp codification event), so divergence requires investigation of the
    differential treatment populations.
  severity: moderate
  addressable: true
- description: Measurement noise in the H3 cross-interface contradiction index (may capture linguistic-register
    rather than substantive contradictions) and in the H4 AI-deployment dating (the 2% job-posting threshold
    is conventional; internal deployment may precede hiring signals) biases toward the null and cannot
    be fully eliminated.
  severity: moderate
  addressable: true
- description: 'External validity is bounded by the US-public-firm setting: the Compustat universe excludes
    private, foreign-listed, and non-SEC-filing mid-market firms, and the SCI relies on US 10-K infrastructure;
    cross-country extension requires analogous machine-readable disclosure regimes and independent construct-validation,
    and is future work.'
  severity: moderate
  addressable: true
- description: The design does not directly measure the latent perception-weight vectors w_i; it identifies
    the model's predictions only through their downstream consequences. Direct measurement (conjoint-analysis
    profiles of recipient classes) requires experimental methods outside the archival framework and is
    flagged as a complementary future contribution.
  severity: moderate
  addressable: true
- description: 'The economic-change covariate vector absorbs the measured part of event density, not all
    of it: unreported and unmeasured events remain in the residual, and no residualised or expected-modification
    control exists in the prior literature to adopt. The design can therefore bound the event-absence
    confound and report its magnitude, not remove it, and the SCI coefficient must be read as conditional
    on the covariate set rather than as purified of event density.'
  severity: moderate
  addressable: true
