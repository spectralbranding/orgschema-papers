meta:
  title: 'Specification Readiness: Measuring an Architectural Antecedent of Functional Friction and AI
    Returns'
  authors:
  - name: Dmitry Zharnikov
    orcid: 0009-0000-6893-9231
    affiliation: Independent Researcher
  doi: 10.5281/zenodo.20384084
  date: '2026-08-09'
  venue: Preprint
  license: CC-BY-4.0
  keywords:
  - specification readiness
  - multi-interface architecture
  - friction tax
  - staggered difference-in-differences
  - organizational coupling
  abstract: 'This paper introduces *specification readiness* — the degree to which a firm''s commitments
    are codified in versioned, machine-readable, queryable form — as a new strategic construct and supplies
    a scalable archival operationalization. Drawing on an information-theoretic model of multi-interface
    architecture [@zharnikov-2026am-specification-readiness-friction], the construct is argued to substitute
    query-based alignment for costly interface-maintenance functions, reducing a structural friction tax,
    accelerating brand-capital accumulation, lowering cross-stakeholder valuation dispersion, and raising
    returns to artificial-intelligence deployment. The primary measure is a continuous Specification Coherence
    Index built from year-over-year cosine similarity of 10-K narrative embeddings; a four-event sharp
    index supplies robustness. Five hypotheses (H1–H5) link the construct to these outcomes for US public
    firms 2010–2025, identified by within-firm continuous treatment, staggered difference-in-differences
    [@callaway-2021-differenceindifferences-with-multiple; @goodmanbacon-2021-differenceindifferences-with-variation],
    regulatory-compliance instruments, and advertising-cessation event studies, with Oster [-@oster-2019-unobservable-selection-coefficient]
    bounds. Pre-registered Monte Carlo mechanism tests (12.96 million trials; $\alpha^* = .91$; Cohen''s
    d = 88.4) confirm the friction-tax phase shift. Three contributions follow: a first scalable archival
    measure of specification readiness, a reusable identification template pairing continuous textual
    treatment with sharp codification events, and formal evidence that specification readiness moderates
    the AI augmentation paradox.'
