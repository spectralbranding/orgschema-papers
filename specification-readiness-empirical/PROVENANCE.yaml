versions:
  - version: "1.0.0"
    date: "2026-05-25"
    doi: "[DOI reserved at upload]"
    notes: >
      Initial working paper release. Companion empirical operationalization
      of Zharnikov (2026am) Specification Readiness and Endogenous Friction.
      Develops the Specification Coherence Index (SCI) as the first scalable
      archival measure of specification readiness; pairs continuous 10-K
      linguistic-coherence treatment with a four-event sharp robustness
      index (handbook publication, ISO 9001 certification, design-system
      release, investor-day overhaul); specifies a multi-arm identification
      strategy combining within-firm continuous treatment, staggered
      difference-in-differences (Callaway-Sant'Anna 2021; Goodman-Bacon
      2021), regulatory-compliance instrumental variables (Sarbanes-Oxley
      Section 404 phase-in; EEOC reporting mandates), and event studies
      around advertising-spend cessation, with Oster (2019) omitted-variable
      bounds. Five hypotheses H1-H5 are stated as empirical readings of the
      five comparative-statics propositions P1-P5 in 2026am, each with a
      directional prediction, primary and secondary proxy, identification
      strategy, threats register, pre-registered economic magnitude, and
      Cohen's d. Pre-registered Monte Carlo mechanism test (12.96 million
      trials under fixed seed 20260525) confirms the friction-tax phase
      shift; regression-identification simulation confirms power greater
      than .80 for all five hypotheses at the pre-registered effect sizes.
      Archival panel implementation is in execution as future work
      (companion paper v2.0 / Paper C). Per the project version-bump rule,
      pre-Zenodo iterations remain v1.0.0; the version field will only
      increment when a new Zenodo DOI is minted.
    file: "paper.md"

