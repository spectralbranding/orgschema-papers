propositions:
  - id: "P1"
    name: "Tier-6 Over-Allocation Paradox"
    statement: >
      When AI is concentrated at Tier 6 with gamma_6 in (0, 1) and
      gamma_t = 1 for t <= 5 and all Delta_t = 0, the optimal dollar-
      weighted Tier-6 share rises monotonically as gamma_6 falls:
      d(dollar-share_6*)/d(gamma_6) < 0. Surface-only cost reductions
      raise short-run earnings while lowering long-run M&A multiples
      by shifting allocation toward the lowest-persistence tier.
    falsification: >
      P1 is falsified if firms with exclusively Tier-6 AI deployment
      show no negative 36-month forward M&A-multiple shift conditional
      on a positive contemporaneous EBIT shift, in samples matched on
      aggregate AI investment intensity.
  - id: "P2"
    name: "Substrate-Building Threshold at Tier 4"
    statement: >
      When gamma_4 in (0, 1) is paired with Delta_4 > 0 (proprietary
      fine-tune or owned-weights configuration), the long-run Tier-4
      stock S_4* exhibits a super-linear response above the Delta_4 = 0
      threshold: dS_4*/dDelta_4 > 0. The first-positive-Delta_4
      threshold produces a level shift in M&A multiples rather than a
      continuous slope shift because substrate accumulation is
      structurally admissible only above the threshold.
    falsification: >
      P2 is falsified if firms crossing the disclosure-coded Delta_4
      threshold show no level shift in M&A multiples relative to firms
      remaining at Delta_4 = 0, in samples matched on aggregate AI
      investment intensity.
  - id: "P3"
    name: "Horizon-Conditional Sign Flip"
    statement: >
      AI deployment at deep tiers (Tier 4, Tier 2) extends the
      principal's effective decision horizon (lowers effective r),
      shifting allocation away from Tier 6 toward substrate tiers and
      producing positive AI value effects in both short and long run.
      AI deployment at shallow tiers (Tier 6), compressed by
      algorithmic-feedback loops and shareholder-quarterly logic, raises
      effective r, shifting allocation toward Tier 6 and producing
      negative long-run AI value effects despite positive short-run EBIT.
      The sign of AI's net value effect flips with sign(dr/d(AI
      deployment type)), via the inherited d(dollar-share_6*)/dr > 0.
    falsification: >
      P3 is falsified if no sign flip in the long-run AI-value effect
      is observed between long-horizon and short-horizon principals at
      matched aggregate AI spend, conditional on sigma >= 1 prevailing
      in the sample's tier-complementarity structure.

