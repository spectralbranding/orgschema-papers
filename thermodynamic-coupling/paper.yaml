abstract: >
  Organizations incur substantial friction when guessing recipients' need
  profiles and pushing outputs toward those guesses. This paper develops an
  information-theoretic model treating alignment friction as endogenous to
  specification codification. Architecture decomposes into three layers: a
  codified specification substrate encoding commitments across six ontological
  tiers, an interface layer defined by recipient-class perception-weight vectors,
  and a function layer whose headcount and spend constitute a measurable tax on
  specification gaps. In push regimes, energy loss scales with cross-entropy
  between guessed and actual need profiles. In pull regimes, consumption-layer
  AI lets recipients query the specification directly, collapsing misalignment
  toward zero as codification completeness rises. Recipient classes are
  architectural primitives whose distinct perception geometries impose coherence
  conditions across interfaces. Four contributions follow. First, push-pull cost
  asymmetry is formalized as a structural analog to Shannon's cross-entropy.
  Second, geometric machinery links specification to interface rendering. Third,
  functional friction is a consequence of specification investment rather than
  governance choice. Fourth, specification readiness is the critical moderator
  of AI returns, distinguishing Substrate-Operator execution
  (specification-constrained, coherent across interfaces) from Surface-Operator
  execution (locally fluent, globally inconsistent). Specification codification
  is sequentially prior to governance and capability deployment; the theory
  generates predictions distinct from transaction-cost economics, stakeholder
  theory, and existing AI-augmentation scholarship.

claims:
  - id: P1
    type: proposition
    description: >
      Interface Coherence: Interface coherence — measured as the minimum cosine
      similarity between normalized renderings across pairs of recipient classes —
      is non-decreasing in specification consistency across tiers. Formally, if
      specification S is consistent across tiers t_1, t_2 (i.e., the value
      assigned to each attribute is identical across tier renderings), then
      min_{i,j} cos(R_i(S, w_i), R_j(S, w_j)) >= theta for some threshold
      theta > 0; if specification is inconsistent, coherence is unbounded below.
      Comparative static: d(min_{i,j} cos(·))/dc >= 0, where c is specification
      codification completeness. Higher codification produces weakly greater
      inter-interface coherence.
    status: proposed
    falsification: >
      P1 is falsified if higher specification codification completeness produces
      no measurable increase in inter-interface coherence (minimum cosine
      similarity across recipient-class rendering pairs) in a cross-firm
      archival panel, after controlling for firm size, industry, and age.

  - id: P2
    type: proposition
    description: >
      Friction-Tax Scaling: The functional friction tax T scales positively with
      specification gap g and inversely with codification investment c. Formally,
      T(g, c) = alpha * g(c)/c + beta, where g(c) is non-increasing in c (more
      codification reduces the gap). Comparative static: dT/dc < 0 for all
      interior points of the codification domain. Increasing specification
      investment reduces the aggregate friction tax across all N interfaces.
    status: proposed
    falsification: >
      P2 is falsified if specification codification investment shows no
      significant negative relationship with aggregate functional headcount
      and spend in interface-maintaining roles in a panel of firms with
      varying codification levels, controlling for firm size and industry.

  - id: P3
    type: proposition
    description: >
      Push-Pull Cost Asymmetry: Under the cross-entropy structural analog,
      push-regime alignment cost C_push = H(p, q), where p is the recipient's
      actual need profile and q is the firm's guessed need profile. Pull-regime
      alignment cost C_pull = H(p, S|p), which approaches 0 as specification
      codification completeness approaches 1 and recipient query capability
      approaches 1. Comparative static: d(C_push - C_pull)/dc > 0. The cost
      asymmetry between push and pull grows strictly with codification
      investment. At full codification, pull dominates push at every interior
      point of the parameter space.
    status: proposed
    falsification: >
      P3 is falsified if firms with higher specification codification show no
      significant reduction in push-proxy magnitudes (XAD/SALE ratio, roadshow
      frequency, recruiter headcount intensity) relative to pull-proxy magnitudes
      (brand equity without advertising, AI-queryable disclosure uptake) in a
      cross-sectional or panel design.

  - id: P4
    type: proposition
    description: >
      AI Phase-Shift Boundary: The fraction of firms operating in a viable pull
      regime is monotonically increasing in alpha, the consumption-layer AI
      penetration parameter. For alpha = 0, only domains with pre-AI codified
      substrates (financial accounting, manufacturing parts catalogs) operate in
      pull. For alpha >= alpha* approximately .6-.9 (domain-dependent), nearly
      all coupling domains become pull-viable. Comparative static:
      d(pull-viable fraction)/d(alpha) > 0. Substrate-Operator execution —
      whether by a human or AI querying the specification — realizes the pull
      regime; Surface-Operator execution — locally fluent but globally inconsistent
      output produced without specification grounding — does not.
    status: proposed
    falsification: >
      P4 is falsified if AI penetration at the consumption layer shows no
      significant positive relationship with the proportion of firms that
      reduce push-proxy magnitudes, or if Substrate-Operator and Surface-Operator
      deployments produce indistinguishable interface-coherence outcomes in a
      matched-firm comparison.

  - id: P5
    type: proposition
    description: >
      Specification Readiness Moderates AI ROI: AI return on investment, holding
      AI spend constant, is monotonically increasing in pre-AI specification
      codification c. Formally, d(ROI_AI)/dc|_{spend} > 0. Comparative static:
      d(ROI_AI)/d(spend)|_{c} is bounded above by a function of c — high AI
      spend without codification produces bounded marginal returns. Specification
      readiness moderates the substitutability of human Substrate-Operators by AI
      Substrate-Operators: firms with codified specifications realize higher AI
      returns because the AI-substitutable share of agent roles is larger. The
      complementary investment is codification of the specification substrate
      that enables AI Substrate-Operator execution rather than Surface-Operator
      substitution.
    status: proposed
    falsification: >
      P5 is falsified if pre-AI specification codification shows no significant
      positive moderating effect on the relationship between AI adoption spend
      and firm performance outcomes in a panel with lagged AI investment controls,
      or if the interaction term between codification and AI spend is not
      significant after controlling for firm size, industry, and prior performance.

